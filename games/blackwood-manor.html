     • ПРОТОКОЛ Sharky (postMessage): принимает init/start/pause,
       шлёт ready/score/gameover; автостарт ВНЕ ленты по таймеру.

   Игра = это ядро + один МОДУЛЬ-СЦЕНА (механика, регистрируется
   через Engine.register) + объект CONFIG (тема/правила/ассеты).
   Сборщик (build.js) встраивает все три части в один .html —
   игры в Sharky крутятся в sandbox-iframe через srcdoc, поэтому
   внешние <script> и относительные ассеты недопустимы.

   ── КОНТРАКТ СЦЕНЫ ──
   Engine.register('genre', function(engine, cfg){
     return {
       init(){},          // одноразовая настройка (ассеты+геометрия готовы)
       reset(){},         // (пере)собрать игровое состояние; на каждый запуск
       layout(L){},       // пересчёт геометрии из {W,H,headerH}
       update(dt){},      // продвинуть механику (таймер ведёт ЯДРО)
       render(ctx){},     // нарисовать поле (фон/HUD/оверлей рисует ЯДРО)
       pointerDown(p){},  // p = {x,y} в пикселях canvas
       pointerUp(e){},    // e = {x,y,downX,downY,dx,dy,dist,dir}
       pointerMove(p){},
       key(k){},          // k = event.key
     };
   });

   ── API ЯДРА для сцены (engine.*) ──
     ctx, W, H, headerH, cfg, theme, rules, score   (только чтение)
     img(name) -> HTMLImageElement
     beep(freq,dur,type,vol)
     burst(x,y,opts)                  // частицы (по умолчанию — как в match3)
     addScore(n) / setScore(v)        // меняет счёт + шлёт его в ленту
     gameOver()                       // завершить забег (смерть). Таймер тоже завершает.

(function (global) {

  /* ═══════════ CONTROLS: универсальный слой управления (CONFIG.controls) ═══════════
     Все схемы транслируются в ВИРТУАЛЬНЫЕ КЛАВИШИ → работают с любой сценой.
     controls = {
       scheme: 'joystick' | 'tapmove' | 'tapaction' | 'aim' | null(=только кнопки),
       joystick: { side:'left', radius:0.09, deadzone:0.3 },
       tapAction: 'jump',                     — что делает тап (схема tapaction)
       aim: { fire:'attack' | false },        — держишь палец/мышь = огонь в ту сторону

  const ACT2KEY = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown',

  function ctlRelease(key) { keys.delete(key); }
  function initControls(c) {
    ctlCfg = c || null;

  }
  function layoutCtlButtons() {
    ctlBtns = [];
    if (!ctlCfg || !ctlCfg.buttons) return;
    const r = Math.min(W, H) * 0.075, m = r * 0.7;
    for (let i = 0; i < ctlCfg.buttons.length; i++) {
      const b = ctlCfg.buttons[i];
      // свои координаты (в долях экрана) или авто-дуга справа снизу
      const x = b.x != null ? b.x * W : W - m - r - (i % 2) * (r * 2.3);
      const y = b.y != null ? b.y * H : H - m - r - Math.floor(i / 2) * (r * 2.3);

  function ctlDown(p) {   // true = событие съедено слоем управления

      if (inZone && !joy) { joy = { id: p.id, cx: p.x, cy: p.y }; return true; }

      ctlHeld[p.id] = key; ctlPress(key); return true;
    }

  function ctlMove(p) {
    CTL.mouse.x = p.x; CTL.mouse.y = p.y;

      const dz = (ctlCfg.joystick && ctlCfg.joystick.deadzone) || 0.3;

      if (len > 1) { dx /= len; dy /= len; }

      joy.dx = dx; joy.dy = dy;
      // 8-way → клавиши
      (dx < -dz ? ctlPress : ctlRelease)('ArrowLeft');
      (dx > dz ? ctlPress : ctlRelease)('ArrowRight');
      (dy < -dz ? ctlPress : ctlRelease)('ArrowUp');
      (dy > dz ? ctlPress : ctlRelease)('ArrowDown');
    }
    if (CTL.scheme === 'aim' && CTL.aim.active) { CTL.aim.x = p.x; CTL.aim.y = p.y; }

  // tap-to-move: каждый кадр сравниваем цель с экранной позицией персонажа
  // (сцена сообщает её через engine.reportPlayerScreen)
  function ctlUpdate() {
    if (!ctlCfg || CTL.scheme !== 'tapmove') return;
    if (!tapTarget || !CTL.playerScreen) {
      if (!tapTarget) { ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(ctlRelease); }
      return;
    }
    const px = CTL.playerScreen.x, py = CTL.playerScreen.y;
    const dx = tapTarget.x - px, dy = tapTarget.y - py;
    const dead = Math.min(W, H) * 0.04;
    (dx < -dead ? ctlPress : ctlRelease)('ArrowLeft');
    (dx > dead ? ctlPress : ctlRelease)('ArrowRight');
    (dy < -dead * 2.2 ? ctlPress : ctlRelease)('ArrowUp');     // вверх — с большим порогом (прыжок/лестницы)
    (dy > dead * 2.2 ? ctlPress : ctlRelease)('ArrowDown');

  function drawControls() {
    if (!ctlCfg) return;
    // кнопки
    for (let i = 0; i < ctlBtns.length; i++) {
      const b = ctlBtns[i];
      ctx.fillStyle = keys.has(b.key) ? 'rgba(255,255,255,0.34)' : 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold ' + Math.round(b.r * 0.8) + 'px sans-serif';

      if (joy) {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(joy.cx, joy.cy, R, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(joy.cx + (joy.dx || 0) * R, joy.cy + (joy.dy || 0) * R, R * 0.42, 0, 7); ctx.fill();
      } else {

        const gx = side === 'right' ? W * 0.78 : W * 0.22, gy = H * 0.82;
        ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(gx, gy, R, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(gx, gy, R * 0.42, 0, 7); ctx.stroke();

      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tapTarget.x, tapTarget.y, 12, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(tapTarget.x, tapTarget.y, 3, 0, 7); ctx.fill();
    }

    if (CTL.scheme === 'aim' && CTL.aim.active) {
      ctx.strokeStyle = 'rgba(255,120,120,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(CTL.aim.x, CTL.aim.y, 11, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(CTL.aim.x - 16, CTL.aim.y); ctx.lineTo(CTL.aim.x + 16, CTL.aim.y);
      ctx.moveTo(CTL.aim.x, CTL.aim.y - 16); ctx.lineTo(CTL.aim.x, CTL.aim.y + 16); ctx.stroke();
    }
  }

  // ── объект, который получает сцена ──
  const api = {
    get ctx() { return ctx; },
    get W() { return W; },
    get H() { return H; },
    get headerH() { return headerH; },
    get cfg() { return cfg; },
    get theme() { return theme; },
    get rules() { return rules; },
    get score() { return score; },
    get timeLeft() { return timeLeft; },
    get duration() { return duration; },
    get state() { return state; },
    get keys() { return keys; },          // живой Set зажатых клавиш
    get ctl() { return CTL; },            // слой управления: axis/aim/mouse/scheme

    img: function (name) { return IMG[name]; },
    beep: beep,
    burst: burst,
    addScore: addScore,
    setScore: setScore,
    gameOver: gameOver,
    // ── сохранение прогресса (лента хранит в Supabase per user+game) ──

    loadState: function () { return savedState; },

    addTime: addTime,

    scenes: {},
    register: function (name, factory) { this.scenes[name] = factory; },

  Engine._ctl = CTL;   // отладка слоя управления

  // Применить сохранение и пересобрать забег (эмуляция init.save для тестов).

  // ════════════════════════════════════════════ BOOT
  function boot(config) {

    duration = rules.duration || 60;
    timed = (rules.mode || 'timed') === 'timed';
    cv = document.getElementById('c'); ctx = cv.getContext('2d');
    if (theme.accent) document.documentElement.style.setProperty('--ac', theme.accent);
    if (theme.bgBottom || theme.bgTop) document.body.style.background = theme.bgBottom || theme.bgTop;

    const factory = Engine.scenes[config.genre];
    if (!factory) { console.error('Engine: нет сцены для жанра', config.genre); return; }
    scene = factory(api, config);
    Engine._scene = scene;   // для отладки/тестов
    initControls(config.controls);

      setTimeout(function () {

    });

  // ════════════════════════════════════════════ ГЕОМЕТРИЯ
  function resize() {

    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;            // чёткий пиксель-арт
    headerH = Math.max(48, Math.min(96, H * 0.13));
    layoutCtlButtons();
    if (scene && scene.layout) scene.layout({ W: W, H: H, headerH: headerH });
  }

  // ════════════════════════════════════════════ АССЕТЫ
  function loadImages(map) {
    const names = Object.keys(map);
    imgTotal = names.length; imgLoaded = 0;
    if (imgTotal === 0) { onReady(); return; }
    names.forEach(function (n) {
      const im = new Image();
      im.onload = im.onerror = function () { imgLoaded++; if (imgLoaded >= imgTotal) onReady(); };
      const v = map[n];
      // поддержка готовых data-URL (jpg/webp/png) и «сырого» base64 (по умолч. png)
      im.src = (typeof v === 'string' && v.lastIndexOf('data:', 0) === 0) ? v : ('data:image/png;base64,' + v);
      IMG[n] = im;
    });
  }

    resize();
    try {
      if (scene.init) scene.init();
      newRun();
    } catch (e) { console.error('Engine onReady scene error:', e); }

    try { const v = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim(); if (v) theme.accent = v; } catch (e) {}
    send({ type: 'ready' });
    if (pendingStart) start();
  }

  // ════════════════════════════════════════════ ЖИЗНЕННЫЙ ЦИКЛ
  function newRun() {

    if (scene.reset) scene.reset();

  function resetTimer(sec) { if (sec) duration = sec; timeLeft = duration; }
  // Добавить/отнять время (штрафы и бонусы времени)
  function addTime(sec) { timeLeft = Math.max(0.01, Math.min(duration, timeLeft + sec)); }

  function addScore(n) { setScore(score + n); }
  function setScore(v) {
    score = v; if (score > best) best = score;
    send({ type: 'score', value: score });
  }

  // ════════════════════════════════════════════ РЕНДЕР
  function render() {

  function drawBg() {

      const dh = bg.naturalHeight * (W / bg.naturalWidth);

  function drawHUD() {
    ctx.textBaseline = 'middle';
    const cy = headerH / 2;
    const font = theme.font || "Georgia, serif";
    let textX = 16;
    const ico = theme.hudIcon && IMG[theme.hudIcon];
    if (ico && ico.complete) {
      const ic = Math.min(34, headerH * 0.5);

      ctx.strokeStyle = 'rgba(244,227,176,0.6)'; ctx.lineWidth = 1.5; rr(bx, by, bw, bh, 7); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px ' + font; ctx.textAlign = 'center';

  function drawOver() {

    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,

    const t = audioCtx.currentTime;

      if (state === 'over') { restart(); return; }

      pointers[e.pointerId] = { x: p.x, y: p.y };

/* ============================================================
   СЦЕНА: hidden (hidden.js) — поиск предметов
   ------------------------------------------------------------
   Статичная сцена (фон-картинка или процедурная «куча хлама»),
   список целей, тап по зоне предмета. Таймер, подсказки с лимитом,
   комбинирование найденных предметов по рецептам (даёт бонус-цель).

   CONFIG.hidden = {
     bg: имя-ассета | null (процедурный хлам),
     clutter: 60,                        — сколько мусорных фигур
     decor:[{img,x,y,s,rot}],            — картинки-декорации поверх фона (s — доля min(W,H))
     items:[{id,label,x,y,r,color,img,scale,rot}],  — цели (x,y,r в долях экрана; img — спрайт)
     hints: 3,                           — запас подсказок
     combos:[{need:['a','b'], give:'ab', label}],  — крафт из находок
     timeBonus: 10                       — очки за сек остатка
   }
   rules.mode='timed' + duration — таймер уровня ведёт ядро.
   ============================================================ */
Engine.register('hidden', function (engine, cfg) {
  'use strict';
  const HC = cfg.hidden || {};
  const ITEMS = HC.items || [];
  const COMBOS = HC.combos || [];
  const FONT = (cfg.theme && cfg.theme.font) || 'sans-serif';

  let W = 360, H = 640;
  let found = {}, hintsLeft = 0, hintFx = null, clutter = [], inv = [];
  let seed = 1;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  function remaining() { return ITEMS.filter(i => !found[i.id]); }
  function tryCombos() {
    for (let i = 0; i < COMBOS.length; i++) {
      const c = COMBOS[i];
      if (found['c:' + i]) continue;
      if (c.need.every(id => inv.indexOf(id) !== -1)) {
        found['c:' + i] = true;
        engine.addScore(150);
        (function (lbl) { toastT = 2; toastText = '🔧 ' + (lbl || 'Комбинация!'); })(c.label);
        engine.beep(700, 0.15, 'triangle', 0.15);
      }
    }
  }
  let toastT = 0, toastText = '';

  return {
    init: function () {},
    reset: function () {
      found = {}; inv = []; hintsLeft = HC.hints || 3; hintFx = null;
      seed = 12345; clutter = [];
      for (let i = 0; i < (HC.clutter || 50); i++)
        clutter.push({ x: rnd(), y: 0.12 + rnd() * 0.6, r: 8 + rnd() * 22, hue: (rnd() * 360) | 0, rot: rnd() * 6.28, kind: (rnd() * 3) | 0 });
    },
    layout: function (L) { W = L.W; H = L.H; },
    update: function (dt) {
      if (hintFx) { hintFx.t -= dt; if (hintFx.t <= 0) hintFx = null; }
      if (toastT > 0) toastT -= dt;
      if (remaining().length === 0 && engine.state === 'playing') {
        engine.addScore(Math.ceil(engine.timeLeft) * (HC.timeBonus || 10));
        engine.gameOver({ label: (cfg.theme.labels && cfg.theme.labels.win) || 'ВСЁ НАЙДЕНО!' });
      }
    },

    render: function (ctx) {
      const bg = HC.bg && engine.img(HC.bg);
      if (bg && bg.complete && bg.naturalWidth) {
        const sc = Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
        ctx.drawImage(bg, 0, 0, bg.naturalWidth * sc, bg.naturalHeight * sc);
      } else {
        // процедурная куча хлама
        for (let i = 0; i < clutter.length; i++) {
          const c = clutter[i];
          ctx.save(); ctx.translate(c.x * W, c.y * H); ctx.rotate(c.rot);
          ctx.fillStyle = 'hsl(' + c.hue + ',35%,' + (30 + (i % 4) * 8) + '%)';
          if (c.kind === 0) ctx.fillRect(-c.r, -c.r * 0.6, c.r * 2, c.r * 1.2);
          else if (c.kind === 1) { ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.fill(); }
          else { ctx.beginPath(); ctx.moveTo(0, -c.r); ctx.lineTo(c.r, c.r); ctx.lineTo(-c.r, c.r); ctx.closePath(); ctx.fill(); }
          ctx.restore();
        }
      }
      // декорации-картинки поверх фона (data-gated: HC.decor)
      const DEC = HC.decor || [];
      for (let i = 0; i < DEC.length; i++) {
        const d = DEC[i], im = engine.img(d.img);
        if (!(im && im.complete && im.naturalWidth)) continue;
        const s = (d.s || 0.18) * Math.min(W, H), sw = s, sh = s * (im.naturalHeight / im.naturalWidth);
        ctx.save(); ctx.translate(d.x * W, d.y * H); if (d.rot) ctx.rotate(d.rot);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(im, -sw / 2, -sh / 2, sw, sh);
        ctx.restore();
      }
      // цели (ненайденные — картинка/фигура среди хлама, найденные — галочка)
      for (let i = 0; i < ITEMS.length; i++) {
        const it = ITEMS[i], x = it.x * W, y = it.y * H, r = (it.r || 0.045) * Math.min(W, H);
        if (found[it.id]) {
          ctx.strokeStyle = 'rgba(120,255,140,0.9)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
          ctx.fillStyle = 'rgba(120,255,140,0.9)'; ctx.font = 'bold ' + Math.round(r) + 'px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✓', x, y);
        } else {
          const im = it.img && engine.img(it.img);
          if (im && im.complete && im.naturalWidth) {
            const s = r * 2 * (it.scale || 1);
            ctx.save(); ctx.translate(x, y); if (it.rot) ctx.rotate(it.rot);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(im, -s / 2, -s / 2, s, s);
            ctx.restore();
          } else {
            ctx.fillStyle = it.color || 'hsl(' + ((i * 77) % 360) + ',70%,60%)';
            ctx.save(); ctx.translate(x, y); ctx.rotate(i);
            ctx.fillRect(-r * 0.5, -r * 0.5, r, r);
            ctx.restore();
          }
        }
      }
      // подсказка: пульсирующее кольцо
      if (hintFx) {
        const it = hintFx.it, x = it.x * W, y = it.y * H;
        ctx.strokeStyle = 'rgba(255,215,94,' + (0.4 + Math.sin(Date.now() / 120) * 0.3) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, y, (it.r || 0.045) * Math.min(W, H) + 10, 0, 7); ctx.stroke();
      }
      if (toastT > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; engine.rr(W / 2 - 90, H * 0.4, 180, 30, 15); ctx.fill();
        ctx.fillStyle = '#ffe9a0'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(toastText, W / 2, H * 0.4 + 16);
      }
    },

    hud: function (ctx) {
      // список целей внизу + таймер + кнопка подсказки
      const rem = remaining();
      ctx.fillStyle = 'rgba(8,8,20,0.85)'; ctx.fillRect(0, H - 74, W, 74);
      ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      let lx = 12;
      for (let i = 0; i < ITEMS.length; i++) {
        const it = ITEMS[i];
        ctx.fillStyle = found[it.id] ? 'rgba(120,255,140,0.85)' : 'rgba(255,255,255,0.85)';
        const t2 = (found[it.id] ? '✓ ' : '· ') + it.label;
        ctx.fillText(t2, lx, H - 50 + (i % 2) * 22);
        if (i % 2 === 1) lx += ctx.measureText(t2).width + 22;
      }
      // таймер
      ctx.fillStyle = engine.timeLeft < 10 ? '#e0533d' : '#fff';
      ctx.font = 'bold 17px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(Math.ceil(engine.timeLeft) + ' с', W - 12, 10);
      // счёт
      ctx.fillStyle = '#ffd75e'; ctx.textAlign = 'left'; ctx.fillText(String(engine.score), 12, 10);
      // подсказка
      ctx.fillStyle = hintsLeft > 0 ? 'rgba(255,215,94,0.9)' : 'rgba(120,120,120,0.6)';
      ctx.beginPath(); ctx.arc(W - 32, H - 104, 22, 0, 7); ctx.fill();
      ctx.fillStyle = '#222'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💡' , W - 32, H - 103);
      ctx.font = 'bold 11px ' + FONT; ctx.fillStyle = '#fff';
      ctx.fillText(String(hintsLeft), W - 32, H - 82);
    },

    pointerDown: function (p) {
      // подсказка
      if (Math.hypot(p.x - (W - 32), p.y - (H - 104)) < 26) {
        const rem = remaining();
        if (hintsLeft > 0 && rem.length) {
          hintsLeft--;
          hintFx = { it: rem[(Math.random() * rem.length) | 0], t: 2.5 };
          engine.beep(600, 0.1, 'triangle', 0.1);
        }
        return;
      }
      // тап по цели
      const rem = remaining();
      for (let i = 0; i < rem.length; i++) {
        const it = rem[i], x = it.x * W, y = it.y * H, r = (it.r || 0.045) * Math.min(W, H) + 12;
        if (Math.hypot(p.x - x, p.y - y) <= r) {
          found[it.id] = true; inv.push(it.id);
          engine.addScore(50);
          engine.burst(x, y, { count: 10, color: '#ffe08a' });
          engine.beep(760, 0.08, 'triangle', 0.12);
          tryCombos();
          return;
        }
      }
      engine.beep(160, 0.08, 'sine', 0.08);   // промах
    },

    _state: function () {
      return { total: ITEMS.length, found: Object.keys(found).filter(k => k.slice(0, 2) !== 'c:').length,
        hintsLeft: hintsLeft, inv: inv.slice(), combosDone: Object.keys(found).filter(k => k.slice(0, 2) === 'c:').length };
    },
  };
});

Engine.boot(CONFIG);
</script></body></html>

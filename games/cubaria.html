/* Утилиты: сид-RNG, шум, математика. Всё детерминировано от seed —
   мир пересобирается из seed при загрузке сейва. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

    const a = grid[((i0 % 4096) + 4096) % 4096], b = grid[(((i0 + 1) % 4096) + 4096) % 4096];
    const t = (1 - Math.cos(f * Math.PI)) * 0.5;
    return (a + (b - a) * t) * amp;
  };
}

// 2D value-шум (для пещер-«сыра» и текстур).
function makeNoise2D(seed) {
  const rng = mulberry32(seed);
  const perm = [];
  for (let i = 0; i < 512; i++) perm.push(Math.floor(rng() * 256));
  function h(x, y) { return perm[(perm[(x & 255)] + (y & 255)) & 511] / 255; }
  return function (x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const v00 = h(x0, y0), v10 = h(x0 + 1, y0), v01 = h(x0, y0 + 1), v11 = h(x0 + 1, y0 + 1);
    return (v00 + (v10 - v00) * sx) * (1 - sy) + (v01 + (v11 - v01) * sx) * sy;
  };
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);

// Интерполяция цветов '#rrggbb' для неба.
function hexLerp(c1, c2, t) {
  const p = (c, i) => parseInt(c.slice(i, i + 2), 16);
  const r = Math.round(lerp(p(c1, 1), p(c2, 1), t));
  const g = Math.round(lerp(p(c1, 3), p(c2, 3), t));
  const b = Math.round(lerp(p(c1, 5), p(c2, 5), t));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* Мир: типизированные массивы, генерация из seed, жидкости, свет.
   Все игровые изменения тайлов идут через setTile/setWall/setLiquid —
   они пишут диффы (сейв = seed + диффы). */

const T = new Uint8Array(WORLD_W * WORLD_H);   // тайлы
const W = new Uint8Array(WORLD_W * WORLD_H);   // фоновые стены: 0 нет, 1 земл., 2 кам., 3 дерев.
const LQ = new Uint8Array(WORLD_W * WORLD_H);  // жидкость: bit7 = лава, биты 0-3 = уровень 1-8
const surf = new Int16Array(WORLD_W);          // высота поверхности (первый твёрдый тайл)
const DIFF = new Map();                        // idx -> 1 (клетка изменена игроком/симуляцией)
const chests = new Map();                      // idx -> массив 27 слотов [{id,n}|null]
let genMode = true;                            // во время генерации диффы не пишем

const HELL_Y = 352;
const idx = (x, y) => x + y * WORLD_W;
const inW = (x, y) => x >= 0 && x < WORLD_W && y >= 0 && y < WORLD_H;
const gT = (x, y) => (inW(x, y) ? T[x + y * WORLD_W] : (y < 0 ? T_AIR : T_STONE));
const gW = (x, y) => (inW(x, y) ? W[x + y * WORLD_W] : 0);
const gLQ = (x, y) => (inW(x, y) ? LQ[x + y * WORLD_W] : 0);
const lqLevel = (v) => v & 15;
const lqIsLava = (v) => (v & 128) !== 0;

let T0 = null, W0 = null, LQ0 = null; // снимок мира после генерации (чистка транзитных диффов)
function markDiff(x, y) { if (!genMode) { DIFF.set(idx(x, y), 1); touchDirty(); } }
function setTile(x, y, t) {
  if (!inW(x, y)) return;
  T[idx(x, y)] = t; markDiff(x, y); lightDirty = true;
  wakeLiquids(x, y);
}
function setWall(x, y, w) { if (!inW(x, y)) return; W[idx(x, y)] = w; markDiff(x, y); lightDirty = true; }
function setLiquid(x, y, v) { if (!inW(x, y)) return; LQ[idx(x, y)] = v; markDiff(x, y); wakeLiquids(x, y); }

// Проходимость для физики: solid-тайлы; платформа отдельно (one-way)
const isBlockAt = (x, y) => isSolid(gT(x, y));
const isPlatAt = (x, y) => gT(x, y) === T_PLATFORM;

// ════════════════════════════════ ГЕНЕРАЦИЯ ═══════════════════════════════
// Биомы по X: снег / лес / пустыня / джунгли (границы дизерятся шумом)
function biomeAt(x, bn) {
  const j = x + Math.floor(bn(x) * 16 - 8);
  if (j < 250) return 'snow';
  if (j < 640) return 'forest';
  if (j < 900) return 'desert';
  return 'jungle';
}

function genWorld(seed) {
  genMode = true;
  T.fill(T_AIR); W.fill(0); LQ.fill(0); DIFF.clear(); chests.clear();
  const rng = mulberry32(seed ^ 0x9E3779B9);
  const n1 = makeNoise1D(seed * 7 + 1, 95, 46);
  const n2 = makeNoise1D(seed * 13 + 2, 27, 17);
  const n3 = makeNoise1D(seed * 29 + 3, 8, 6);
  const bn = makeNoise1D(seed * 31 + 4, 40, 1);
  const dn = makeNoise1D(seed * 37 + 5, 33, 14);
  const n2d = makeNoise2D(seed * 41 + 6);

  // 1. Поверхность + страты + стены
  for (let x = 0; x < WORLD_W; x++) {
    let s = Math.floor(94 + n1(x) + n2(x) + n3(x));
    surf[x] = s;
    const biome = biomeAt(x, bn);
    const dirtEnd = s + 24 + Math.floor(dn(x));
    for (let y = s; y < WORLD_H; y++) {
      let t;
      if (y >= HELL_Y) t = T_ASH;
      else if (y > dirtEnd) t = T_STONE;
      else if (biome === 'desert') t = y < s + 14 ? T_SAND : T_DIRT;
      else if (biome === 'snow') t = y === s ? T_SNOW : (y < s + 10 ? T_SNOW : (y < s + 16 ? T_ICE : T_DIRT));
      else if (biome === 'jungle') t = y === s ? T_JGRASS : T_MUD;
      else t = y === s ? T_GRASS : T_DIRT;
      T[idx(x, y)] = t;
      if (y > s + 2) W[idx(x, y)] = y >= HELL_Y ? 2 : (y > dirtEnd ? 2 : 1);
    }
  }

  // 2. Пещеры: черви-туннели + «сырный» шум + вертикальные шахты
  const carve = (cx, cy, r) => {
    for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++)
      for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++) {
        const x = Math.round(cx + dx), y = Math.round(cy + dy);
        if (!inW(x, y) || y < surf[x] + 3) continue;
        if (dx * dx + dy * dy <= r * r && isSolid(T[idx(x, y)])) T[idx(x, y)] = T_AIR;
      }
  };
  for (let i = 0; i < 160; i++) {
    let x = rng() * WORLD_W, y = surf[Math.floor(x) % WORLD_W] + 14 + rng() * (WORLD_H - 40 - surf[0]);
    let dir = rng() * Math.PI * 2;
    const steps = 40 + rng() * 110, r0 = 1.2 + rng() * 1.5;
    for (let s = 0; s < steps; s++) {
      carve(x, y, r0 + Math.sin(s * 0.3) * 0.5);
      dir += (rng() - 0.5) * 0.9;
      x += Math.cos(dir) * 1.6; y += Math.sin(dir) * 0.9;
      if (x < 2 || x > WORLD_W - 2 || y < 20 || y > WORLD_H - 3) break;
    }
  }
  for (let i = 0; i < 22; i++) { // шахты вниз
    let x = 30 + rng() * (WORLD_W - 60), y = surf[Math.floor(x)] + 6;
    const depth = 40 + rng() * 120;
    for (let s = 0; s < depth; s++) { carve(x, y, 1.4 + rng()); x += (rng() - 0.5) * 2.4; y += 1.4; }
  }
  for (let y = 130; y < WORLD_H - 8; y++)  // сырные каверны
    for (let x = 2; x < WORLD_W - 2; x++) {
      if (y < surf[x] + 18) continue;
      const v = n2d(x / 11, y / 8);
      if (v > (y >= HELL_Y ? 0.56 : 0.63)) T[idx(x, y)] = T_AIR;
    }

  // 3. Руды (жилы 3-10 блоков, глубже — ценнее)
  const vein = (tile, count, y0, y1, sMin, sMax) => {
    for (let i = 0; i < count; i++) {
      let x = 4 + rng() * (WORLD_W - 8), y = y0 + rng() * (y1 - y0);
      const size = sMin + Math.floor(rng() * (sMax - sMin + 1));
      for (let s = 0; s < size; s++) {
        const xi = Math.round(x), yi = Math.round(y);
        if (inW(xi, yi)) { const c = T[idx(xi, yi)]; if (c === T_STONE || c === T_DIRT || c === T_ASH || c === T_MUD) T[idx(xi, yi)] = tile; }
        x += (rng() - 0.5) * 2.2; y += (rng() - 0.5) * 2.2;
      }
    }
  };
  vein(T_ORECU, 420, 110, 210, 3, 8);
  vein(T_OREFE, 330, 150, 280, 3, 8);
  vein(T_OREAG, 240, 230, 330, 3, 9);
  vein(T_OREAU, 170, 280, 392, 4, 10);

  // 4. Ад: лавовые озёра + обсидиановые кромки
  for (let x = 2; x < WORLD_W - 2; x++)
    for (let y = HELL_Y + 8; y < WORLD_H - 2; y++) {
      const i = idx(x, y);
      if (T[i] === T_AIR && n2d(x / 14, y / 6) > 0.5 && y > HELL_Y + 14) LQ[i] = 128 | 8;
    }
  for (let i = 0; i < 90; i++) { // обсидиан у лавы
    const x = Math.floor(4 + rng() * (WORLD_W - 8)), y = HELL_Y + Math.floor(rng() * (WORLD_H - HELL_Y - 4));
    if (lqIsLava(gLQ(x, y)) || lqIsLava(gLQ(x, y + 1)))
      for (let d = 0; d < 4; d++) { const xi = x + Math.floor(rng() * 5 - 2), yi = y + Math.floor(rng() * 3); if (inW(xi, yi) && isSolid(T[idx(xi, yi)])) T[idx(xi, yi)] = T_OBSID; }
  }

  // 5. Озёра на поверхности (вода) + вода/лава в пещерах
  for (let i = 0; i < 11; i++) {
    const cx = Math.floor(40 + rng() * (WORLD_W - 80));
    const wHalf = 6 + Math.floor(rng() * 9), depth = 4 + Math.floor(rng() * 5);
    const rim = surf[cx];
    // уровень воды не выше НИЖНЕГО из берегов — иначе вода стояла бы стеной в воздухе
    const bankL = surf[clamp(cx - wHalf - 1, 0, WORLD_W - 1)];
    const bankR = surf[clamp(cx + wHalf + 1, 0, WORLD_W - 1)];
    const waterTop = Math.max(bankL, bankR, rim + 1);
    for (let dx = -wHalf; dx <= wHalf; dx++) {
      const x = cx + dx; if (x < 2 || x >= WORLD_W - 2) continue;
      const d = Math.max(1, Math.round(depth * (1 - (dx * dx) / (wHalf * wHalf))));
      for (let y = rim; y < rim + d + 2; y++) if (inW(x, y)) T[idx(x, y)] = T_AIR;
      for (let y = Math.max(rim + 1, waterTop); y < rim + d + 2; y++) if (inW(x, y)) LQ[idx(x, y)] = 8;
    }
  }
  for (let i = 0; i < 120; i++) { // лужи в пещерах
    const x = Math.floor(6 + rng() * (WORLD_W - 12));
    let y = surf[x] + 20 + Math.floor(rng() * 200);
    if (y >= HELL_Y - 6) continue;
    while (y < HELL_Y - 4 && gT(x, y) !== T_AIR) y++;
    while (y < HELL_Y - 4 && gT(x, y + 1) === T_AIR) y++;
    if (gT(x, y) !== T_AIR || !isSolid(gT(x, y + 1))) continue;
    const lava = y > 290 && rng() < 0.55;
    for (let dx = -4; dx <= 4; dx++)
      for (let dy = 0; dy < 2; dy++) {
        const xi = x + dx, yi = y - dy;
        if (inW(xi, yi) && T[idx(xi, yi)] === T_AIR && isSolid(gT(xi, yi + 1)) | (dy === 0 ? 0 : 1))
          LQ[idx(xi, yi)] = (lava ? 128 : 0) | 8;
      }
  }

  // 6. Деревья, кактусы, растения, паутина
  let lastTree = -99;
  for (let x = 3; x < WORLD_W - 3; x++) {
    const b = biomeAt(x, bn), s = surf[x], ground = T[idx(x, s)];
    if (!isSolid(gT(x, s)) || gT(x, s - 1) !== T_AIR) continue;
    if ((b === 'forest' || b === 'jungle' || b === 'snow') && x - lastTree > 4 && rng() < (b === 'jungle' ? 0.3 : 0.22)) {
      growTree(x, s - 1, b, rng); lastTree = x;
    } else if (b === 'desert' && x - lastTree > 5 && rng() < 0.1 && ground === T_SAND) {
      const h = 2 + Math.floor(rng() * 3);
      for (let i = 0; i < h; i++) T[idx(x, s - 1 - i)] = T_CACTUS; lastTree = x;
    } else if (rng() < 0.06 && (ground === T_GRASS || ground === T_JGRASS)) {
      T[idx(x, s - 1)] = rng() < 0.5 ? T_MUSH : T_HERB;
    }
  }
  for (let i = 0; i < 500; i++) { // грибы/травы/паутина в пещерах
    const x = Math.floor(4 + rng() * (WORLD_W - 8)), y = Math.floor(surf[x] + 15 + rng() * (HELL_Y - surf[x] - 25));
    if (gT(x, y) === T_AIR && isSolid(gT(x, y + 1)) && !lqLevel(gLQ(x, y)))
      T[idx(x, y)] = rng() < 0.42 ? T_MUSH : (rng() < 0.5 ? T_HERB : T_WEB);
  }

  // 7. Сундуки с лутом в пещерах
  let placed = 0, guard = 0;
  while (placed < 42 && guard++ < 4000) {
    const x = Math.floor(8 + rng() * (WORLD_W - 16));
    let y = surf[x] + 14 + Math.floor(rng() * (WORLD_H - surf[x] - 24));
    if (!inW(x, y) || gT(x, y) !== T_AIR || !isSolid(gT(x, y + 1)) || lqLevel(gLQ(x, y))) continue;
    T[idx(x, y)] = T_CHEST;
    chests.set(idx(x, y), genLoot(rng, y));
    placed++;
  }

  // 8. Осадить жидкости до стабильности: генерация могла оставить воду/лаву
  // «стеной» (склоны у озёр, каверны под лужами) — прогоняем симуляцию,
  // пока всё не успокоится. Детерминировано (в симе нет случайности) —
  // мир из seed при загрузке сейва осядет так же.
  for (let i = 0; i < WORLD_W * WORLD_H; i++) if (LQ[i] & 15) lqActive.add(i);
  let settleTicks = 0;
  while (lqActive.size > 0 && settleTicks++ < 3000) updateLiquids();
  lqActive.clear();

  genMode = false;
  lightDirty = true;
  T0 = T.slice(); W0 = W.slice(); LQ0 = LQ.slice();
}

function growTree(x, y, biome, rng) {
  const h = biome === 'jungle' ? 6 + Math.floor(rng() * 5) : 4 + Math.floor(rng() * 4);
  for (let i = 0; i < h; i++) if (gT(x, y - i) === T_AIR) T[idx(x, y - i)] = T_TRUNK;
  const ty = y - h;
  if (biome === 'snow') { // ель — треугольная крона
    for (let dy = 0; dy < 4; dy++)
      for (let dx = -(3 - dy); dx <= 3 - dy; dx++)
        if (gT(x + dx, ty + dy - 2) === T_AIR) T[idx(x + dx, ty + dy - 2)] = T_LEAVES;
  } else {
    for (let dy = -2; dy <= 1; dy++)
      for (let dx = -2; dx <= 2; dx++)
        if (Math.abs(dx) + Math.abs(dy) < 4 && gT(x + dx, ty + dy) === T_AIR) T[idx(x + dx, ty + dy)] = T_LEAVES;
  }
}

function genLoot(rng, depth) {
  const slots = new Array(27).fill(null);
  const roll = (id, a, b) => ({ id, n: a + Math.floor(rng() * (b - a + 1)) });
  const pool = [];
  pool.push(roll(9, 4, 12), roll(50, 20, 90));
  if (rng() < 0.7) pool.push(roll(42, 8, 25));
  if (rng() < 0.5) pool.push(roll(37, 1, 2));
  if (rng() < 0.4) pool.push(roll(38, 1, 2));
  if (rng() < 0.5) pool.push(roll(33, 3, 8));
  if (depth > 220 && rng() < 0.6) pool.push(roll(rng() < 0.5 ? 27 : 28, 2, 5));
  else if (rng() < 0.6) pool.push(roll(26, 2, 5));
  if (depth > 260 && rng() < 0.35) pool.push(roll(29, 1, 4));
  if (depth > 180 && rng() < 0.25) pool.push(roll(rng() < 0.5 ? 77 : 51, 1, rng() < 0.5 ? 1 : 3));
  if (rng() < 0.15) pool.push(roll(39, 1, 2));
  for (let i = 0; i < pool.length; i++) slots[i] = pool[i];
  return slots;
}

// ════════════════════════════════ ЖИДКОСТИ ════════════════════════════════
const lqActive = new Set();
function wakeLiquids(x, y) {
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++)
      if (inW(x + dx, y + dy) && lqLevel(LQ[idx(x + dx, y + dy)])) lqActive.add(idx(x + dx, y + dy));
}

let lqTick = 0;
function updateLiquids() {
  lqTick++;
  if (lqActive.size === 0) return;
  const list = Array.from(lqActive);
  // снизу вверх — падение обрабатывается корректнее
  list.sort((a, b) => Math.floor(b / WORLD_W) - Math.floor(a / WORLD_W));
  for (const i of list) {
    const v = LQ[i];
    let lvl = lqLevel(v);
    if (!lvl) { lqActive.delete(i); continue; }
    const lava = lqIsLava(v);
    if (lava && (lqTick & 1)) continue; // лава течёт вдвое медленнее
    const x = i % WORLD_W, y = Math.floor(i / WORLD_W);
    let moved = false;
    // вода поверх лавы (или наоборот) → обсидиан
    const below = y + 1 < WORLD_H ? LQ[i + WORLD_W] : 0;
    if (lqLevel(below) && lqIsLava(below) !== lava) {
      setTile(x, y + 1, T_OBSID); LQ[i + WORLD_W] = 0; markDiff(x, y + 1);
      moved = true;
    } else if (y + 1 < WORLD_H && !isSolid(T[i + WORLD_W])) {
      const space = 8 - lqLevel(below);
      if (space > 0 && (!lqLevel(below) || lqIsLava(below) === lava)) {
        const mv = Math.min(space, lvl);
        LQ[i + WORLD_W] = (lava ? 128 : 0) | (lqLevel(below) + mv);
        lvl -= mv; LQ[i] = lvl ? (lava ? 128 : 0) | lvl : 0;
        markDiff(x, y); markDiff(x, y + 1);
        lqActive.add(i + WORLD_W); moved = true;
      }
    }
    if (lvl > 1) { // растекание в стороны
      for (const dx of [-1, 1]) {
        const xn = x + dx; if (xn < 0 || xn >= WORLD_W) continue;
        const ni = i + dx;
        if (isSolid(T[ni])) continue;
        const nv = LQ[ni], nl = lqLevel(nv);
        if (nl && lqIsLava(nv) !== lava) { // контакт сбоку → обсидиан на месте контакта
          setTile(xn, y, T_OBSID); LQ[ni] = 0; moved = true; continue;
        }
        // перелив через край: если у соседа есть сток вниз, льём даже при разнице в 1 —
        // без этого вода стоит отвесной стеной у обрыва/раскопанного берега
        let pour = false;
        if (nl < lvl && y + 1 < WORLD_H) {
          const bi = ni + WORLD_W, bv = LQ[bi], bl = lqLevel(bv);
          pour = !isSolid(T[bi]) && bl < 8 && (!bl || lqIsLava(bv) === lava);
        }
        if (nl < lvl - 1 || (pour && nl < lvl)) {
          LQ[ni] = (lava ? 128 : 0) | (nl + 1);
          lvl--; LQ[i] = lvl ? (lava ? 128 : 0) | lvl : 0;
          markDiff(x, y); markDiff(xn, y);
          lqActive.add(ni); moved = true;
        }
      }
    }
    if (moved) { lqActive.add(i); wakeLiquids(x, y); } else lqActive.delete(i);
  }
}

// ════════════════════════════════ СВЕТ ════════════════════════════════════
// Окно света вокруг камеры; sweeps-распространение (4 прохода × 2 итерации).
let lightDirty = true;
let lightBuf = new Uint8Array(1);
let lightX0 = 0, lightY0 = 0, lightWc = 0, lightHc = 0;
const PAD = 14;

function skyLightLevel(dayFrac) { // 0..1 времени суток → 3..15
  const d = dayLight01(dayFrac);
  return 3 + d * 12;
}

function computeLight(camX0, camY0, camW, camH, dayFrac) {
  lightX0 = Math.max(0, camX0 - PAD); lightY0 = Math.max(0, camY0 - PAD);
  const x1 = Math.min(WORLD_W, camX0 + camW + PAD), y1 = Math.min(WORLD_H, camY0 + camH + PAD);
  lightWc = x1 - lightX0; lightHc = y1 - lightY0;
  if (lightBuf.length < lightWc * lightHc) lightBuf = new Uint8Array(lightWc * lightHc);
  const L = lightBuf, wl = lightWc, sky = skyLightLevel(dayFrac);
  // источники
  for (let y = lightY0; y < y1; y++)
    for (let x = lightX0; x < x1; x++) {
      const i = idx(x, y), li = (x - lightX0) + (y - lightY0) * wl;
      const t = T[i];
      let v = TILES[t] ? TILES[t].light : 0;
      if (lqIsLava(LQ[i]) && lqLevel(LQ[i])) v = Math.max(v, 12);
      if (!isSolid(t) && W[i] === 0 && y <= surf[x] + 1) v = Math.max(v, sky);
      L[li] = v;
    }
  // 2 итерации 4-направленных проходов
  for (let it = 0; it < 2; it++) {
    for (let y = 0; y < lightHc; y++) for (let x = 1; x < lightWc; x++) relax(L, x, y, x - 1, y, wl);
    for (let y = 0; y < lightHc; y++) for (let x = lightWc - 2; x >= 0; x--) relax(L, x, y, x + 1, y, wl);
    for (let x = 0; x < lightWc; x++) for (let y = 1; y < lightHc; y++) relax(L, x, y, x, y - 1, wl);
    for (let x = 0; x < lightWc; x++) for (let y = lightHc - 2; y >= 0; y--) relax(L, x, y, x, y + 1, wl);
  }
  lightDirty = false;
}
function relax(L, x, y, nx, ny, wl) {
  const i = x + y * wl, n = nx + ny * wl;
  const t = T[(lightX0 + x) + (lightY0 + y) * WORLD_W];
  const dec = isSolid(t) ? 3 : 1;
  const v = L[n] - dec;
  if (v > L[i]) L[i] = v;
}
function lightAt(x, y) {
  const lx = x - lightX0, ly = y - lightY0;
  if (lx < 0 || ly < 0 || lx >= lightWc || ly >= lightHc) return 4;
  return lightBuf[lx + ly * lightWc];
}

// ════════════════════════════════ ПРОЧЕЕ ══════════════════════════════════
// Рубка дерева: валится ТОЛЬКО это дерево. Ствол — вертикальная колонна
// (генератор ставит его в одну колонку), крона — листва рядом с этой колонной,
// не принадлежащая соседнему стволу. Раньше флуд по соприкасающимся кронам
// уносил соседние деревья целиком.
function fellTree(x, y) {
  // 1) основание ствола: спускаемся по колонне вниз
  let baseY = y;
  while (gT(x, baseY + 1) === T_TRUNK) baseY++;
  // 2) колонна вверх
  const trunk = [];
  let ty = baseY;
  while (gT(x, ty) === T_TRUNK) { trunk.push(ty); ty--; }
  if (!trunk.length) return { wood: 0, acorns: 0 };
  const topY = trunk[trunk.length - 1];

  // 3) листва: только клетки, для которых ЭТОТ ствол — ближайший по горизонтали
  const leaves = [];
  const R = 4, seen = new Set(), stack = [];
  for (let dx = -1; dx <= 1; dx++) stack.push([x + dx, topY - 1], [x + dx, topY]);
  while (stack.length) {
    const [cx, cy] = stack.pop();
    const k = idx(cx, cy);
    if (seen.has(k)) continue;
    seen.add(k);
    if (gT(cx, cy) !== T_LEAVES) continue;
    if (Math.abs(cx - x) > R || cy < topY - R - 1 || cy > baseY) continue;
    // чужая крона: под клеткой (или рядом) стоит другой ствол ближе нашего
    let foreign = false;
    for (let sy = cy; sy <= cy + 3 && !foreign; sy++)
      for (let sx = cx - 1; sx <= cx + 1; sx++)
        if (sx !== x && gT(sx, sy) === T_TRUNK && Math.abs(sx - cx) < Math.abs(x - cx)) foreign = true;
    if (foreign) continue;
    leaves.push([cx, cy]);
    if (leaves.length > 120) break;
    stack.push([cx - 1, cy], [cx + 1, cy], [cx, cy - 1], [cx, cy + 1]);
  }

  let acorns = 0;
  for (const cy of trunk) setTile(x, cy, T_AIR);
  for (const [cx, cy] of leaves) { setTile(cx, cy, T_AIR); if (Math.random() < 0.08) acorns++; }
  return { wood: Math.max(1, Math.round(trunk.length * 1.6)), acorns };
}

// Глубина для HUD и спавна
function depthZone(y) {
  if (y >= HELL_Y - 6) return 'АД';
  if (y >= 240) return 'ПЕЩЕРЫ';
  if (y >= 150) return 'ПОДЗЕМЕЛЬЕ';
  return 'ПОВЕРХНОСТЬ';
}

/* ══════ 04-entities.js ══════ */
/* Сущности: дропы предметов, снаряды, частицы, всплывающие цифры.
   Координаты — в ТАЙЛАХ (float), скорость — тайлы/сек. */

const drops = [];      // {x,y,vx,vy,id,n,t (жизнь), pk (задержка подбора)}
const projs = [];      // {x,y,vx,vy,dmg,kind,from ('p'|'e'), grav, home, life, kb}
const parts = [];      // {x,y,vx,vy,t,life,color,sz,grav}
const dmgTexts = [];   // {x,y,v,t,crit,color}

function spawnDrop(x, y, id, n, pk) {
  if (!ITEMS[id] || n <= 0) return;
  // слияние с ближним дропом того же предмета (меньше мусора и отрисовок)
  const max = ITEMS[id].max || 99;
  for (const d of drops) {
    if (d.id === id && d.n + n <= max && (d.x - x) * (d.x - x) + (d.y - y) * (d.y - y) < 1.44) {
      d.n += n; d.t = 300;
      return;
    }
  }
  if (drops.length > 300) drops.shift(); // кап как у частиц
  drops.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: -4 - Math.random() * 2, id, n, t: 300, pk: pk || 0 });
}
function dropCoins(x, y, total) { // total в медяках → монеты кучками
  let g = Math.floor(total / 10000), s = Math.floor((total % 10000) / 100), c = total % 100;
  if (g) spawnDrop(x, y, 52, g);
  if (s) spawnDrop(x, y, 51, s);
  if (c) spawnDrop(x, y, 50, c);
}

function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (spd || 5);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, t: 0, life: 0.4 + Math.random() * 0.4, color, sz: 2 + Math.random() * 3, grav: 22 });
  }
}
function addDmgText(x, y, v, color) {
  dmgTexts.push({ x, y, v: Math.round(v), t: 0, color: color || '#ffd23e' });
}

// Физика точки с коллизией о мир (для дропов/частиц/снарядов)
function movePoint(o, dt, bounce, grav) {
  o.vy += (grav !== undefined ? grav : 28) * dt;
  o.vx *= (1 - Math.min(1, dt * 1.5));
  let nx = o.x + o.vx * dt, ny = o.y + o.vy * dt;
  if (isBlockAt(Math.floor(nx), Math.floor(o.y))) { o.vx = -o.vx * (bounce || 0); nx = o.x; }
  if (isBlockAt(Math.floor(nx), Math.floor(ny))) {
    if (o.vy > 0) { ny = Math.floor(ny) - 0.01; o.vy = -o.vy * (bounce || 0); if (Math.abs(o.vy) < 2) o.vy = 0; }
    else { o.vy = 0; ny = o.y; }
  }
  o.x = nx; o.y = ny;
}

function updateEntities(dt) {
  // дропы: магнит к игроку и подбор
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t -= dt; d.pk -= dt;
    // в зоне магнита предмет летит к игроку напрямую — гравитация не мешает
    // (иначе лежащий на земле дроп не может «подняться» к телу и висит у ног)
    movePoint(d, dt, 0.3, d.magnet ? 0 : undefined);
    if (d.pk <= 0 && !P.dead) {
      const tx = P.x, ty = P.y - P.h * 0.5;      // центр тела
      const dx = tx - d.x, dy = ty - d.y, dd = dx * dx + dy * dy;
      if (dd < 7) {
        d.magnet = 1;
        const len = Math.sqrt(dd) || 1;
        const sp = 7 + (7 - dd);                  // ближе — быстрее
        d.vx = lerp(d.vx, (dx / len) * sp, Math.min(1, dt * 12));
        d.vy = lerp(d.vy, (dy / len) * sp, Math.min(1, dt * 12));
      } else d.magnet = 0;
      // подбор по пересечению с телом игрока (+запас), а не по расстоянию до центра
      const pr = playerRect();
      if (d.x > pr.x - 0.45 && d.x < pr.x + pr.w + 0.45 &&
          d.y > pr.y - 0.45 && d.y < pr.y + pr.h + 0.45) {
        const left = invAdd(d.id, d.n);
        if (left === 0) { drops.splice(i, 1); sfx('pickup'); continue; }
        if (left < d.n) sfx('pickup');
        d.n = left;                                // инвентарь полон — остаток лежит
        d.pk = 0.6;                                // не долбить invAdd каждый кадр
      }
    } else d.magnet = 0;
    if (d.t <= 0) drops.splice(i, 1);
  }
  // снаряды
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    p.life -= dt;
    if (p.grav) p.vy += p.grav * dt;
    if (p.home) { // самонаведение на ближайшего врага
      const tgt = nearestFoe(p.x, p.y, 18);
      if (tgt) {
        const a = Math.atan2(tgt.y - p.y, tgt.x - p.x);
        const sp = Math.hypot(p.vx, p.vy) || 14;
        p.vx = lerp(p.vx, Math.cos(a) * sp, dt * 6);
        p.vy = lerp(p.vy, Math.sin(a) * sp, dt * 6);
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (isBlockAt(Math.floor(p.x), Math.floor(p.y))) {
      burst(p.x, p.y, p.kind === 'fire' ? '#ff8a3e' : '#cbb27a', 4, 3);
      projs.splice(i, 1); continue;
    }
    if (p.from === 'p') { // по врагам
      let hitSomething = false;
      for (const f of foes) {
        if (f.dead) continue;
        if (Math.abs(f.x - p.x) < f.w / 2 + 0.3 && Math.abs(f.y - f.h / 2 - p.y) < f.h / 2 + 0.3) {
          hurtFoe(f, p.dmg, sign(p.vx) || 1, p.kb || 4); hitSomething = true; break;
        }
      }
      if (hitSomething) { projs.splice(i, 1); continue; }
    } else { // по игроку
      if (Math.abs(P.x - p.x) < 0.6 && Math.abs(P.y - 0.9 - p.y) < 1.0) {
        hurtPlayer(p.dmg, sign(p.vx) || 1); projs.splice(i, 1); continue;
      }
    }
    if (p.life <= 0 || p.x < 0 || p.x > WORLD_W || p.y < 0 || p.y > WORLD_H) projs.splice(i, 1);
  }
  // частицы
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.t += dt;
    q.vy += (q.grav || 0) * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.t >= q.life) parts.splice(i, 1);
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
  // цифры урона
  for (let i = dmgTexts.length - 1; i >= 0; i--) {
    const q = dmgTexts[i];
    q.t += dt; q.y -= dt * 1.6;
    if (q.t > 0.9) dmgTexts.splice(i, 1);
  }
}

function nearestFoe(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (const f of foes) {
    if (f.dead) continue;
    const d = dist2(x, y, f.x, f.y - f.h / 2);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

/* ══════ 05-player.js ══════ */
/* Игрок: физика, коллизии, добыча/строительство, бой, урон, дыхание, смерть. */

const P = {
  x: 0, y: 0, vx: 0, vy: 0, w: 0.82, h: 1.85,
  hp: 100, hpMax: 100, mana: 20, manaMax: 20, air: 7, airMax: 7,
  dir: 1, onGround: false, inWater: false,
  inv: 0.7,             // i-frames
  swingT: 0, swingDur: 0, swingId: 0, useT: 0,
  fallFrom: 0, dead: false, deadT: 0,
  potionCd: 0, buffs: {}, spawnX: 0, spawnY: 0,
  regenT: 0, manaT: 0, lavaT: 0, airDmgT: 0, dropT: 0, wandT: 0,
};

function playerRect() { return { x: P.x - P.w / 2, y: P.y - P.h, w: P.w, h: P.h }; }

function rectVsWorld(r) { // список пересекаемых solid-тайлов
  const x0 = Math.floor(r.x), x1 = Math.floor(r.x + r.w), y0 = Math.floor(r.y), y1 = Math.floor(r.y + r.h);
  const out = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (isBlockAt(x, y)) out.push([x, y]);
  return out;
}

const GRAV = 38, JUMP_V = 16.8, MOVE = 7.2, ACCEL = 46, FRICT = 34;

function overlapLiquid(minLevel, lavaOnly) {
  const r = playerRect();
  const x0 = Math.floor(r.x), x1 = Math.floor(r.x + r.w), y0 = Math.floor(r.y), y1 = Math.floor(r.y + r.h);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const v = gLQ(x, y);
    if (lqLevel(v) >= minLevel && (!lavaOnly || lqIsLava(v))) return true;
  }
  return false;
}
function overlapTile(tid) {
  const r = playerRect();
  for (let y = Math.floor(r.y); y <= Math.floor(r.y + r.h); y++)
    for (let x = Math.floor(r.x); x <= Math.floor(r.x + r.w); x++)
      if (gT(x, y) === tid) return true;
  return false;
}

function updatePlayer(dt) {
  if (P.dead) {
    P.deadT -= dt;
    if (P.deadT <= 0) respawn();
    return;
  }
  P.inv = Math.max(0, P.inv - dt);
  P.potionCd = Math.max(0, P.potionCd - dt);
  P.dropT = Math.max(0, P.dropT - dt);
  for (const k in P.buffs) { P.buffs[k] -= dt; if (P.buffs[k] <= 0) delete P.buffs[k]; }

  // ── вода/лава/паутина ──
  const headWater = lqLevel(gLQ(Math.floor(P.x), Math.floor(P.y - P.h + 0.3))) >= 6;
  P.inWater = overlapLiquid(4, false);
  const inLava = overlapLiquid(1, true);
  const inWeb = overlapTile(T_WEB);
  if (headWater && !lqIsLava(gLQ(Math.floor(P.x), Math.floor(P.y - P.h + 0.3)))) {
    P.air = Math.max(0, P.air - dt);
    if (P.air <= 0) { P.airDmgT -= dt; if (P.airDmgT <= 0) { P.airDmgT = 0.7; damagePlayer(8, 0, '#4ea8d8'); } }
  } else { P.air = Math.min(P.airMax, P.air + dt * 3); P.airDmgT = 0; }
  if (inLava) { P.lavaT -= dt; if (P.lavaT <= 0) { P.lavaT = 0.6; damagePlayer(18, 0, '#ff7a3e'); } }

  // ── движение ──
  const want = (IN.right ? 1 : 0) - (IN.left ? 1 : 0);
  if (want) { P.vx += want * ACCEL * dt; P.dir = want; }
  else { const s = sign(P.vx); P.vx -= s * Math.min(Math.abs(P.vx), FRICT * dt); }
  const maxV = MOVE * (inWeb ? 0.3 : 1) * (P.inWater ? 0.6 : 1);
  P.vx = clamp(P.vx, -maxV, maxV);

  if (P.inWater) {
    P.vy += GRAV * 0.32 * dt;
    P.vy = Math.min(P.vy, 4.5);
    if (IN.jump) P.vy -= 34 * dt;
    P.vy = Math.max(P.vy, -6);
  } else {
    P.vy += GRAV * dt * (inWeb ? 0.3 : 1);
    P.vy = Math.min(P.vy, inWeb ? 4 : 34);
    if (IN.jump && P.onGround) {
      if (IN.down && onPlatformOnly()) { P.dropT = 0.25; } // S+прыжок = вниз с платформы
      else { P.vy = -JUMP_V; P.onGround = false; sfx('jump'); }
    }
    if (!IN.jump && P.vy < -6) P.vy = -6; // переменная высота прыжка
  }

  // ── коллизии по осям ──
  moveAxis(P.vx * dt, 0);
  if (P.vy <= 0 || P.inWater || inWeb) P.fallFrom = P.y; // отсчёт падения с апекса
  const wasFalling = P.vy > 0;
  moveAxis(0, P.vy * dt);
  // приземление + урон от падения
  if (wasFalling && P.onGround) {
    const fell = P.y - P.fallFrom;
    if (fell > 8.5 && !P.inWater) damagePlayer(Math.round((fell - 8.5) * 6), 0, '#d8d8d8');
    P.fallFrom = P.y;
  }

  // ── реген ──
  P.regenT += dt;
  const regenRate = P.buffs.regen ? 0.22 : 2.2;
  if (P.regenT >= regenRate && P.hp < P.hpMax) { P.regenT = 0; P.hp = Math.min(P.hpMax, P.hp + 1); }
  P.manaT += dt;
  if (P.manaT >= 0.28 && P.mana < P.manaMax) { P.manaT = 0; P.mana++; }

  // ── использование предметов ──
  P.swingT = Math.max(0, P.swingT - dt);
  P.useT = Math.max(0, P.useT - dt);
  if (IN.mDown && !uiState.open && P.useT <= 0) usePrimary();
  if (P.swingT > 0) swingHits();

  // падение за мир
  if (P.y > WORLD_H + 4) damagePlayer(999, 0, '#ff5a5a');
}

function moveAxis(dx, dy) {
  const r = playerRect();
  if (dx) {
    r.x += dx;
    for (const [tx] of rectVsWorld(r)) {
      if (dx > 0) r.x = Math.min(r.x, tx - r.w - 0.001);
      else r.x = Math.max(r.x, tx + 1 + 0.001);
      P.vx = 0;
    }
    P.x = r.x + P.w / 2;
  }
  if (dy) {
    r.y += dy;
    let hit = false;
    for (const [, ty] of rectVsWorld(r)) {
      if (dy > 0) { r.y = Math.min(r.y, ty - r.h - 0.001); hit = true; }
      else { r.y = Math.max(r.y, ty + 1 + 0.001); }
      P.vy = 0;
    }
    // one-way платформы: только при падении, ноги выше верха тайла, не «спрыгиваем»
    if (dy > 0 && !hit && P.dropT <= 0) {
      const feetY = r.y + r.h;
      const py = Math.floor(feetY);
      for (let x = Math.floor(r.x); x <= Math.floor(r.x + r.w); x++) {
        if (isPlatAt(x, py) && feetY - dy <= py + 0.02) {
          r.y = py - r.h - 0.001; P.vy = 0; hit = true; break;
        }
      }
    }
    P.onGround = dy > 0 && hit;
    P.y = r.y + r.h;
  }
}

// Стоим ли только на платформах (тогда S+прыжок проваливает вниз)
function onPlatformOnly() {
  const r = playerRect();
  const py = Math.floor(r.y + r.h + 0.05);
  let plat = false;
  for (let x = Math.floor(r.x); x <= Math.floor(r.x + r.w); x++) {
    if (isBlockAt(x, py)) return false;
    if (isPlatAt(x, py)) plat = true;
  }
  return plat;
}

// ── урон/смерть ──
function playerDef() {
  let d = 0;
  for (const it of equip) if (it) d += ITEMS[it.id].def || 0;
  return d;
}
function damagePlayer(dmg, dir, color) {
  if (P.dead || P.inv > 0) return;
  const real = Math.max(1, Math.round(dmg - playerDef() * 0.6));
  P.hp -= real; P.inv = 0.7;
  addDmgText(P.x, P.y - P.h - 0.3, real, color || '#ff6a5a');
  burst(P.x, P.y - P.h / 2, '#c8404e', 8, 4);
  if (dir) { P.vx = dir * 7; P.vy = -5; }
  sfx('hurt');
  if (P.hp <= 0) killPlayer();
}
function hurtPlayer(dmg, dir) { damagePlayer(dmg, dir); }

function killPlayer() {
  if (P.dead) return;
  P.dead = true; P.deadT = 3; P.hp = 0;
  sfx('death');
  burst(P.x, P.y - P.h / 2, '#c8404e', 24, 7);
  // теряем половину монет — выпадают на месте смерти
  const total = coinTotal();
  const lost = Math.floor(total / 2);
  if (lost > 0) { coinRemove(lost); dropCoins(P.x, P.y - 1, lost); }
  showMsg('Вы погибли…');
}
function respawn() {
  P.dead = false; P.hp = P.hpMax; P.mana = P.manaMax; P.air = P.airMax;
  P.x = P.spawnX; P.y = P.spawnY; P.vx = 0; P.vy = 0; P.inv = 2; P.fallFrom = P.y;
  for (const k in P.buffs) delete P.buffs[k];
}

// ── добыча / строительство / бой ──
const dmgMap = new Map(); // idx -> {hp, t}
function decayTileDmg(dt) {
  for (const [k, v] of dmgMap) { v.t -= dt; if (v.t <= 0) dmgMap.delete(k); }
}

function reachOk(tx, ty) {
  return dist2(P.x, P.y - P.h / 2, tx + 0.5, ty + 0.5) <= 5.5 * 5.5;
}

function usePrimary() {
  const it = heldItem();
  const [tx, ty] = mouseTile();
  P.dir = (tx + 0.5 >= P.x) ? 1 : -1;
  if (!it) { startSwing(0.3, 4, 3, 2); return; } // кулак: слабый удар
  const def = ITEMS[it.id];
  if (def.kind === 'tool') {
    // инструменты тоже бьют: топор сильнее кирки, урон растёт с уровнем материала
    P.useT = def.spd;
    mineAt(tx, ty, def);
    const mul = def.tool === 'axe' ? 0.6 : def.tool === 'hammer' ? 0.55 : 0.42;
    startSwing(def.spd, Math.max(3, Math.round(def.power * mul)), 3.5, 0.75);
  }
  else if (def.kind === 'block') { P.useT = 0.16; placeAt(tx, ty, it); }
  else if (def.kind === 'sword') { P.useT = def.spd + 0.06; startSwing(def.spd, def.dmg, def.kb, def.arc || 1); sfx('swing'); }
  else if (def.kind === 'bow') { P.useT = def.spd; shootBow(def); }
  else if (def.kind === 'wand') { P.useT = def.spd; castWand(def); }
  else if (def.kind === 'use') { P.useT = 0.4; usePotion(it, def); }
  else if (def.kind === 'summon') { P.useT = 0.5; useSummon(it, def); }
  else if (def.kind === 'ammo' || def.kind === 'mat' || def.kind === 'coin') { /* нечем действовать */ }
  else if (def.kind === 'wall') { P.useT = 0.14; placeWallAt(tx, ty, it, def); }
}

function mineAt(tx, ty, tool) {
  if (!reachOk(tx, ty)) return;
  let t = gT(tx, ty);
  // молот: снимает фоновые стены (когда клетка пустая)
  if (tool.tool === 'hammer') {
    if (t === T_AIR && gW(tx, ty)) {
      const w = gW(tx, ty);
      setWall(tx, ty, 0);
      spawnDrop(tx + 0.5, ty + 0.5, w === 3 ? 20 : 21, 1);
      burst(tx + 0.5, ty + 0.5, '#8a8a8a', 4, 3); sfx('dig');
    }
    return;
  }
  if (t === T_AIR) return;
  const td = TILES[t];
  if (!td || td.hp <= 0) return;
  // инструмент подходит?
  const need = td.tool;
  if (need === 'pick' && tool.tool !== 'pick') return;
  if (need === 'axe' && tool.tool !== 'axe' && tool.tool !== 'pick') return; // кирка рубит хуже
  if (need === 'pick' && tool.tier < td.tier) { showMsg('Нужна кирка получше!'); return; }
  const k = idx(tx, ty);
  let rec = dmgMap.get(k);
  if (!rec) { rec = { hp: td.hp, t: 3 }; dmgMap.set(k, rec); }
  let pw = tool.power;
  if (need === 'axe' && tool.tool === 'pick') pw = Math.max(2, Math.round(pw * 0.45));
  rec.hp -= pw; rec.t = 3;
  burst(tx + 0.5, ty + 0.5, td.color, 3, 3);
  sfx('dig');
  if (rec.hp <= 0) breakTile(tx, ty, t, td);
}

function breakTile(tx, ty, t, td) {
  dmgMap.delete(idx(tx, ty));
  if (t === T_TRUNK) { // валим всё дерево
    const res = fellTree(tx, ty);
    spawnDrop(tx + 0.5, ty + 0.5, 7, res.wood);
    for (let i = 0; i < res.acorns; i++) spawnDrop(tx + 0.5, ty - 0.5, 8, 1);
    sfx('treefall'); onTutorial('wood');
    return;
  }
  if (t === T_CHEST) {
    const ch = chests.get(idx(tx, ty));
    if (ch && ch.some((s) => s)) { showMsg('Сундук не пуст!'); return; }
    chests.delete(idx(tx, ty));
    if (uiState.chest === idx(tx, ty)) uiState.chest = null;
  }
  if (t === T_DOORC || t === T_DOORO) { // вторая половина двери
    const up = gT(tx, ty - 1), dn = gT(tx, ty + 1);
    if (up === T_DOORC || up === T_DOORO) setTile(tx, ty - 1, T_AIR);
    else if (dn === T_DOORC || dn === T_DOORO) setTile(tx, ty + 1, T_AIR);
  }
  setTile(tx, ty, T_AIR);
  if (td.drop) spawnDrop(tx + 0.5, ty + 0.5, td.drop, 1);
  burst(tx + 0.5, ty + 0.5, td.color, 8, 5);
  if (t === T_STONE || t === T_ORECU) onTutorial('stone');
}

function placeAt(tx, ty, slot) {
  if (!reachOk(tx, ty) || gT(tx, ty) !== T_AIR) return;
  const def = ITEMS[slot.id];
  const tile = def.tile;
  // жёлудь — только на подходящую землю
  if (def.ground && !def.ground.includes(gT(tx, ty + 1))) return;
  // опора: сосед-блок, стена или платформа
  const support = isSolid(gT(tx - 1, ty)) || isSolid(gT(tx + 1, ty)) || isSolid(gT(tx, ty - 1)) || isSolid(gT(tx, ty + 1)) ||
    gW(tx, ty) !== 0 || gT(tx, ty + 1) === T_PLATFORM || gT(tx, ty - 1) === T_PLATFORM ||
    gT(tx, ty + 1) === T_TRUNK;
  if (!support && tile !== T_TORCH) return;
  if (tile === T_TORCH && !(isSolid(gT(tx, ty + 1)) || isSolid(gT(tx - 1, ty)) || isSolid(gT(tx + 1, ty)) || gW(tx, ty))) return;
  // не ставить блок в себя/врагов (кроме несолидных)
  if (isSolid(tile)) {
    const r = { x: tx, y: ty, w: 1, h: 1 };
    const pr = playerRect();
    if (pr.x < r.x + 1 && pr.x + pr.w > r.x && pr.y < r.y + 1 && pr.y + pr.h > r.y) return;
    for (const f of foes) if (!f.dead && Math.abs(f.x - (tx + 0.5)) < f.w / 2 + 0.5 && Math.abs(f.y - f.h / 2 - (ty + 0.5)) < f.h / 2 + 0.5) return;
  }
  if (def.door) { // дверь 2 тайла
    if (gT(tx, ty - 1) !== T_AIR || !isSolid(gT(tx, ty + 1))) { showMsg('Двери нужно 2 клетки и пол'); return; }
    // верхняя половина тоже не должна влезать в игрока/врага
    const pr2 = playerRect();
    if (pr2.x < tx + 1 && pr2.x + pr2.w > tx && pr2.y < ty && pr2.y + pr2.h > ty - 1) return;
    for (const f of foes) if (!f.dead && Math.abs(f.x - (tx + 0.5)) < f.w / 2 + 0.5 && Math.abs(f.y - f.h / 2 - (ty - 0.5)) < f.h / 2 + 0.5) return;
    setTile(tx, ty, T_DOORC); setTile(tx, ty - 1, T_DOORC);
  } else {
    setTile(tx, ty, tile);
    if (tile === T_CHEST) chests.set(idx(tx, ty), new Array(27).fill(null));
    if (tile === T_SAPLING) world.saplings.push(idx(tx, ty)); // индекс для роста деревьев
  }
  if (lqLevel(gLQ(tx, ty)) && isSolid(tile)) setLiquid(tx, ty, 0); // блок вытесняет жидкость
  invConsume(slot, 1);
  sfx('place');
  if (tile === T_BENCH) onTutorial('bench');
  if (tile === T_FURNACE) onTutorial('furnace');
  if (tile === T_ANVIL) onTutorial('anvil');
}

function placeWallAt(tx, ty, slot, def) {
  if (!reachOk(tx, ty) || gW(tx, ty) !== 0 || isSolid(gT(tx, ty))) return;
  // стена ставится рядом с существующей стеной или блоком
  const near = gW(tx - 1, ty) || gW(tx + 1, ty) || gW(tx, ty - 1) || gW(tx, ty + 1) ||
    isSolid(gT(tx - 1, ty)) || isSolid(gT(tx + 1, ty)) || isSolid(gT(tx, ty - 1)) || isSolid(gT(tx, ty + 1));
  if (!near) return;
  setWall(tx, ty, def.wall);
  invConsume(slot, 1); sfx('place');
}

// ── оружие ──
function startSwing(dur, dmg, kb, arc) {
  P.swingT = dur; P.swingDur = dur; P.swingId++;
  P.swingDmg = dmg; P.swingKb = kb; P.swingArc = arc || 1;
}
function swingHits() {
  if (!P.swingDmg) return;
  const r = 2.2 + P.swingArc * 0.9;
  const cx = P.x + P.dir * 0.6, cy = P.y - P.h / 2;
  for (const f of foes) {
    if (f.dead || f.hitBy === P.swingId) continue;
    const fx = f.x, fy = f.y - f.h / 2;
    if (dist2(cx, cy, fx, fy) < (r + Math.max(f.w, f.h) / 2) ** 2 && sign(fx - P.x) !== -P.dir) {
      f.hitBy = P.swingId;
      hurtFoe(f, P.swingDmg, P.dir, P.swingKb);
    }
  }
}
function shootBow(def) {
  if (!invHas(42, 1)) { showMsg('Нет стрел!'); return; }
  const [mx, my] = mouseWorldPos();
  const a = Math.atan2(my - (P.y - P.h * 0.7), mx - P.x);
  const shots = def.multi || 1;
  invTake(42, 1);
  for (let i = 0; i < shots; i++) {
    const sp = def.vel * (0.92 + Math.random() * 0.16);
    const aa = a + (i - (shots - 1) / 2) * 0.09;
    projs.push({ x: P.x, y: P.y - P.h * 0.7, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, dmg: def.dmg, kind: 'arrow', from: 'p', grav: 16, life: 3, kb: 5 });
  }
  sfx('shoot');
}
function castWand(def) {
  if (P.mana < def.mana) { showMsg('Мало маны'); return; }
  P.mana -= def.mana;
  const [mx, my] = mouseWorldPos();
  const a = Math.atan2(my - (P.y - P.h * 0.7), mx - P.x);
  projs.push({
    x: P.x, y: P.y - P.h * 0.7, vx: Math.cos(a) * 15, vy: Math.sin(a) * 15,
    dmg: def.dmg, kind: def.dmg > 20 ? 'fire' : 'spark', from: 'p', home: 1, life: 2.6, kb: 5,
  });
  sfx('magic');
}
function usePotion(slot, def) {
  if (def.heal) {
    if (P.potionCd > 0) { showMsg('Зелье на перезарядке (' + Math.ceil(P.potionCd) + 'с)'); return; }
    if (P.hp >= P.hpMax) return;
    P.hp = Math.min(P.hpMax, P.hp + def.heal); P.potionCd = 30;
  } else if (def.mana) {
    if (P.mana >= P.manaMax) return;
    P.mana = P.manaMax;
  } else if (def.buff) {
    P.buffs[def.buff] = def.buffT;
  }
  invConsume(slot, 1); sfx('potion');
}
function useSummon(slot, def) {
  const err = trySummonBoss(def.boss);
  if (err) { showMsg(err); return; }
  invConsume(slot, 1);
}

// ── взаимодействие (ПКМ) ──
function interactAt(tx, ty) {
  if (!reachOk(tx, ty)) return;
  const t = gT(tx, ty);
  if (t === T_DOORC) { toggleDoor(tx, ty, true); return; }
  if (t === T_DOORO) { toggleDoor(tx, ty, false); return; }
  if (t === T_CHEST) { uiState.open = true; uiState.chest = idx(tx, ty); uiState.shop = false; sfx('door'); return; }
  if (t === T_BED) {
    P.spawnX = tx + 0.5; P.spawnY = ty;
    showMsg('Точка возрождения установлена'); sfx('craft');
    return;
  }
  // NPC рядом?
  for (const n of npcs) {
    if (Math.abs(n.x - (tx + 0.5)) < 1 && Math.abs(n.y - 1 - (ty + 0.5)) < 1.4) {
      uiState.open = true; uiState.shop = true; uiState.chest = null;
      showMsg('Торговец: «Смотри, что есть!»');
      return;
    }
  }
}
function toggleDoor(tx, ty, open) {
  const nt = open ? T_DOORO : T_DOORC;
  if (!open) { // нельзя закрыть, если стоим в проёме
    const pr = playerRect();
    if (pr.x < tx + 1 && pr.x + pr.w > tx && pr.y < ty + 2 && pr.y + pr.h > ty - 1) return;
  }
  setTile(tx, ty, nt);
  const up = gT(tx, ty - 1), dn = gT(tx, ty + 1);
  if (up === T_DOORC || up === T_DOORO) setTile(tx, ty - 1, nt);
  if (dn === T_DOORC || dn === T_DOORO) setTile(tx, ty + 1, nt);
  sfx('door');
}

/* ══════ 06-enemies.js ══════ */
/* Враги: спавн-директор (день/ночь/глубина/биом), ИИ, урон, дроп. */

const foes = [];

// Общая физика тела с коллизиями (для наземных врагов)
function moveBody(b, dt) {
  b.vy += GRAV * dt;
  b.vy = Math.min(b.vy, 34);
  // X
  let r = { x: b.x - b.w / 2 + b.vx * dt, y: b.y - b.h, w: b.w, h: b.h };
  let blocked = false;
  for (const [tx] of rectVsWorld(r)) {
    if (b.vx > 0) r.x = Math.min(r.x, tx - b.w - 0.001);
    else if (b.vx < 0) r.x = Math.max(r.x, tx + 1 + 0.001);
    blocked = true;
  }
  if (blocked) b.vx = 0;
  b.x = r.x + b.w / 2;
  // Y (знак скорости фиксируем ДО обнуления — иначе второй тайл шва
  // обрабатывается противоположной веткой и тело проваливается сквозь пол)
  const falling = b.vy > 0;
  r.y += b.vy * dt;
  let hit = false;
  for (const [, ty] of rectVsWorld(r)) {
    if (falling) { r.y = Math.min(r.y, ty - b.h - 0.001); hit = true; }
    else r.y = Math.max(r.y, ty + 1 + 0.001);
    b.vy = 0;
  }
  b.onGround = hit;
  b.y = r.y + b.h;
  return blocked;
}

function spawnFoe(type, x, y, opts) {
  const d = FOES[type];
  if (!d) return null;
  const f = {
    type, name: d.name, x, y, vx: 0, vy: 0, w: d.w, h: d.h,
    hp: d.hp, hpMax: d.hp, dmg: d.dmg, ai: d.ai, dir: 1, t: Math.random() * 2,
    dead: false, hitBy: 0, coins: d.coins, drops: d.drops, color: d.color,
    glow: d.glow || 0, lava: d.lava || 0, onGround: false, boss: false, score: d.score,
    burn: d.burn || 0, burnT: 0,
  };
  if (d.ai === 'worm') {
    f.trail = []; f.segs = d.segs; f.inGround = true; f.noGrav = true;
  }
  Object.assign(f, opts || {});
  foes.push(f);
  return f;
}

let spawnT = 0;
function updateSpawner(dt) {
  spawnT -= dt;
  if (spawnT > 0) return;
  spawnT = 0.8;
  // деспавн далёких
  for (let i = foes.length - 1; i >= 0; i--) {
    const f = foes[i];
    if (!f.boss && Math.abs(f.x - P.x) > 95) foes.splice(i, 1);
  }
  const py = Math.floor(P.y), night = isNight();
  const underground = py > surf[clamp(Math.floor(P.x), 0, WORLD_W - 1)] + 12;
  const hell = py >= HELL_Y - 6, caves = py >= 240 && !hell;
  const cap = hell ? 9 : caves ? 8 : underground ? 7 : night ? 8 : 5;
  let count = 0;
  for (const f of foes) if (!f.boss && !f.dead) count++;
  if (count >= cap) return;
  // точка спавна за экраном
  const sx = clamp(Math.floor(P.x + (Math.random() < 0.5 ? -1 : 1) * (26 + Math.random() * 18)), 4, WORLD_W - 5);
  let type = null, sy = 0;
  const r = Math.random();
  if (hell) { type = r < 0.5 ? 'demon' : 'lavaslime'; }
  else if (caves) { type = r < 0.42 ? 'skeleton' : r < 0.72 ? 'bat' : 'worm'; }
  else if (underground) { type = r < 0.55 ? 'bat' : r < 0.8 ? 'slime' : 'skeleton'; }
  else if (night) { type = r < 0.55 ? 'zombie' : 'eye'; }
  else {
    const b = biomeAt(Math.floor(P.x), _bnCache);
    type = b === 'snow' ? 'iceslime' : 'slime';
  }
  const d = FOES[type];
  if (d.ai === 'fly' || d.ai === 'bat') {
    // летуны — в воздухе недалеко по вертикали
    sy = py - 6 + Math.floor(Math.random() * 10);
    if (gT(sx, sy) !== T_AIR) return;
  } else if (d.ai === 'worm') {
    sy = py + 4 + Math.floor(Math.random() * 8);
    if (!isSolid(gT(sx, sy))) return;
  } else {
    // наземные: ищем пол в окрестности вертикали игрока
    sy = -1;
    for (let y = Math.max(2, py - 14); y < Math.min(WORLD_H - 2, py + 16); y++)
      if (gT(sx, y) === T_AIR && gT(sx, y - 1) === T_AIR && isSolid(gT(sx, y + 1))) { sy = y; break; }
    if (sy < 0) return;
    if (!underground && lqLevel(gLQ(sx, sy))) return;
  }
  if (gW(sx, sy) === 3) return; // деревянные (построенные игроком) стены защищают дом от спавна
  spawnFoe(type, sx + 0.5, sy + 1);
}
let _bnCache = null; // шум биомов для спавнера (инициализируется при генерации мира)

// На враге дневной свет? (нет твёрдой крыши над головой — открытое небо)
function sunlitFoe(f) {
  const fx = Math.floor(f.x);
  if (fx < 0 || fx >= WORLD_W) return false;
  const headY = Math.floor(f.y - f.h + 0.2);
  for (let y = headY; y >= 0; y--) if (isSolid(gT(fx, y))) return false;
  return true;
}

function updateFoes(dt) {
  for (let i = foes.length - 1; i >= 0; i--) {
    const f = foes[i];
    if (f.dead) { foes.splice(i, 1); continue; }
    f.t += dt;
    if (f.boss) { updateBoss(f, dt); }
    else if (f.ai === 'hop') aiHop(f, dt);
    else if (f.ai === 'walk') aiWalk(f, dt);
    else if (f.ai === 'fly') aiFly(f, dt);
    else if (f.ai === 'bat') aiBat(f, dt);
    else if (f.ai === 'worm') aiWorm(f, dt);
    else if (f.ai === 'caster') aiCaster(f, dt);
    // лава жжёт всех, кроме огненных
    if (!f.lava && !f.boss && lqIsLava(gLQ(Math.floor(f.x), Math.floor(f.y - f.h / 2))) && lqLevel(gLQ(Math.floor(f.x), Math.floor(f.y - f.h / 2)))) {
      f.lavaT = (f.lavaT || 0) - dt;
      if (f.lavaT <= 0) { f.lavaT = 0.6; hurtFoe(f, 12, 0, 0); }
    }
    // ночные твари (зомби, глаза) сгорают на дневном свету — быстро
    if (f.burn && !f.boss && !f.dead && !isNight() && sunlitFoe(f)) {
      f.onFire = 1;
      f.burnT -= dt;
      // дым/пламя каждый кадр
      if (Math.random() < 0.6) burst(f.x + (Math.random() - 0.5) * f.w, f.y - f.h * (0.3 + Math.random() * 0.6), Math.random() < 0.5 ? '#ff8a3e' : '#5a5a5a', 1, 2);
      if (f.burnT <= 0) {
        f.burnT = 0.3;
        hurtFoe(f, Math.max(6, Math.ceil(f.hpMax / 4)), 0, 0); // ~1.2 c до золы
      }
    } else f.onFire = 0;
    // контактный урон
    if (!P.dead && f.hp > 0) {
      const pr = playerRect();
      if (pr.x < f.x + f.w / 2 && pr.x + pr.w > f.x - f.w / 2 &&
          pr.y < f.y && pr.y + pr.h > f.y - f.h)
        hurtPlayer(f.dmg, sign(P.x - f.x) || 1);
    }
  }
}

function aiHop(f, dt) {
  if (f.onGround) {
    f.vx *= 0.8;
    f.jumpT = (f.jumpT || 1 + Math.random()) - dt;
    if (f.jumpT <= 0) {
      f.jumpT = 1.1 + Math.random() * 1.2;
      f.dir = sign(P.x - f.x) || 1;
      f.vx = f.dir * (2.6 + Math.random() * 2);
      f.vy = -(8 + Math.random() * 3.5);
      f.squash = 0.35;
    }
  }
  f.squash = Math.max(0, (f.squash || 0) - dt);
  moveBody(f, dt);
}
function aiWalk(f, dt) {
  f.dir = sign(P.x - f.x) || f.dir;
  const sp = f.type === 'skeleton' ? 2.7 : 2.2;
  f.vx = lerp(f.vx, f.dir * sp, dt * 8);
  const blocked = moveBody(f, dt);
  if (blocked && f.onGround) f.vy = -11.5; // перепрыгнуть препятствие
  // выпрыгнуть из воды
  if (f.onGround && lqLevel(gLQ(Math.floor(f.x), Math.floor(f.y - 0.5))) >= 6) f.vy = -12;
}
function aiFly(f, dt) { // летающий глаз: круги и пикирование по дуге
  f.noGrav = true;
  if (!f.state) { f.state = 'orbit'; f.st = 0; }
  f.st += dt;
  const tx = P.x, ty = P.y - P.h / 2;
  if (f.state === 'orbit') {
    const ang = f.t * 1.6, ox = tx + Math.cos(ang) * 9, oy = ty - 5 + Math.sin(ang * 1.3) * 2.5;
    f.vx = lerp(f.vx, clamp((ox - f.x) * 2.4, -8, 8), dt * 4);
    f.vy = lerp(f.vy, clamp((oy - f.y) * 2.4, -8, 8), dt * 4);
    if (f.st > 2.2) { f.state = 'dive'; f.st = 0; const a = Math.atan2(ty - f.y, tx - f.x); f.vx = Math.cos(a) * 13; f.vy = Math.sin(a) * 13; }
  } else {
    if (f.st > 0.8) { f.state = 'orbit'; f.st = 0; }
  }
  flyMove(f, dt);
  f.dir = sign(f.vx) || f.dir;
}
function aiBat(f, dt) {
  f.noGrav = true;
  const a = Math.atan2((P.y - 1 - f.y) + Math.sin(f.t * 7) * 2.4, (P.x - f.x) + Math.cos(f.t * 5) * 2);
  f.vx = lerp(f.vx, Math.cos(a) * 5.2, dt * 5);
  f.vy = lerp(f.vy, Math.sin(a) * 5.2, dt * 5);
  flyMove(f, dt);
  f.dir = sign(f.vx) || f.dir;
}
function flyMove(f, dt) { // полёт со скольжением вдоль блоков
  const nx = f.x + f.vx * dt, ny = f.y + f.vy * dt;
  if (!isBlockAt(Math.floor(nx), Math.floor(f.y - f.h / 2))) f.x = nx; else f.vx *= -0.5;
  if (!isBlockAt(Math.floor(f.x), Math.floor(ny - f.h / 2))) f.y = ny; else f.vy *= -0.5;
}
function aiWorm(f, dt) {
  const hx = Math.floor(f.x), hy = Math.floor(f.y);
  const inSolid = isSolid(gT(hx, hy));
  const tx = P.x, ty = P.y - 0.5;
  if (inSolid) {
    f.inGround = true;
    const a = Math.atan2(ty - f.y, tx - f.x);
    // в земле — плывёт к игроку
    f.vx = lerp(f.vx, Math.cos(a) * 6.5, dt * 3);
    f.vy = lerp(f.vy, Math.sin(a) * 6.5, dt * 3);
  } else {
    // в воздухе — баллистика (выпрыгнул)
    if (f.inGround) { burst(f.x, f.y, '#7a5a42', 10, 5); sfx('dig'); }
    f.inGround = false;
    f.vy += 22 * dt;
  }
  f.x += f.vx * dt; f.y += f.vy * dt;
  f.x = clamp(f.x, 1, WORLD_W - 1); f.y = clamp(f.y, 1, WORLD_H - 1);
  // хвост
  f.trail.unshift([f.x, f.y]);
  if (f.trail.length > f.segs * 6 + 2) f.trail.pop();
  // урон от сегментов
  if (!P.dead) {
    for (let s = 0; s < f.segs; s++) {
      const p = f.trail[Math.min(f.trail.length - 1, s * 6)];
      if (p && Math.abs(P.x - p[0]) < 0.7 && Math.abs(P.y - P.h / 2 - p[1]) < 1.1) {
        hurtPlayer(Math.round(f.dmg * (s ? 0.6 : 1)), sign(P.x - p[0]) || 1);
        break;
      }
    }
  }
}
function aiCaster(f, dt) { // демон: парит, стрейфит, кидает огненные шары
  f.noGrav = true;
  const wantX = P.x + (f.strafe || (f.strafe = Math.random() < 0.5 ? -7 : 7));
  const wantY = P.y - 5 + Math.sin(f.t * 2) * 1.5;
  f.vx = lerp(f.vx, clamp((wantX - f.x) * 1.8, -6, 6), dt * 3);
  f.vy = lerp(f.vy, clamp((wantY - f.y) * 1.8, -6, 6), dt * 3);
  flyMove(f, dt);
  f.dir = sign(P.x - f.x) || f.dir;
  f.shootT = (f.shootT || 2) - dt;
  if (f.shootT <= 0) {
    f.shootT = 2.6 + Math.random();
    f.strafe = Math.random() < 0.5 ? -7 : 7;
    const a = Math.atan2((P.y - P.h / 2) - (f.y - f.h / 2), P.x - f.x);
    projs.push({ x: f.x, y: f.y - f.h / 2, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, dmg: 16, kind: 'fire', from: 'e', life: 3.2 });
    sfx('fireball');
  }
}

function hurtFoe(f, dmg, dir, kb) {
  if (f.dead || f.hp <= 0) return;
  const real = Math.max(1, Math.round(dmg * (0.9 + Math.random() * 0.25)));
  f.hp -= real;
  addDmgText(f.x, f.y - f.h - 0.2, real);
  burst(f.x, f.y - f.h / 2, f.color, 5, 4);
  sfx('hit');
  if (!f.boss && !f.noKb) {
    f.vx = dir * (kb || 4) * 1.4;
    f.vy = Math.min(f.vy, -3.5);
  }
  if (f.hp <= 0) killFoe(f);
}
function killFoe(f) {
  f.hp = 0;
  burst(f.x, f.y - f.h / 2, f.color, 16, 6);
  sfx('foedie');
  for (const [id, a, b, ch] of f.drops || [])
    if (Math.random() < ch) spawnDrop(f.x, f.y - f.h / 2, id, a + Math.floor(Math.random() * (b - a + 1)));
  if (f.coins) dropCoins(f.x, f.y - f.h / 2, Math.round(f.coins * (0.7 + Math.random() * 0.7)));
  addScore(f.score || 5);
  if (f.boss) onBossKilled(f);
  f.dead = true;
}

/* ══════ 07-bosses.js ══════ */
/* Боссы: призыв предметами, фазовые ИИ, полоса HP, дроп. */

function activeBoss() {
  for (const f of foes) if (f.boss && !f.dead) return f;
  return null;
}

function trySummonBoss(kind) {
  if (activeBoss()) return 'Босс уже здесь!';
  const py = Math.floor(P.y);
  if (kind === 'eye') {
    if (!isNight()) return 'Глаз является только ночью';
    if (py > surf[clamp(Math.floor(P.x), 0, WORLD_W - 1)] + 12) return 'Призывается на поверхности';
  } else if (kind === 'golem') {
    if (py < 200) return 'Голем спит глубоко в пещерах (глубже!)';
  } else if (kind === 'demon') {
    if (py < HELL_Y - 10) return 'Владыка ждёт в аду';
  }
  const f = spawnBossAt(kind);
  if (!f) return 'Рядом нет места для призыва';
  showMsg(f.name + ' пробудился!');
  sfx('roar');
  shake(0.5);
  return null;
}

// Спавн босса без проверок условий (призыв и восстановление из сейва)
function spawnBossAt(kind) {
  const b = BOSSES[kind];
  if (!b) return null;
  let sx = P.x + (Math.random() < 0.5 ? -14 : 14), sy = P.y - 8;
  if (kind === 'golem') {
    // наземному голему нужна ниша: 3 тайла воздуха над полом, ищем вокруг игрока
    let found = null;
    for (const dxa of [10, -10, 13, -13, 16, -16, 7, -7]) {
      const x = clamp(Math.floor(P.x) + dxa, 3, WORLD_W - 4);
      for (let y = Math.max(3, Math.floor(P.y) - 8); y < Math.min(WORLD_H - 2, Math.floor(P.y) + 10); y++) {
        let ok = isSolid(gT(x, y + 1)) && !lqLevel(gLQ(x, y));
        for (let dy = 0; ok && dy < 4; dy++)
          for (let dx2 = -1; dx2 <= 1; dx2++) if (isSolid(gT(x + dx2, y - dy))) ok = false;
        if (ok) { found = [x + 0.5, y + 1]; break; }
      }
      if (found) break;
    }
    if (!found) return null;
    sx = found[0]; sy = found[1];
  }
  const f = spawnFoe('slime', sx, sy, {
    boss: true, kind, name: b.name, hp: b.hp, hpMax: b.hp, dmg: b.dmg,
    w: b.w, h: b.h, coins: b.coins, drops: b.drops, score: b.score,
    color: kind === 'eye' ? '#c84848' : kind === 'golem' ? '#d8d0c0' : '#b04858',
    ai: 'boss', noGrav: kind !== 'golem', state: 'intro', st: 0, phase: 1,
    glow: kind === 'demon' ? 10 : 0, type: 'boss_' + kind,
  });
  return f;
}

function updateBoss(f, dt) {
  f.st = (f.st || 0) + dt;
  const px = P.x, py = P.y - P.h / 2;
  const frac = f.hp / f.hpMax;
  // побег/рассвет
  if (Math.abs(f.x - px) > 85 || (f.kind === 'eye' && !isNight() && f.state !== 'flee')) {
    f.state = 'flee';
  }
  if (f.state === 'flee') {
    f.y -= 20 * dt; f.x += sign(f.x - px + 0.1) * 14 * dt;
    if (f.st > 3) f.dead = true;
    return;
  }
  if (f.kind === 'eye') bossEye(f, dt, px, py, frac);
  else if (f.kind === 'golem') bossGolem(f, dt, px, py, frac);
  else bossDemon(f, dt, px, py, frac);
  // контактный урон и так проверяется в updateFoes
}

function bossEye(f, dt, px, py, frac) {
  if (frac < 0.5 && f.phase === 1) { f.phase = 2; showMsg('Глаз в ярости!'); sfx('roar'); burst(f.x, f.y, '#c84848', 20, 8); }
  const speed = f.phase === 2 ? 19 : 14;
  if (f.state === 'intro') { f.state = 'orbit'; f.st = 0; }
  if (f.state === 'orbit') {
    const ang = f.t * (f.phase === 2 ? 2.2 : 1.4);
    const ox = px + Math.cos(ang) * 11, oy = py - 7 + Math.sin(ang * 1.7) * 3;
    f.vx = lerp(f.vx, clamp((ox - f.x) * 2.2, -10, 10), dt * 3.5);
    f.vy = lerp(f.vy, clamp((oy - f.y) * 2.2, -10, 10), dt * 3.5);
    if (f.st > (f.phase === 2 ? 1.3 : 2.4)) { f.state = 'tele'; f.st = 0; f.dashN = f.phase === 2 ? 3 : 1; }
  } else if (f.state === 'tele') { // телеграф: дрожит
    f.vx = lerp(f.vx, 0, dt * 6); f.vy = lerp(f.vy, 0, dt * 6);
    f.x += (Math.random() - 0.5) * 0.15;
    if (f.st > 0.45) {
      f.state = 'dash'; f.st = 0;
      const a = Math.atan2(py - f.y, px - f.x);
      f.vx = Math.cos(a) * speed; f.vy = Math.sin(a) * speed;
      sfx('dash');
    }
  } else if (f.state === 'dash') {
    if (f.st > 0.9) {
      f.dashN--;
      if (f.dashN > 0) { f.state = 'tele'; f.st = 0.3; } else { f.state = 'orbit'; f.st = 0; }
    }
  }
  f.x += f.vx * dt; f.y += f.vy * dt;
  f.y = Math.max(f.y, 8);
  f.dir = sign(f.vx) || f.dir;
}

function bossGolem(f, dt, px, py, frac) {
  if (frac < 0.7 && !f.sum1) { f.sum1 = 1; summonMinions(f, 2); }
  if (frac < 0.4 && !f.sum2) { f.sum2 = 1; summonMinions(f, 2); }
  if (f.state === 'intro') { f.state = 'walk'; f.st = 0; }
  if (f.state === 'walk') {
    f.dir = sign(px - f.x) || f.dir;
    f.vx = lerp(f.vx, f.dir * 3, dt * 6);
    const blocked = moveBody(f, dt);
    if (blocked && f.onGround) f.vy = -13;
    if (f.st > 3.6) { f.state = 'throw'; f.st = 0; f.thrown = 0; }
    if (f.st > 2.2 && Math.abs(px - f.x) < 7 && f.onGround && Math.random() < 0.02) { f.state = 'slam'; f.st = 0; f.vy = -15; f.vx = sign(px - f.x) * 7; }
  } else if (f.state === 'throw') {
    f.vx = lerp(f.vx, 0, dt * 8);
    moveBody(f, dt);
    if (f.st > 0.5 && f.thrown < 3) {
      f.thrown++;
      const a = Math.atan2(py - (f.y - f.h), px - f.x) - 0.35 + f.thrown * 0.22;
      const sp = 13 + f.thrown;
      projs.push({ x: f.x, y: f.y - f.h + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, dmg: 20, kind: 'bone', from: 'e', grav: 18, life: 4 });
      sfx('shoot'); f.st = 0.2;
    }
    if (f.thrown >= 3) { f.state = 'walk'; f.st = 0; }
  } else if (f.state === 'slam') {
    moveBody(f, dt);
    if (f.onGround && f.st > 0.4) {
      shake(0.6); sfx('slam');
      burst(f.x, f.y, '#c8b898', 22, 8);
      if (P.onGround && Math.abs(P.x - f.x) < 7 && Math.abs(P.y - f.y) < 5) hurtPlayer(26, sign(P.x - f.x) || 1);
      f.state = 'walk'; f.st = 0;
    }
  }
}
function summonMinions(f, n) {
  showMsg('Голем призывает слуг!'); sfx('roar');
  for (let i = 0; i < n; i++) spawnFoe('skeleton', f.x + (i ? 3 : -3), f.y - 1);
}

function bossDemon(f, dt, px, py, frac) {
  if (frac < 0.45 && f.phase === 1) { f.phase = 2; showMsg('Владыка обрушивает небеса!'); sfx('roar'); }
  if (f.state === 'intro') { f.state = 'hover'; f.st = 0; }
  if (f.state === 'hover') {
    const wx = px + (f.strafe || (f.strafe = 8)), wy = py - 7 + Math.sin(f.t * 1.8) * 2;
    f.vx = lerp(f.vx, clamp((wx - f.x) * 2, -8, 8), dt * 3);
    f.vy = lerp(f.vy, clamp((wy - f.y) * 2, -8, 8), dt * 3);
    f.shootT = (f.shootT || 1.5) - dt;
    if (f.shootT <= 0) {
      f.shootT = f.phase === 2 ? 2 : 2.8;
      f.strafe = -f.strafe;
      const n = f.phase === 2 ? 5 : 3;
      const base = Math.atan2(py - (f.y - f.h / 2), px - f.x);
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.16;
        projs.push({ x: f.x, y: f.y - f.h / 2, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, dmg: 22, kind: 'fire', from: 'e', life: 3 });
      }
      sfx('fireball');
    }
    if (f.phase === 2) {
      f.meteorT = (f.meteorT || 2.5) - dt;
      if (f.meteorT <= 0) {
        f.meteorT = 2.2;
        for (let i = 0; i < 3; i++)
          projs.push({ x: px - 8 + Math.random() * 16, y: py - 14, vx: (Math.random() - 0.5) * 3, vy: 8, dmg: 26, kind: 'fire', from: 'e', grav: 10, life: 4 });
        sfx('fireball');
      }
    }
    if (f.st > 5) { f.state = 'dash'; f.st = 0; const a = Math.atan2(py - f.y, px - f.x); f.vx = Math.cos(a) * 17; f.vy = Math.sin(a) * 17; sfx('dash'); }
  } else if (f.state === 'dash') {
    if (f.st > 0.8) { f.state = 'hover'; f.st = 0; }
  }
  f.x += f.vx * dt; f.y += f.vy * dt;
  f.dir = sign(px - f.x) || f.dir;
}

function onBossKilled(f) {
  showMsg(f.name + ' повержен!');
  sfx('victory'); shake(0.8);
  flags['boss_' + f.kind] = 1;
  onTutorial('boss');
}

/* ══════ 08-npc.js ══════ */
/* NPC-торговец: детекция дома (замкнутость, стены, свет, мебель) и заселение. */

const npcs = [];
let houseCheckT = 8;

function updateNpcs(dt) {
  // проверка жилья раз в 4 с, если торговца ещё нет
  houseCheckT -= dt;
  if (houseCheckT <= 0) {
    houseCheckT = 4;
    if (npcs.length === 0) {
      const home = findValidHouse();
      if (home) {
        npcs.push({ x: home[0] + 0.5, y: home[1], vx: 0, vy: 0, w: 0.8, h: 1.85, dir: 1, homeX: home[0] + 0.5, t: 0, onGround: false });
        showMsg('В дом заселился Торговец!');
        sfx('victory');
        onTutorial('house');
      }
    }
  }
  for (const n of npcs) {
    n.t += dt;
    // ленивая прогулка вокруг дома
    if (!n.walkT || n.walkT <= 0) {
      n.walkT = 2 + Math.random() * 3;
      n.wdir = Math.random() < 0.4 ? 0 : (Math.random() < 0.5 ? -1 : 1);
      if (Math.abs(n.x - n.homeX) > 5) n.wdir = sign(n.homeX - n.x);
    }
    n.walkT -= dt;
    n.vx = lerp(n.vx, (n.wdir || 0) * 1.4, dt * 8);
    const blocked = moveBody(n, dt);
    if (blocked && n.onGround) n.vy = -9;
    if (n.wdir) n.dir = n.wdir;
  }
}

// Дом: замкнутая область 15..200 клеток вокруг стола, ≥70% фоновых стен,
// есть факел, дверь на границе, стол и стул внутри.
function findValidHouse() {
  // ищем столы в радиусе 40 тайлов от игрока
  const px = Math.floor(P.x), py = Math.floor(P.y);
  for (let y = Math.max(1, py - 30); y < Math.min(WORLD_H - 1, py + 30); y++)
    for (let x = Math.max(1, px - 40); x < Math.min(WORLD_W - 1, px + 40); x++) {
      if (gT(x, y) !== T_TABLE) continue;
      const res = checkHouse(x, y - 1);
      if (res) return res;
    }
  return null;
}

function checkHouse(sx, sy) {
  if (isSolid(gT(sx, sy))) return null;
  const seen = new Set(), stack = [[sx, sy]];
  let cells = 0, walls = 0, torch = 0, door = 0, table = 0, chair = 0;
  let floorSpot = null;
  while (stack.length) {
    const [x, y] = stack.pop();
    const k = idx(x, y);
    if (seen.has(k)) continue;
    seen.add(k);
    const t = gT(x, y);
    if (t === T_DOORC || t === T_DOORO) { door++; continue; } // дверь = граница
    if (isSolid(t)) continue;
    cells++;
    if (cells > 200) return null;                 // слишком большой/дырявый
    if (y < 4 || gW(x, y) === 0 && y <= surf[clamp(x, 0, WORLD_W - 1)] - 1) { /* открытое небо? — проверяем стенами */ }
    if (gW(x, y) !== 0) walls++;
    if (t === T_TORCH) torch++;
    if (t === T_TABLE) table++;
    if (t === T_CHAIR) chair++;
    if (isSolid(gT(x, y + 1)) && gT(x, y - 1) === T_AIR && !floorSpot) floorSpot = [x, y];
    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  if (cells < 15 || cells > 200) return null;
  if (walls / cells < 0.7) return null;
  if (!torch || !door || !table || !chair) return null;
  return floorSpot || [sx, sy];
}

/* ══════ 09-inventory.js ══════ */
/* Инвентарь 50 слотов (0-9 хотбар), броня, монеты, крафт, сундуки. */

const inv = new Array(50).fill(null);
const equip = [null, null, null]; // шлем / нагрудник / поножи

const uiState = {
  open: false,        // инвентарь открыт
  hotbar: 0,          // выбранный слот
  chest: null,        // idx открытого сундука
  shop: false,        // открыт магазин торговца
  cursor: null,       // предмет «в руке» при перетаскивании {id,n}
  craftScroll: 0,
  msg: '', msgT: 0,
};

function heldItem() { return uiState.cursor ? null : inv[uiState.hotbar]; }

function invAdd(id, n) {
  const def = ITEMS[id];
  if (!def) return n;
  let left = n;
  // докладываем в существующие стаки
  for (let i = 0; i < inv.length && left > 0; i++) {
    const s = inv[i];
    if (s && s.id === id && s.n < def.max) {
      const add = Math.min(def.max - s.n, left);
      s.n += add; left -= add;
    }
  }
  // новые слоты (сначала хотбар)
  for (let i = 0; i < inv.length && left > 0; i++) {
    if (!inv[i]) {
      const add = Math.min(def.max, left);
      inv[i] = { id, n: add }; left -= add;
    }
  }
  if (def.kind === 'coin') normalizeCoins();
  if (left < n) { onTutorial('item:' + id); touchDirty(); }
  return left;
}
function invCount(id) {
  let c = 0;
  for (const s of inv) if (s && s.id === id) c += s.n;
  return c;
}
function invHas(id, n) { return invCount(id) >= n; }
function invTake(id, n) {
  touchDirty();
  let need = n;
  for (let i = 0; i < inv.length && need > 0; i++) {
    const s = inv[i];
    if (s && s.id === id) {
      const take = Math.min(s.n, need);
      s.n -= take; need -= take;
      if (s.n <= 0) inv[i] = null;
    }
  }
  return need === 0;
}
function invConsume(slot, n) {
  const i = inv.indexOf(slot);
  if (i < 0) return;
  touchDirty();
  slot.n -= n;
  if (slot.n <= 0) inv[i] = null;
}

// ── монеты ──
function coinTotal() { return invCount(50) + invCount(51) * 100 + invCount(52) * 10000; }
function coinAdd(amount) {
  let g = Math.floor(amount / 10000), s = Math.floor((amount % 10000) / 100), c = amount % 100;
  let rest = 0;
  if (g) rest += invAdd(52, g) * 10000;
  if (s) rest += invAdd(51, s) * 100;
  if (c) rest += invAdd(50, c);
  if (rest > 0) dropCoins(P.x, P.y - 1, rest);
}
function coinRemove(amount) {
  if (coinTotal() < amount) return false;
  const total = coinTotal() - amount;
  invTake(50, invCount(50)); invTake(51, invCount(51)); invTake(52, invCount(52));
  if (total > 0) coinAdd(total);
  return true;
}
let _normBusy = false;
function normalizeCoins() {
  if (_normBusy) return;
  _normBusy = true;
  while (invCount(50) >= 100) { invTake(50, 100); if (invAdd(51, 1)) { invAdd(50, 100); break; } }
  while (invCount(51) >= 100) { invTake(51, 100); if (invAdd(52, 1)) { invAdd(51, 100); break; } }
  _normBusy = false;
}

// ── крафт ──
function stationNear(st) {
  if (st === STATION_NONE) return true;
  const want = st === STATION_BENCH ? T_BENCH : st === STATION_FURNACE ? T_FURNACE : T_ANVIL;
  const px = Math.floor(P.x), py = Math.floor(P.y);
  for (let y = py - 6; y <= py + 6; y++)
    for (let x = px - 7; x <= px + 7; x++)
      if (gT(x, y) === want) return true;
  return false;
}
function canCraft(r) {
  if (!stationNear(r.st)) return false;
  for (const [id, n] of r.ins) if (!invHas(id, n)) return false;
  return true;
}
function craftList() { // рецепты, у которых есть хоть один ингредиент — для меню
  const out = [];
  for (const r of RECIPES) {
    let any = false;
    for (const [id] of r.ins) if (invCount(id) > 0) { any = true; break; }
    if (any || canCraft(r)) out.push(r);
  }
  return out;
}
function doCraft(r) {
  if (!canCraft(r)) return false;
  for (const [id, n] of r.ins) invTake(id, n);
  const left = invAdd(r.out, r.n);
  if (left > 0) spawnDrop(P.x, P.y - 1, r.out, left);
  refreshScoreCraft(r.out); // вехи — только за реальный крафт
  sfx('craft');
  onTutorial('craft:' + r.out);
  return true;
}

// счёт за первые крафты-вехи
const craftMilestones = { 13: 20, 60: 20, 14: 30, 15: 40, 61: 25, 62: 30, 63: 35, 64: 40 };
const seenMilestones = {};
function refreshScoreCraft(id) {
  if (craftMilestones[id] && !seenMilestones[id]) { seenMilestones[id] = 1; addScore(craftMilestones[id]); }
}

// ── сундук / магазин ──
function chestSlots() { return uiState.chest != null ? chests.get(uiState.chest) : null; }

function shopBuy(i) {
  const [id, n, price] = SHOP[i];
  if (coinTotal() < price) { showMsg('Не хватает монет'); return; }
  coinRemove(price);
  const left = invAdd(id, n);
  if (left > 0) spawnDrop(P.x, P.y - 1, id, left);
  sfx('coin');
}
function sellValue(id) {
  const d = ITEMS[id];
  if (!d || d.kind === 'coin') return 0;
  // грубая ценность: руды/слитки/материалы дороже
  const base = { mat: 8, block: 1, tool: 40, sword: 40, bow: 45, wand: 80, armor: 50, use: 15, ammo: 1, summon: 60, wall: 1 };
  let v = base[d.kind] || 1;
  if (id >= 26 && id <= 29) v = 12 + (id - 26) * 10;
  if (id >= 22 && id <= 25) v = 4 + (id - 22) * 4;
  return v;
}
function shopSell(slotIdx) {

/* Рендер: текстуры тайлов (процедурные), небо, мир, сущности, свет, частицы. */

const cam = { x: 600, y: 100, z: 36, shake: 0 };
let shakeT = 0;
function shake(t) { shakeT = Math.max(shakeT, t); }

// ── время суток ──
const DAY_LEN = 300; // секунд на цикл
function dayFrac() { return (world.time % DAY_LEN) / DAY_LEN; }
function isNight() { const f = dayFrac(); return f > 0.55 && f < 0.97; }
function dayLight01(f) {
  // 0.0 рассвет → 0.05 день … 0.5 закат → 0.58 ночь … 0.97 рассвет
  if (f < 0.05) return f / 0.05;
  if (f < 0.5) return 1;
  if (f < 0.6) return 1 - (f - 0.5) / 0.1;
  if (f < 0.94) return 0;
  return (f - 0.94) / 0.06 * 0.6; // предрассветные сумерки
}

// ── текстуры тайлов: 4 варианта 16×16 на тип ──
const texCache = {};
function tileTex(t) {

    for (let i = 0; i < 46; i++) {

      const l = rng();
      c.fillStyle = l < 0.5 ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.10)';
      c.fillRect(ox + x, y, 1 + (rng() < 0.4 ? 1 : 0), 1);

    // светлый верхний кант + тёмный нижний

    if (t === T_DOORO) {

    }

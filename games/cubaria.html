const WALL_COLORS = { 1: '#3a2a1c', 2: '#26262e', 3: '#4a3520' };

// ── небо ──
function skyColors(f) {
  const d = dayLight01(f);
  // базовые: день/ночь
  let top = hexLerp('#0a0e26', '#3e86d4', d);
  let bot = hexLerp('#141b3a', '#a5cbe4', d);
  // тёплый градиент на рассвете/закате
  const dusk = Math.max(0, 1 - Math.abs(f - 0.53) / 0.06) + Math.max(0, 1 - Math.abs(f - 0.985) / 0.05);
  if (dusk > 0) bot = hexLerp(bot.startsWith('#') ? bot : '#a5cbe4', '#e8824a', Math.min(1, dusk) * 0.8);
  return [top, bot];
}

function render() {
  const cw = cv.width, ch = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const f = dayFrac();
  const Z = cam.z;
  // камера в пикселях мира
  let camPX = cam.x * Z - cw / 2, camPY = cam.y * Z - ch / 2;
  camPX = clamp(camPX, 0, WORLD_W * Z - cw);
  camPY = clamp(camPY, -ch * 0.4, WORLD_H * Z - ch);
  if (shakeT > 0) {
    camPX += (Math.random() - 0.5) * shakeT * 22;
    camPY += (Math.random() - 0.5) * shakeT * 22;
  }
  cam.camPX = camPX; cam.camPY = camPY; // для маппинга мыши в мир
  const x0 = Math.max(0, Math.floor(camPX / Z)), y0 = Math.max(0, Math.floor(camPY / Z));
  const x1 = Math.min(WORLD_W - 1, Math.ceil((camPX + cw) / Z)), y1 = Math.min(WORLD_H - 1, Math.ceil((camPY + ch) / Z));

  drawSky(f, cw, ch, camPX, camPY, Z);

  // пересчёт света (не каждый кадр)
  world.lightT -= world.dt;
  if (lightDirty || world.lightT <= 0) {
    world.lightT = 0.12;
    computeLight(x0, y0, x1 - x0 + 1, y1 - y0 + 1, f);
  }

  const wx = (x) => Math.round(x * Z - camPX);
  const wy = (y) => Math.round(y * Z - camPY);

  // фоновые стены
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const w = W[x + y * WORLD_W];
      if (!w) continue;
      const t = T[x + y * WORLD_W];
      if (isSolid(t)) continue; // за блоком не видно
      ctx.fillStyle = WALL_COLORS[w] || '#333';
      ctx.fillRect(wx(x), wy(y), Z + 1, Z + 1);
    }

  // тайлы
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const t = T[x + y * WORLD_W];
      if (t === T_AIR) continue;
      const sx = ((x * 7 + y * 13) & 3) * 16;
      const spr = spriteTile(t);
      if (spr) ctx.drawImage(spr, wx(x), wy(y), Z, Z);
      else ctx.drawImage(tileTex(t), sx, 0, 16, 16, wx(x), wy(y), Z, Z);
      // трещины
      const rec = dmgMap.get(x + y * WORLD_W);
      if (rec) {
        const td = TILES[t];
        const frac = 1 - rec.hp / td.hp;
        ctx.strokeStyle = 'rgba(0,0,0,' + (0.25 + frac * 0.5) + ')';
        ctx.lineWidth = Math.max(1, Z / 16);
        ctx.beginPath();
        const cx = wx(x) + Z / 2, cy2 = wy(y) + Z / 2;
        for (let i = 0; i < Math.ceil(frac * 5); i++) {
          const a = i * 2.2 + x * 3 + y;
          ctx.moveTo(cx, cy2);
          ctx.lineTo(cx + Math.cos(a) * Z * 0.45, cy2 + Math.sin(a) * Z * 0.45);
        }
        ctx.stroke();
      }
    }

  drawEntities(Z, camPX, camPY);
  drawPlayer(Z, camPX, camPY);

  // жидкости поверх сущностей (полупрозрачные)
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const v = LQ[x + y * WORLD_W];
      const lvl = lqLevel(v);
      if (!lvl) continue;
      const lava = lqIsLava(v);
      const hFrac = lvl / 8;
      const above = lqLevel(gLQ(x, y - 1)) > 0;
      let topY = wy(y) + (above ? 0 : Math.round(Z * (1 - hFrac)));
      if (!above && !lava) topY += Math.round(Math.sin(world.time * 3 + x * 0.9) * Z * 0.04);
      ctx.fillStyle = lava ? 'rgba(255,92,20,0.92)' : 'rgba(50,110,215,0.55)';
      ctx.fillRect(wx(x), topY, Z + 1, wy(y) + Z - topY + 1);
      if (lava) {
        ctx.fillStyle = 'rgba(255,220,80,0.5)';
        if (!above) ctx.fillRect(wx(x), topY, Z + 1, Math.max(1, Z * 0.08));
      }
    }

  drawParticles(Z, camPX, camPY);

  // ── свет: маленький канвас растягиваем со сглаживанием ──
  drawLight(x0, y0, x1, y1, Z, camPX, camPY, cw, ch);

  // подсветка тайла под курсором
  if (!uiState.open && state === 'play') {
    const [mx, my] = mouseTile();
    if (inW(mx, my)) {
      ctx.strokeStyle = reachOk(mx, my) ? 'rgba(255,255,255,0.7)' : 'rgba(255,120,120,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(wx(mx) + 1, wy(my) + 1, Z - 2, Z - 2);
    }
  }

  drawHud();
  if (uiState.open) drawInventoryUI();
  drawOverlays();
}

let lightCv = null, lightImg = null;
function drawLight(x0, y0, x1, y1, Z, camPX, camPY, cw, ch) {
  const lw = x1 - x0 + 1, lh = y1 - y0 + 1;
  if (!lightCv) { lightCv = document.createElement('canvas'); }
  if (lightCv.width !== lw || lightCv.height !== lh) { lightCv.width = lw; lightCv.height = lh; lightImg = null; }
  const lc = lightCv.getContext('2d');
  if (!lightImg || lightImg.width !== lw) lightImg = lc.createImageData(lw, lh);
  const data = lightImg.data;
  for (let y = 0; y < lh; y++)
    for (let x = 0; x < lw; x++) {
      const l = lightAt(x0 + x, y0 + y) / 15;
      const i = (x + y * lw) * 4;
      data[i] = 6; data[i + 1] = 5; data[i + 2] = 12;
      data[i + 3] = Math.round((1 - Math.min(1, l * 1.12)) * 255);
    }
  lc.putImageData(lightImg, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lightCv, x0 * Z - camPX, y0 * Z - camPY, lw * Z, lh * Z);
  ctx.imageSmoothingEnabled = false;
}

function drawSky(f, cw, ch, camPX, camPY, Z) {
  const [top, bot] = skyColors(f);
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);
  const d = dayLight01(f);
  // солнце/луна
  const arc = f < 0.55 ? f / 0.55 : (f - 0.55) / 0.45;
  const sx = cw * arc, sy = ch * 0.55 - Math.sin(arc * Math.PI) * ch * 0.42;
  if (f < 0.55) {
    ctx.fillStyle = '#ffe89a';
    ctx.beginPath(); ctx.arc(sx, sy, 26, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,232,154,0.25)';
    ctx.beginPath(); ctx.arc(sx, sy, 40, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#e8ecf4';
    ctx.beginPath(); ctx.arc(sx, sy, 20, 0, 7); ctx.fill();
    ctx.fillStyle = top;
    ctx.beginPath(); ctx.arc(sx + 8, sy - 4, 17, 0, 7); ctx.fill();
  }
  // звёзды ночью
  if (d < 0.5) {
    const rngS = mulberry32(777);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.8 - d) + ')';
    for (let i = 0; i < 90; i++) {
      const x = rngS() * cw, y = rngS() * ch * 0.7;
      const tw = Math.sin(world.time * (1 + rngS() * 2) + i) > 0.3 ? 2 : 1;
      ctx.fillRect(x, y, tw, tw);
    }
  }
  // облака днём
  if (d > 0.2) {
    ctx.fillStyle = 'rgba(255,255,255,' + 0.5 * d + ')';
    const rngC = mulberry32(1234);
    for (let i = 0; i < 9; i++) {
      const spd = 6 + rngC() * 10, baseX = rngC() * 3000, y = 30 + rngC() * ch * 0.3;
      const x = ((baseX + world.time * spd - camPX * 0.25) % (cw + 300)) - 150;
      const s = 0.7 + rngC() * 0.9;
      ctx.beginPath();
      ctx.ellipse(x, y, 55 * s, 16 * s, 0, 0, 7);
      ctx.ellipse(x + 30 * s, y - 8 * s, 34 * s, 13 * s, 0, 0, 7);
      ctx.ellipse(x - 34 * s, y - 4 * s, 28 * s, 11 * s, 0, 0, 7);
      ctx.fill();
    }
  }
  // фон подземелья: затемняем область ниже поверхности
  const surfPy = (surf[clamp(Math.floor(cam.x), 0, WORLD_W - 1)] + 6) * Z - camPY;
  if (surfPy < ch) {
    const gg = ctx.createLinearGradient(0, surfPy - 60, 0, surfPy + 200);
    gg.addColorStop(0, 'rgba(20,16,12,0)');
    gg.addColorStop(1, '#171310');
    ctx.fillStyle = gg;
    ctx.fillRect(0, Math.max(0, surfPy - 60), cw, ch);
  }
}

function drawParticles(Z, camPX, camPY) {
  for (const q of parts) {
    ctx.globalAlpha = Math.max(0, 1 - q.t / q.life);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x * Z - camPX, q.y * Z - camPY, q.sz, q.sz);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold ' + Math.max(13, Z * 0.42) + 'px monospace';
  ctx.textAlign = 'center';
  for (const q of dmgTexts) {
    ctx.globalAlpha = Math.max(0, 1 - q.t / 0.9);
    ctx.fillStyle = '#1a1208';
    ctx.fillText(q.v, q.x * Z - camPX + 1, q.y * Z - camPY + 1);
    ctx.fillStyle = q.color;
    ctx.fillText(q.v, q.x * Z - camPX, q.y * Z - camPY);
  }
  ctx.globalAlpha = 1;
}

/* ══════ 11-draw-entities.js ══════ */
/* Отрисовка сущностей, игрока и иконок предметов (вектор-фолбэки + спрайты ASSETS). */

const imgCache = {};
function getImg(key) {
  const src = ASSETS[key];
  if (!src) return null;
  let im = imgCache[key];
  if (!im) { im = new Image(); im.src = src; imgCache[key] = im; }
  return im.complete && im.naturalWidth ? im : null;
}
function getAnim(key) { // ASSETS.key = [url,url,...] или url
  const v = ASSETS[key];
  if (!v) return null;
  const arr = Array.isArray(v) ? v : [v];
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    const k = key + '#' + i;
    let im = imgCache[k];
    if (!im) { im = new Image(); im.src = arr[i]; imgCache[k] = im; }
    if (im.complete && im.naturalWidth) out.push(im);
  }
  return out.length ? out : null;
}
function spriteTile() { return null; } // тайлы всегда процедурные

// Доля высоты кадра до САМОГО НИЖНЕГО непрозрачного пикселя анимации (низ «опорной ноги»).
// Кадры героя пакуются единым union-bbox на 4 анимации, поэтому в беге/ударе/прыжке
// персонаж стоит выше в кадре — привязываем к его собственному низу, а не к низу кадра.
// Высота ТЕЛА персонажа (голова→ноги) в пикселях кадра. Анимации героя рисованы
// в разном масштабе (idle/run ~73px, кастомная swing ~51px), а раньше масштаб
// брался по высоте КАДРА → в бою/копании персонаж выглядел мельче. Меряем самый
// длинный вертикальный «широкий» прогон (тело), продлённый до ног — рукоять/тень
// кирки (тонкие/короткие) не в счёт.
const bodyCache = {};
function animBodyH(key) {
  if (key in bodyCache) return bodyCache[key];
  const frames = getAnim(key);
  if (!frames) return 0;
  let maxBody = 0;
  try {
    for (const im of frames) {
      const w = im.naturalWidth, h = im.naturalHeight;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, w, h).data;
      const THR = Math.max(10, w * 0.18);
      const wide = new Array(h); let bot = -1;
      for (let y = 0; y < h; y++) {
        let mn = w, mx = -1;
        for (let x = 0; x < w; x++) if (d[(x + y * w) * 4 + 3] > 40) { if (x < mn) mn = x; if (x > mx) mx = x; }
        wide[y] = mx >= 0 && (mx - mn + 1) >= THR;
        if (mx >= 0) bot = y;
      }
      let bestTop = -1, bestLen = 0, curTop = -1, curLen = 0;
      for (let y = 0; y < h; y++) {
        if (wide[y]) { if (curTop < 0) curTop = y; curLen++; if (curLen > bestLen) { bestLen = curLen; bestTop = curTop; } }
        else { curTop = -1; curLen = 0; }
      }
      if (bestTop >= 0) maxBody = Math.max(maxBody, bot - bestTop + 1);
    }
  } catch (e) { return 0; }
  if (frames.length && maxBody) bodyCache[key] = maxBody;
  return maxBody;
}

const footCache = {};
function animFootFrac(key) {
  if (key in footCache) return footCache[key];
  const frames = getAnim(key);
  if (!frames) return 1;
  let maxB = 0;
  try {
    for (const im of frames) {
      const w = im.naturalWidth, h = im.naturalHeight;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, w, h).data;
      let low = h;
      for (let y = h - 1; y >= 0; y--) {
        let has = false;
        for (let x = 0; x < w; x++) if (d[(x + y * w) * 4 + 3] > 30) { has = true; break; }
        if (has) { low = y + 1; break; }
      }
      maxB = Math.max(maxB, low / h);
    }
  } catch (e) { return 1; }
  if (frames.length) footCache[key] = maxB;   // кэшируем только когда кадры реально загрузились
  return maxB || 1;
}

// Предзагрузка всех ASSETS при старте (иначе спрайты «выпрыгивают» после первого кадра)
function preloadAssets() {
  const waits = [];
  for (const key in ASSETS) {
    const arr = Array.isArray(ASSETS[key]) ? ASSETS[key] : [ASSETS[key]];
    for (let i = 0; i < arr.length; i++) {
      const k = Array.isArray(ASSETS[key]) ? key + '#' + i : key;
      if (!imgCache[k]) { const im = new Image(); im.src = arr[i]; imgCache[k] = im; }
      const im = imgCache[k];
      if (!im.complete) waits.push(new Promise((res) => { im.onload = res; im.onerror = res; }));
    }
  }
  return Promise.race([Promise.all(waits), new Promise((res) => setTimeout(res, 3000))]);
}

// материал → цвет
const MATC = { wood: '#9a6b3d', cu: '#d08050', fe: '#c0c4cc', ag: '#eef2f8', au: '#ffd23e' };

function drawEntities(Z, cx, cy) {
  const t = world.time;
  cxCache = cx; cyCache = cy;
  // дропы
  for (const d of drops) {
    const bob = Math.sin(t * 4 + d.x) * 2;
    drawItemIcon(d.id, d.x * Z - cx - Z * 0.28, d.y * Z - cy - Z * 0.55 + bob, Z * 0.56);
  }
  // NPC
  for (const n of npcs) drawHumanoid(n, Z, cx, cy, '#4a6a9a', '#e8c8a0', '#7a5230', 'npc_merchant');
  // враги
  for (const f of foes) {
    if (f.dead) continue;
    const px = f.x * Z - cx, py = f.y * Z - cy;
    const anim = getAnim('foe_' + f.type);
    if (anim) {
      const fr = anim[Math.floor(t * 8) % anim.length];
      let w = f.w * Z * 1.25, h = f.h * Z * 1.15;
      let oy = 0;
      if (f.ai === 'hop') { const sq = 1 + (f.squash || 0); w *= sq; h /= sq; } // сквош прыжка
      if (f.ai === 'fly' || f.ai === 'bat' || f.ai === 'caster') oy = Math.sin(t * 6 + f.t) * Z * 0.08;
      ctx.save();
      ctx.translate(px, py + oy);
      if (f.dir < 0) ctx.scale(-1, 1);
      ctx.drawImage(fr, -w / 2, -h, w, h);
      if (f.onFire) { // тлеющий оранжевый оверлей по силуэту
        ctx.globalCompositeOperation = 'source-atop';
        ctx.globalAlpha = 0.3 + Math.random() * 0.25;
        ctx.fillStyle = '#ff7020';
        ctx.fillRect(-w / 2, -h, w, h);
      }
      ctx.restore();
      continue;
    }
    drawFoeVector(f, px, py, Z);
  }
  drawProjs(Z, cx, cy);
}

function drawFoeVector(f, px, py, Z) {
  const w = f.w * Z, h = f.h * Z;
  ctx.save();
  ctx.translate(px, py);
  if (f.ai === 'hop') { // слизень: полупрозрачный блоб со сквошем
    const sq = 1 + (f.squash || 0) * 1.2;
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.ellipse(0, -h / 2 / sq, w / 2 * sq, h / 2 / sq, 0, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(f.dir * w * 0.12 - 2, -h * 0.62, 3, 3);
    ctx.fillRect(f.dir * w * 0.3 - 2, -h * 0.62, 3, 3);
  } else if (f.ai === 'fly') { // глаз
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath(); ctx.ellipse(0, -h / 2, w / 2, h / 2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#c03838';
    ctx.beginPath(); ctx.arc(f.dir * w * 0.2, -h / 2, h * 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(f.dir * w * 0.26, -h / 2, h * 0.14, 0, 7); ctx.fill();
    // хвостик
    ctx.strokeStyle = '#c05858'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-f.dir * w * 0.4, -h / 2);
    ctx.quadraticCurveTo(-f.dir * w * 0.8, -h / 2 + Math.sin(world.time * 9) * 6, -f.dir * w * 0.9, -h * 0.3);
    ctx.stroke();
  } else if (f.ai === 'bat') {
    ctx.fillStyle = f.color;
    const flap = Math.sin(world.time * 14 + f.t) * h * 0.5;
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(-w * 0.75, -h / 2 - flap); ctx.lineTo(-w * 0.3, -h * 0.3);
    ctx.lineTo(0, -h * 0.15); ctx.lineTo(w * 0.3, -h * 0.3);
    ctx.lineTo(w * 0.75, -h / 2 - flap); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8d048'; ctx.fillRect(-2, -h * 0.62, 2, 2); ctx.fillRect(2, -h * 0.62, 2, 2);
  } else if (f.ai === 'worm') {
    ctx.restore();
    const headImg = getImg('worm_head');
    for (let s = f.segs - 1; s >= 0; s--) {
      const p = f.trail[Math.min(f.trail.length - 1, s * 6)] || [f.x, f.y];
      const r = (s === 0 ? 0.42 : 0.34) * Z;
      if (s === 0 && headImg) {
        const a = Math.atan2(f.vy, f.vx);
        ctx.save();
        ctx.translate(p[0] * Z - cxCache, p[1] * Z - cyCache);
        ctx.rotate(a + Math.PI); // спрайт смотрит влево
        ctx.drawImage(headImg, -r * 1.4, -r * 1.4, r * 2.8, r * 2.8);
        ctx.restore();
        continue;
      }
      ctx.fillStyle = s === 0 ? '#c07a5a' : f.color;
      ctx.beginPath(); ctx.arc(p[0] * Z - cxCache, p[1] * Z - cyCache, r, 0, 7); ctx.fill();
      if (s === 0) { ctx.fillStyle = '#3a1a12'; ctx.beginPath(); ctx.arc(p[0] * Z - cxCache, p[1] * Z - cyCache, r * 0.4, 0, 7); ctx.fill(); }
    }
    return;
  } else if (f.boss) {
    drawBossVector(f, w, h, Z);
  } else if (f.ai === 'caster') { // демон
    ctx.fillStyle = f.color;
    ctx.fillRect(-w * 0.3, -h, w * 0.6, h * 0.85);
    const flap = Math.sin(world.time * 8) * h * 0.24;
    ctx.beginPath();
    ctx.moveTo(-w * 0.3, -h * 0.8); ctx.lineTo(-w * 0.85, -h * 0.9 - flap); ctx.lineTo(-w * 0.35, -h * 0.5);
    ctx.moveTo(w * 0.3, -h * 0.8); ctx.lineTo(w * 0.85, -h * 0.9 - flap); ctx.lineTo(w * 0.35, -h * 0.5);
    ctx.fill();
    ctx.fillStyle = '#ffd23e';
    ctx.fillRect(f.dir * w * 0.1 - 2, -h * 0.85, 3, 3); ctx.fillRect(f.dir * w * 0.24 - 2, -h * 0.85, 3, 3);
    // рога
    ctx.fillStyle = '#3a2a30';
    ctx.fillRect(-w * 0.24, -h * 1.08, 3, h * 0.12); ctx.fillRect(w * 0.18, -h * 1.08, 3, h * 0.12);
  } else { // ходоки: зомби/скелет
    const legs = Math.sin(world.time * 9 + f.t) * 0.2;
    ctx.fillStyle = f.color;
    ctx.fillRect(-w * 0.35, -h, w * 0.7, h * 0.5);           // торс+голова
    ctx.fillRect(-w * 0.35 + legs * w, -h * 0.5, w * 0.3, h * 0.5); // ноги
    ctx.fillRect(w * 0.05 - legs * w, -h * 0.5, w * 0.3, h * 0.5);
    ctx.fillStyle = f.type === 'skeleton' ? '#2a2a2a' : '#c8d858';
    ctx.fillRect(f.dir * w * 0.08, -h * 0.88, 3, 3); ctx.fillRect(f.dir * w * 0.24, -h * 0.88, 3, 3);
  }
  ctx.restore();
  // полоска HP над врагом
  if (f.hp < f.hpMax && !f.boss) {
    const bw = Math.max(20, w);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(px - bw / 2, py - h - 8, bw, 4);
    ctx.fillStyle = '#e04848';
    ctx.fillRect(px - bw / 2, py - h - 8, bw * (f.hp / f.hpMax), 4);
  }
}
let cxCache = 0, cyCache = 0; // для червя (рисуется в мировых координатах)

function drawBossVector(f, w, h, Z) {
  const t = world.time;
  if (f.kind === 'eye') {
    ctx.fillStyle = '#e8e0e0';
    ctx.beginPath(); ctx.ellipse(0, -h / 2, w / 2, h / 2, Math.sin(t * 2) * 0.1, 0, 7); ctx.fill();
    // прожилки
    ctx.strokeStyle = '#c05858'; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(-f.dir * w * 0.4, -h / 2 + (i - 2) * h * 0.14);
      ctx.quadraticCurveTo(0, -h / 2 + (i - 2) * h * 0.2, f.dir * w * 0.2, -h / 2 + (i - 2) * h * 0.08);
      ctx.stroke();
    }
    ctx.fillStyle = f.phase === 2 ? '#701818' : '#a03030';
    ctx.beginPath(); ctx.arc(f.dir * w * 0.18, -h / 2, h * 0.28, 0, 7); ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.arc(f.dir * w * 0.24, -h / 2, h * 0.13, 0, 7); ctx.fill();
  } else if (f.kind === 'golem') {
    ctx.fillStyle = '#cfc6b4';
    ctx.fillRect(-w * 0.45, -h, w * 0.9, h * 0.55);
    ctx.fillRect(-w * 0.5, -h * 0.5, w * 0.28, h * 0.5);
    ctx.fillRect(w * 0.22, -h * 0.5, w * 0.28, h * 0.5);
    ctx.fillStyle = '#8a8274';
    ctx.fillRect(-w * 0.34, -h * 0.94, w * 0.68, h * 0.1);
    ctx.fillStyle = '#301818';
    ctx.fillRect(f.dir * w * 0.06, -h * 0.86, 5, 6); ctx.fillRect(f.dir * w * 0.26, -h * 0.86, 5, 6);
    // рёбра
    ctx.strokeStyle = '#a89e8c'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-w * 0.3, -h * (0.72 - i * 0.1)); ctx.lineTo(w * 0.3, -h * (0.72 - i * 0.1)); ctx.stroke(); }
  } else { // демон-владыка
    ctx.fillStyle = '#701c30';
    ctx.fillRect(-w * 0.32, -h, w * 0.64, h * 0.9);
    const flap = Math.sin(t * 6) * h * 0.3;
    ctx.fillStyle = '#4a1220';
    ctx.beginPath();
    ctx.moveTo(-w * 0.3, -h * 0.8); ctx.lineTo(-w * 1.05, -h * 0.95 - flap); ctx.lineTo(-w * 0.36, -h * 0.4);
    ctx.moveTo(w * 0.3, -h * 0.8); ctx.lineTo(w * 1.05, -h * 0.95 - flap); ctx.lineTo(w * 0.36, -h * 0.4);
    ctx.fill();
    ctx.fillStyle = '#ffb03e';
    ctx.fillRect(f.dir * w * 0.06 - 3, -h * 0.88, 6, 4); ctx.fillRect(f.dir * w * 0.22 - 3, -h * 0.88, 6, 4);
    ctx.fillStyle = '#1a0a10';
    ctx.fillRect(-w * 0.3, -h * 1.14, 5, h * 0.16); ctx.fillRect(w * 0.24, -h * 1.14, 5, h * 0.16);
  }
}

function drawHumanoid(n, Z, cx, cy, shirt, skin, hair, assetKey) {
  const px = n.x * Z - cx, py = n.y * Z - cy;
  const anim = getAnim(assetKey + (Math.abs(n.vx) > 0.4 ? '_run' : '_idle')) || getAnim(assetKey);
  if (anim) {
    const fr = anim[Math.floor(world.time * 8) % anim.length];
    const h = 1.95 * Z, w = h * (fr.width / fr.height);
    ctx.save(); ctx.translate(px, py);
    if (n.dir < 0) ctx.scale(-1, 1);
    ctx.drawImage(fr, -w / 2, -h, w, h);
    ctx.restore();
    return;
  }
  const w = n.w * Z, h = n.h * Z;
  ctx.save(); ctx.translate(px, py);
  const legs = Math.abs(n.vx) > 0.3 ? Math.sin(world.time * 10) * 0.16 : 0;
  ctx.fillStyle = '#3a3a4a';
  ctx.fillRect(-w * 0.3 + legs * w, -h * 0.42, w * 0.26, h * 0.42);
  ctx.fillRect(w * 0.04 - legs * w, -h * 0.42, w * 0.26, h * 0.42);
  ctx.fillStyle = shirt;
  ctx.fillRect(-w * 0.34, -h * 0.78, w * 0.68, h * 0.38);
  ctx.fillStyle = skin;
  ctx.fillRect(-w * 0.28, -h, w * 0.56, h * 0.24);
  ctx.fillStyle = hair;
  ctx.fillRect(-w * 0.3, -h * 1.02, w * 0.6, h * 0.08);
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(n.dir * w * 0.1, -h * 0.92, 2, 3);
  ctx.restore();
}

function drawPlayer(Z, cx, cy) {
  if (P.dead) return;
  if (P.inv > 0 && Math.floor(world.time * 14) % 2 === 0) return; // мигание i-frames
  const px = P.x * Z - cx, py = P.y * Z - cy;
  const held = heldItem();
  const swing = P.swingT > 0 ? 1 - P.swingT / P.swingDur : -1;

  // спрайты героя
  let key = 'hero_idle';
  if (swing >= 0) key = 'hero_swing';
  else if (!P.onGround && !P.inWater) key = 'hero_jump';
  else if (Math.abs(P.vx) > 0.6) key = 'hero_run';
  const anim = getAnim(key);
  ctx.save();
  ctx.translate(px, py);
  if (P.dir < 0) ctx.scale(-1, 1);
  if (anim) {
    let fi;
    if (swing >= 0) fi = Math.min(anim.length - 1, Math.floor(swing * anim.length));
    else if (key === 'hero_jump') fi = Math.min(anim.length - 1, P.vy < 0 ? 1 : anim.length - 2);
    else fi = Math.floor(world.time * (key === 'hero_run' ? 12 : 7)) % anim.length;
    const fr = anim[fi];
    // масштаб — по высоте ТЕЛА (эталон idle), чтобы персонаж был одного размера
    // во всех анимациях; кадр всё равно масштабируется целиком (без искажений)
    const refBody = animBodyH('hero_idle') || animBodyH(key) || 1;
    const myBody = animBodyH(key) || refBody;
    const h = 2.1 * Z * (refBody / myBody), w = h * (fr.width / fr.height);
    // низ опорной ноги анимации кладём на ноги игрока (иначе бег/удар/прыжок «всплывают»)
    const foot = animFootFrac(key);
    ctx.drawImage(fr, -w / 2, -foot * h + Z * 0.08, w, h);
  } else {
    const w = P.w * Z, h = P.h * Z;
    const legs = Math.abs(P.vx) > 0.5 && P.onGround ? Math.sin(world.time * 12) * 0.18 : 0;
    ctx.fillStyle = '#31456e'; // штаны
    ctx.fillRect(-w * 0.32 + legs * w, -h * 0.44, w * 0.28, h * 0.44);
    ctx.fillRect(w * 0.04 - legs * w, -h * 0.44, w * 0.28, h * 0.44);
    ctx.fillStyle = equip[1] ? MATC.fe : '#b3402e'; // торс/нагрудник
    ctx.fillRect(-w * 0.36, -h * 0.8, w * 0.72, h * 0.4);
    ctx.fillStyle = '#e8bc93'; // голова
    ctx.fillRect(-w * 0.3, -h * 1.02, w * 0.6, h * 0.26);
    ctx.fillStyle = equip[0] ? MATC.au : '#6a4a2a'; // волосы/шлем
    ctx.fillRect(-w * 0.32, -h * 1.06, w * 0.64, h * 0.1);
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(w * 0.1, -h * 0.94, 2, 3);
  }
  // предмет в руке. Спрайт-анимация замаха УЖЕ рисует кирку в руках героя,
  // поэтому поверх неё иконку инструмента не дублируем.
  const heldKind = held ? ITEMS[held.id].kind : null;
  const animHasTool = !!anim && key === 'hero_swing' && heldKind === 'tool';
  if (held && swing >= 0 && !animHasTool) {
    const a = -2.2 + swing * 2.9; // от -126° к +40°
    ctx.save();
    ctx.translate(0, -P.h * Z * 0.62);
    ctx.rotate(a);
    drawItemIcon(held.id, Z * 0.2, -Z * 0.9, Z * 0.9, true);
    ctx.restore();
  } else if (held && (heldKind === 'bow' || heldKind === 'wand')) {
    drawItemIcon(held.id, Z * 0.1, -P.h * Z * 0.75, Z * 0.7, true);
  }
  ctx.restore();
}

// ── иконки предметов ──
function drawItemIcon(id, x, y, s, noBg) {
  const im = getImg('icon_' + id);
  if (im) { ctx.drawImage(im, x, y, s, s); return; }
  const d = ITEMS[id];
  if (!d) return;
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2);
  const u = s / 16; // юниты
  const mat = id === 60 || id === 65 || id === 70 || id === 76 ? 'wood'
    : id === 61 || id === 66 || id === 71 || id === 81 || id === 82 || id === 83 ? 'cu'
    : id === 62 || id === 67 || id === 72 || id === 77 || id === 84 || id === 85 || id === 86 ? 'fe'
    : id === 63 || id === 73 || id === 87 || id === 88 || id === 89 ? 'ag'
    : 'au';
  const mc = MATC[mat];
  const k = d.kind;
  if (k === 'block') {
    const tex = tileTex(d.tile);
    ctx.drawImage(tex, 0, 0, 16, 16, -s * 0.38, -s * 0.38, s * 0.76, s * 0.76);
  } else if (k === 'wall') {
    ctx.fillStyle = WALL_COLORS[d.wall];
    ctx.fillRect(-s * 0.35, -s * 0.35, s * 0.7, s * 0.7);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(-s * 0.35, -s * 0.35, s * 0.7, s * 0.7);
  } else if (k === 'tool' && d.tool === 'pick') {
    // ручка по диагонали + двустороннее остриё головки (чтобы не читалось как стрелка)
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.4 * u;
    ctx.beginPath(); ctx.moveTo(-3 * u, 7 * u); ctx.lineTo(2 * u, -4 * u); ctx.stroke();
    ctx.fillStyle = mc;
    ctx.beginPath();
    ctx.moveTo(-7 * u, -2 * u);            // левое остриё
    ctx.quadraticCurveTo(-1 * u, -7.5 * u, 7 * u, -5 * u);  // верхняя кромка
    ctx.lineTo(6 * u, -3 * u);             // правое остриё (короче)
    ctx.quadraticCurveTo(-1 * u, -5.5 * u, -6 * u, -0.5 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-3 * u, -6 * u, 5 * u, u);
  } else if (k === 'tool' && d.tool === 'axe') {
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.4 * u;
    ctx.beginPath(); ctx.moveTo(-2 * u, 7 * u); ctx.lineTo(3 * u, -5 * u); ctx.stroke();
    ctx.fillStyle = mc;
    ctx.beginPath(); ctx.moveTo(1 * u, -7 * u); ctx.quadraticCurveTo(-6 * u, -7 * u, -5 * u, 0);
    ctx.quadraticCurveTo(-2 * u, -3 * u, 4 * u, -3 * u); ctx.closePath(); ctx.fill();
  } else if (k === 'tool' && d.tool === 'hammer') {
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.4 * u;
    ctx.beginPath(); ctx.moveTo(-1 * u, 7 * u); ctx.lineTo(2 * u, -4 * u); ctx.stroke();
    ctx.fillStyle = '#8a8a92';
    ctx.fillRect(-5 * u, -8 * u, 9 * u, 5 * u);
  } else if (k === 'sword') {
    ctx.strokeStyle = id === 75 ? '#d84868' : mc; ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.moveTo(-4 * u, 5 * u); ctx.lineTo(5 * u, -6 * u); ctx.stroke();
    ctx.strokeStyle = '#5a4022'; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.moveTo(-6 * u, 3 * u); ctx.lineTo(-3 * u, 6 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5.5 * u, 6.5 * u); ctx.lineTo(-4.2 * u, 5.2 * u); ctx.stroke();
  } else if (k === 'bow') {
    ctx.strokeStyle = id === 78 ? '#e8e0d0' : mc; ctx.lineWidth = 2.6 * u;
    ctx.beginPath(); ctx.arc(-2 * u, 0, 7 * u, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke();
    ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = u;
    ctx.beginPath(); ctx.moveTo(-2 * u + Math.cos(-Math.PI * 0.42) * 7 * u, Math.sin(-Math.PI * 0.42) * 7 * u);
    ctx.lineTo(-2 * u + Math.cos(Math.PI * 0.42) * 7 * u, Math.sin(Math.PI * 0.42) * 7 * u); ctx.stroke();
  } else if (k === 'wand') {
    ctx.strokeStyle = '#6a4a80'; ctx.lineWidth = 2.4 * u;
    ctx.beginPath(); ctx.moveTo(-4 * u, 6 * u); ctx.lineTo(3 * u, -3 * u); ctx.stroke();
    ctx.fillStyle = id === 80 ? '#ff7a3e' : '#7ee8f0';
    star(3.5 * u, -4.5 * u, 3.4 * u, 4);
  } else if (k === 'ammo') {
    ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 1.6 * u;
    ctx.beginPath(); ctx.moveTo(-5 * u, 5 * u); ctx.lineTo(4 * u, -4 * u); ctx.stroke();
    ctx.fillStyle = '#c8c8d0';
    ctx.beginPath(); ctx.moveTo(6 * u, -6 * u); ctx.lineTo(1.5 * u, -4 * u); ctx.lineTo(4 * u, -1.5 * u); ctx.closePath(); ctx.fill();
  } else if (k === 'use') {
    ctx.fillStyle = d.heal ? '#e04858' : d.mana ? '#4878e0' : '#c8903e';
    ctx.fillRect(-3 * u, -2 * u, 6 * u, 8 * u);
    ctx.fillStyle = '#b8d8e8';
    ctx.fillRect(-1.5 * u, -6 * u, 3 * u, 4 * u);
  } else if (k === 'coin') {
    ctx.fillStyle = id === 52 ? '#ffd23e' : id === 51 ? '#dfe4ea' : '#d08050';
    ctx.beginPath(); ctx.arc(0, 0, 5 * u, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = u;
    ctx.beginPath(); ctx.arc(0, 0, 3.4 * u, 0, 7); ctx.stroke();
  } else if (k === 'summon') {
    if (d.boss === 'eye') {
      ctx.fillStyle = '#e8e0e0'; ctx.beginPath(); ctx.ellipse(0, 0, 6 * u, 4.4 * u, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#c03838'; ctx.beginPath(); ctx.arc(0, 0, 2.6 * u, 0, 7); ctx.fill();
    } else if (d.boss === 'golem') {
      ctx.fillStyle = '#e8e0d0'; ctx.fillRect(-4 * u, -6 * u, 8 * u, 7 * u);
      ctx.fillRect(-3 * u, 1 * u, 6 * u, 3 * u);
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-3 * u, -4 * u, 2 * u, 2.4 * u); ctx.fillRect(1 * u, -4 * u, 2 * u, 2.4 * u);
    } else {
      ctx.fillStyle = '#e04848';
      ctx.beginPath();
      ctx.moveTo(0, 6 * u); ctx.quadraticCurveTo(-7 * u, 0, -3.5 * u, -4 * u);
      ctx.quadraticCurveTo(0, -6 * u, 0, -2 * u); ctx.quadraticCurveTo(0, -6 * u, 3.5 * u, -4 * u);
      ctx.quadraticCurveTo(7 * u, 0, 0, 6 * u); ctx.fill();
      ctx.fillStyle = '#ff9a3e'; ctx.beginPath(); ctx.arc(0, 0, 2 * u, 0, 7); ctx.fill();
    }
  } else if (k === 'armor') {
    ctx.fillStyle = mc;
    if (d.slot === 0) { ctx.beginPath(); ctx.arc(0, -u, 5 * u, Math.PI, 0); ctx.fill(); ctx.fillRect(-5 * u, -u, 10 * u, 3 * u); }
    else if (d.slot === 1) { ctx.fillRect(-5 * u, -5 * u, 10 * u, 9 * u); ctx.clearRect(-5 * u, -5 * u, 2 * u, 2 * u); ctx.clearRect(3 * u, -5 * u, 2 * u, 2 * u); }
    else { ctx.fillRect(-4.5 * u, -5 * u, 9 * u, 4 * u); ctx.fillRect(-4.5 * u, -1 * u, 3.4 * u, 7 * u); ctx.fillRect(1.1 * u, -1 * u, 3.4 * u, 7 * u); }
  } else { // материалы
    let col = '#b0a890';
    if (id === 22) col = '#d08050'; if (id === 23) col = '#b0a294'; if (id === 24) col = '#dfe4ea'; if (id === 25) col = '#ffd23e';
    if (id === 26) col = '#d08050'; if (id === 27) col = '#c0c4cc'; if (id === 28) col = '#eef2f8'; if (id === 29) col = '#ffd23e';
    if (id === 30) col = '#58c04e'; if (id === 31) col = '#e8e8f0'; if (id === 32) col = '#e8e0d0';
    if (id === 33) col = '#dfe4ea'; if (id === 34) col = '#d86a5a'; if (id === 35) col = '#7ec85e'; if (id === 36) col = '#b8d8e8';
    if (id >= 26 && id <= 29) { // слиток
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(-6 * u, 3 * u); ctx.lineTo(-4 * u, -2 * u); ctx.lineTo(4 * u, -2 * u); ctx.lineTo(6 * u, 3 * u); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-3 * u, -1.4 * u, 4 * u, u);
    } else if (id === 32) { // кость
      ctx.strokeStyle = col; ctx.lineWidth = 2.4 * u;
      ctx.beginPath(); ctx.moveTo(-4 * u, 4 * u); ctx.lineTo(4 * u, -4 * u); ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(-4.6 * u, 3 * u, 1.8 * u, 0, 7); ctx.arc(-3 * u, 4.6 * u, 1.8 * u, 0, 7);
      ctx.arc(4.6 * u, -3 * u, 1.8 * u, 0, 7); ctx.arc(3 * u, -4.6 * u, 1.8 * u, 0, 7); ctx.fill();
    } else if (id === 31) { // линза
      ctx.fillStyle = '#d8e0f0'; ctx.beginPath(); ctx.ellipse(0, 0, 4.4 * u, 5.4 * u, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(90,110,200,0.5)'; ctx.beginPath(); ctx.arc(0, 0, 2.4 * u, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, 4.6 * u, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(-1.4 * u, -1.4 * u, 1.6 * u, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}
function star(x, y, r, n) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * 0.4;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

// снаряды
function drawProjs(Z, cx, cy) {
  for (const p of projs) {
    const px = p.x * Z - cx, py = p.y * Z - cy;
    if (p.kind === 'arrow') {
      const a = Math.atan2(p.vy, p.vx);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-Z * 0.3, 0); ctx.lineTo(Z * 0.2, 0); ctx.stroke();
      ctx.fillStyle = '#c8c8d0';
      ctx.beginPath(); ctx.moveTo(Z * 0.32, 0); ctx.lineTo(Z * 0.14, -Z * 0.08); ctx.lineTo(Z * 0.14, Z * 0.08); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'fire') {
      ctx.fillStyle = 'rgba(255,150,50,0.35)';
      ctx.beginPath(); ctx.arc(px, py, Z * 0.34, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff8a3e';
      ctx.beginPath(); ctx.arc(px, py, Z * 0.2, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd85a';
      ctx.beginPath(); ctx.arc(px, py, Z * 0.1, 0, 7); ctx.fill();
    } else if (p.kind === 'bone') {
      ctx.save(); ctx.translate(px, py); ctx.rotate(world.time * 9);
      ctx.strokeStyle = '#e8e0d0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-Z * 0.18, 0); ctx.lineTo(Z * 0.18, 0); ctx.stroke();
      ctx.restore();
    } else { // spark
      ctx.fillStyle = 'rgba(120,230,240,0.4)';
      ctx.beginPath(); ctx.arc(px, py, Z * 0.26, 0, 7); ctx.fill();
      ctx.fillStyle = '#b8f0f8';
      star(px, py, Z * 0.16, 4);
    }
  }
}

/* ══════ 12-ui.js ══════ */
/* UI: HUD, инвентарь/крафт/сундук/магазин, меню, оверлеи, тач-кнопки. */

const UIR = { inv: [], equip: [], craft: [], chest: [], shop: [], buttons: [], touch: [] };

function slotRect(x, y, s) { return { x, y, s }; }
function inRect(r, mx, my) { return mx >= r.x && mx < r.x + r.s && my >= r.y && my < r.y + r.s; }

function drawSlot(r, slot, hot) {
  ctx.fillStyle = hot ? 'rgba(255,220,120,0.28)' : 'rgba(10,12,20,0.72)';
  ctx.fillRect(r.x, r.y, r.s, r.s);
  ctx.strokeStyle = hot ? '#ffd23e' : 'rgba(255,255,255,0.22)';
  ctx.lineWidth = hot ? 2 : 1;
  ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.s - 1, r.s - 1);
  if (slot) {
    drawItemIcon(slot.id, r.x + r.s * 0.12, r.y + r.s * 0.12, r.s * 0.76);
    if (slot.n > 1) {
      ctx.font = 'bold ' + Math.round(r.s * 0.3) + 'px monospace';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#0a0a0a';
      ctx.fillText(slot.n, r.x + r.s - 3, r.y + r.s - 3);
      ctx.fillStyle = '#fff';
      ctx.fillText(slot.n, r.x + r.s - 4, r.y + r.s - 4);
    }
  }
}

function drawHud() {
  const cw = cv.width, ch = cv.height;
  const S = Math.max(34, Math.min(46, Math.floor(cw / 24)));
  // ── хотбар ──
  UIR.inv.length = 0;
  for (let i = 0; i < 10; i++) {
    const r = slotRect(10 + i * (S + 4), 10, S);
    UIR.inv[i] = r;
    drawSlot(r, inv[i], i === uiState.hotbar && !uiState.open);
    ctx.font = Math.round(S * 0.26) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText((i + 1) % 10, r.x + 3, r.y + Math.round(S * 0.3));
  }
  // название предмета в руке
  const held = inv[uiState.hotbar];
  if (held && !uiState.open) {
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(ITEMS[held.id].name, 12, 10 + S + 16);
  }
  // ── сердца ──
  const hearts = Math.ceil(P.hpMax / 10);
  for (let i = 0; i < hearts; i++) {
    const hx = cw - 12 - (hearts - i) * 22, hy = 14;
    const fill = clamp(P.hp - i * 10, 0, 10) / 10;
    drawHeart(hx, hy, 18, fill);
  }
  // ── мана ──
  const stars = Math.ceil(P.manaMax / 5);
  for (let i = 0; i < stars; i++) {
    const sx2 = cw - 12 - (stars - i) * 20, sy = 40;
    const fill = clamp(P.mana - i * 5, 0, 5) / 5;
    ctx.globalAlpha = 0.25 + fill * 0.75;
    ctx.fillStyle = '#5a8ae8';
    star(sx2 + 8, sy + 8, 8, 5);
    ctx.globalAlpha = 1;
  }
  // ── воздух ──
  if (P.air < P.airMax) {
    const bub = Math.ceil(P.airMax);
    for (let i = 0; i < bub; i++) {
      const fill = clamp(P.air - i, 0, 1);
      ctx.globalAlpha = 0.2 + fill * 0.8;
      ctx.fillStyle = '#8ad0f0';
      ctx.beginPath(); ctx.arc(cw - 12 - (bub - i) * 18 + 7, 70, 6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // ── монеты ──
  const total = coinTotal();
  const g = Math.floor(total / 10000), s2 = Math.floor((total % 10000) / 100), c2 = total % 100;
  ctx.font = 'bold 13px monospace'; ctx.textAlign = 'left';
  let cx0 = 12, cy0 = 10 + S + 34;
  const coinPart = (col, v) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx0 + 6, cy0, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(v, cx0 + 16, cy0 + 4);
    cx0 += 16 + ctx.measureText(String(v)).width + 10;
  };
  coinPart('#ffd23e', g); coinPart('#dfe4ea', s2); coinPart('#d08050', c2);
  // ── глубина и время ──
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.textAlign = 'left';
  ctx.fillText(depthZone(Math.floor(P.y)) + '  ·  ' + (isNight() ? '🌙 НОЧЬ' : '☀ ДЕНЬ'), 12, ch - 14);
  // бафф
  if (P.buffs.regen) { ctx.fillStyle = '#ffb84e'; ctx.fillText('РЕГЕН ' + Math.ceil(P.buffs.regen) + 'с', 12, ch - 30); }
  if (P.potionCd > 0) { ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillText('зелье: ' + Math.ceil(P.potionCd) + 'с', 200, ch - 14); }
  // ── босс-бар ──
  const b = activeBoss();
  if (b) {
    const bw = Math.min(560, cw * 0.6);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(cw / 2 - bw / 2 - 3, ch - 46 - 3, bw + 6, 22);
    ctx.fillStyle = '#701820';
    ctx.fillRect(cw / 2 - bw / 2, ch - 46, bw, 16);
    ctx.fillStyle = '#e03848';
    ctx.fillRect(cw / 2 - bw / 2, ch - 46, bw * clamp(b.hp / b.hpMax, 0, 1), 16);
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(b.name, cw / 2, ch - 52);
  }
  // ── сообщение/подсказка ──
  if (uiState.msgT > 0) {
    ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    const tw = ctx.measureText(uiState.msg).width;
    ctx.fillRect(cw / 2 - tw / 2 - 12, 64, tw + 24, 26);
    ctx.fillStyle = '#ffe89a';
    ctx.fillText(uiState.msg, cw / 2, 82);
  }
  if (world.hint && !uiState.open) {
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    const tw = ctx.measureText(world.hint).width;
    ctx.fillStyle = 'rgba(20,30,55,0.65)';
    ctx.fillRect(cw / 2 - tw / 2 - 12, 96, tw + 24, 24);
    ctx.strokeStyle = 'rgba(255,210,62,0.5)';
    ctx.strokeRect(cw / 2 - tw / 2 - 12, 96, tw + 24, 24);
    ctx.fillStyle = '#cfe0ff';
    ctx.fillText(world.hint, cw / 2, 112);
  }
  drawTouchControls();
}

function drawHeart(x, y, s, fill) {
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2);
  const draw = (col) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.32);
    ctx.quadraticCurveTo(-s * 0.55, -s * 0.05, -s * 0.28, -s * 0.3);
    ctx.quadraticCurveTo(0, -s * 0.42, 0, -s * 0.12);
    ctx.quadraticCurveTo(0, -s * 0.42, s * 0.28, -s * 0.3);
    ctx.quadraticCurveTo(s * 0.55, -s * 0.05, 0, s * 0.32);
    ctx.fill();
  };
  draw('rgba(40,10,14,0.8)');
  if (fill > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(-s / 2, s / 2 - s * fill, s, s * fill);
    ctx.clip();
    draw('#e03848');
    ctx.restore();
  }
  ctx.restore();
}

// ── инвентарь ──
function drawInventoryUI() {
  const cw = cv.width, ch = cv.height;
  // ректы прошлого кадра чистим ВСЕГДА — иначе клики по невидимым панелям
  UIR.craft.length = 0; UIR.chest.length = 0; UIR.shop.length = 0;
  ctx.fillStyle = 'rgba(6,8,14,0.55)';
  ctx.fillRect(0, 0, cw, ch);
  const S = Math.max(34, Math.min(46, Math.floor(cw / 24)));
  const gap = 4;
  // 50 слотов 10×5
  UIR.inv.length = 0;
  for (let row = 0; row < 5; row++)
    for (let col = 0; col < 10; col++) {
      const i = row * 10 + col;
      const r = slotRect(10 + col * (S + gap), 10 + row * (S + gap), S);
      UIR.inv[i] = r;
      drawSlot(r, inv[i], i === uiState.hotbar);
    }
  const invBottom = 10 + 5 * (S + gap);
  // броня
  UIR.equip.length = 0;
  ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('БРОНЯ', 10 + 10 * (S + gap) + 8, 22);
  for (let i = 0; i < 3; i++) {
    const r = slotRect(10 + 10 * (S + gap) + 8, 28 + i * (S + gap), S);
    UIR.equip[i] = r;
    drawSlot(r, equip[i], false);
    if (!equip[i]) {
      ctx.font = Math.round(S * 0.5) + 'px monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillText(['⛑', '🦺', '👖'][i], r.x + S / 2, r.y + S * 0.68);
    }
  }
  ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Защита: ' + playerDef(), 10 + 10 * (S + gap) + 8, 28 + 3 * (S + gap) + 14);

  // ── крафт: правая панель, на узких экранах — под инвентарём ──
  if (!uiState.shop && uiState.chest == null) {
    const crX = 10 + 10 * (S + gap) + 8 + S + 18;
    const crW = Math.min(330, cw - crX - 10);
    if (crW > 180) drawCraftPanel(crX, 10, crW, ch - 90);
    else drawCraftPanel(10, invBottom + 8, cw - 20, Math.max(120, ch - invBottom - 18));
  }

  // ── сундук ──
  const chSlots = chestSlots();
  if (chSlots) {
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = '#ffd23e'; ctx.textAlign = 'left';
    ctx.fillText('СУНДУК (Shift-клик — быстрый перенос)', 10, invBottom + 20);
    for (let i = 0; i < 27; i++) {
      const col = i % 9, row = Math.floor(i / 9);
      const r = slotRect(10 + col * (S + gap), invBottom + 28 + row * (S + gap), S);
      UIR.chest[i] = r;
      drawSlot(r, chSlots[i], false);
    }
  }
  // ── магазин ──
  UIR.shop.length = 0;
  if (uiState.shop) {
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = '#ffd23e'; ctx.textAlign = 'left';
    ctx.fillText('ТОРГОВЕЦ — купить (Shift-клик по своему предмету — продать)', 10, invBottom + 20);
    for (let i = 0; i < SHOP.length; i++) {
      const col = i % 9;
      const r = slotRect(10 + col * (S + gap), invBottom + 28, S);
      UIR.shop[i] = r;
      drawSlot(r, { id: SHOP[i][0], n: SHOP[i][1] }, false);
      ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd23e';
      ctx.fillText(fmtPrice(SHOP[i][2]), r.x + S / 2, r.y + S + 11);
    }
  }
  // курсор-предмет
  if (uiState.cursor) drawItemIcon(uiState.cursor.id, IN.mx - 16, IN.my - 16, 32);
  if (uiState.cursor && uiState.cursor.n > 1) {
    ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(uiState.cursor.n, IN.mx + 8, IN.my + 16);
  }
  // тултип
  drawTooltip();
}

// Панель крафта в произвольной геометрии (правая колонка или блок под инвентарём)
function drawCraftPanel(px, py, pw, phh) {
  ctx.fillStyle = 'rgba(10,14,24,0.8)';
  ctx.fillRect(px, py, pw, phh);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.strokeRect(px, py, pw, phh);
  ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd23e';
  ctx.fillText('КРАФТ', px + 10, py + 20);
  ctx.font = '11px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('верстак: ' + (stationNear(1) ? '✓' : '—') + '  печь: ' + (stationNear(2) ? '✓' : '—') + '  наков.: ' + (stationNear(3) ? '✓' : '—'), px + 80, py + 20);
  const list = craftList();
  const rowH = 40;
  const maxRows = Math.max(1, Math.floor((phh - 40) / rowH));
  uiState.craftScroll = clamp(uiState.craftScroll, 0, Math.max(0, list.length - maxRows));
  for (let vi = 0; vi < Math.min(maxRows, list.length - uiState.craftScroll); vi++) {
    const r = list[vi + uiState.craftScroll];
    const y = py + 30 + vi * rowH;
    const ok = canCraft(r);
    const rr = { x: px + 6, y: y, s: rowH - 4, w: pw - 12, recipe: r };
    UIR.craft.push(rr);
    const hov = IN.mx >= rr.x && IN.mx < rr.x + rr.w && IN.my >= rr.y && IN.my < rr.y + rr.s;

}

// клики по инвентарю; возвращает true если клик обработан UI
function uiClick(mx, my, shift, rmb) {
  if (!uiState.open) return false;
  // крафт
  for (const rr of UIR.craft) {
    if (rr && mx >= rr.x && mx < rr.x + rr.w && my >= rr.y && my < rr.y + rr.s) {
      const n = shift ? 5 : 1;
      for (let i = 0; i < n; i++) if (!doCraft(rr.recipe)) break;
      return true;
    }
  }
  // магазин
  if (uiState.shop) for (let i = 0; i < UIR.shop.length; i++)
    if (inRect(UIR.shop[i], mx, my)) { shopBuy(i); return true; }
  // броня
  for (let i = 0; i < UIR.equip.length; i++)
    if (inRect(UIR.equip[i], mx, my)) {
      const cur = equip[i];
      if (uiState.cursor) {
        const d = ITEMS[uiState.cursor.id];
        if (d.kind === 'armor' && d.slot === i) { equip[i] = uiState.cursor; uiState.cursor = cur; sfx('craft'); }
      } else if (cur) { uiState.cursor = cur; equip[i] = null; }
      return true;
    }
  // сундук
  const chS = chestSlots();
  if (chS) for (let i = 0; i < UIR.chest.length; i++)
    if (inRect(UIR.chest[i], mx, my)) {
      if (shift && chS[i]) { const left = invAdd(chS[i].id, chS[i].n); chS[i] = left ? { id: chS[i].id, n: left } : null; }
      else clickSlotArr(chS, i, rmb);
      markDiffChest();
      return true;
    }
  // инвентарь
  for (let i = 0; i < UIR.inv.length; i++)
    if (UIR.inv[i] && inRect(UIR.inv[i], mx, my)) {
      const s = inv[i];
      if (uiState.shop && shift && s) { shopSell(i); return true; }
      if (chS && shift && s) { // быстрый перенос в сундук
        const left = chestAdd(chS, s.id, s.n);
        inv[i] = left ? { id: s.id, n: left } : null;
        markDiffChest();
        return true;
      }
      if (rmb && s && !uiState.cursor) { // ПКМ: надеть/использовать
        const d = ITEMS[s.id];
        if (d.kind === 'armor') { const cur = equip[d.slot]; equip[d.slot] = s; inv[i] = cur; sfx('craft'); return true; }
        if (d.kind === 'use') { usePotion(s, d); return true; }
      }
      clickSlotArr(inv, i, rmb);
      return true;
    }
  return true; // клик по фону инвентаря — не в мир
}
function clickSlotArr(arr, i, rmb) {
  const s = arr[i];
  if (uiState.cursor) {
    if (!s) {
      if (rmb) { // положить один
        arr[i] = { id: uiState.cursor.id, n: 1 };
        if (--uiState.cursor.n <= 0) uiState.cursor = null;
      } else { arr[i] = uiState.cursor; uiState.cursor = null; }
    } else if (s.id === uiState.cursor.id) {
      const max = ITEMS[s.id].max;
      const add = Math.min(rmb ? 1 : uiState.cursor.n, max - s.n);
      s.n += add; uiState.cursor.n -= add;
      if (uiState.cursor.n <= 0) uiState.cursor = null;
    } else { arr[i] = uiState.cursor; uiState.cursor = s; }
  } else if (s) {
    if (rmb) { // взять половину
      const half = Math.ceil(s.n / 2);
      uiState.cursor = { id: s.id, n: half };
      s.n -= half;
      if (s.n <= 0) arr[i] = null;
    } else { uiState.cursor = s; arr[i] = null; }
  }
}
function chestAdd(chS, id, n) {
  const max = ITEMS[id].max;
  let left = n;
  for (let i = 0; i < 27 && left > 0; i++) {
    const s = chS[i];
    if (s && s.id === id && s.n < max) { const a = Math.min(max - s.n, left); s.n += a; left -= a; }
  }
  for (let i = 0; i < 27 && left > 0; i++)
    if (!chS[i]) { const a = Math.min(max, left); chS[i] = { id, n: a }; left -= a; }
  return left;
}
function markDiffChest() { /* сундуки сохраняются целиком — просто пометка «грязно» */ world.dirty = true; }

/* Звук: WebAudio-синтез, без внешних файлов. */

let audioCtx = null;
function audioInit() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!audioCtx || world.muted) return;
  try {
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, fLow) {
  if (!audioCtx || world.muted) return;
  try {
    const n = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.value = vol || 0.06;
    let node = src;
    if (fLow) {
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = fLow;
      src.connect(f); node = f;
    }
    node.connect(g); g.connect(audioCtx.destination);
    src.start();
  } catch (e) {}
}

let lastSfx = {};
function sfx(name) {
  const now = performance.now();
  if (lastSfx[name] && now - lastSfx[name] < 60) return; // анти-спам
  lastSfx[name] = now;
  switch (name) {
    case 'dig': noise(0.07, 0.05, 900); tone(160 + Math.random() * 60, 0.06, 'square', 0.03); break;
    case 'place': tone(220, 0.08, 'square', 0.05, -60); break;
    case 'jump': tone(300, 0.12, 'square', 0.04, 190); break;
    case 'hurt': tone(160, 0.2, 'sawtooth', 0.09, -80); break;
    case 'death': tone(220, 0.6, 'sawtooth', 0.1, -170); noise(0.4, 0.08, 600); break;
    case 'swing': noise(0.06, 0.03, 2400); break;
    case 'hit': tone(140, 0.08, 'square', 0.07, -40); noise(0.05, 0.05, 1200); break;
    case 'foedie': tone(180, 0.25, 'triangle', 0.08, -120); noise(0.15, 0.06, 800); break;
    case 'pickup': tone(560, 0.09, 'square', 0.045, 220); break;
    case 'coin': tone(880, 0.07, 'square', 0.05); tone(1180, 0.1, 'square', 0.05, 0, 0.06); break;
    case 'craft': tone(440, 0.1, 'square', 0.05); tone(660, 0.12, 'square', 0.05, 0, 0.09); break;
    case 'door': tone(190, 0.09, 'square', 0.05, 60); break;
    case 'shoot': noise(0.08, 0.05, 3000); tone(420, 0.06, 'square', 0.03, -120); break;
    case 'magic': tone(760, 0.16, 'sine', 0.06, 300); break;
    case 'fireball': noise(0.14, 0.06, 1000); tone(200, 0.16, 'sawtooth', 0.05, -60); break;
    case 'potion': tone(320, 0.2, 'sine', 0.06, 140); break;
    case 'roar': tone(90, 0.7, 'sawtooth', 0.12, -30); noise(0.5, 0.09, 400); break;
    case 'dash': noise(0.12, 0.07, 1800); break;
    case 'slam': noise(0.25, 0.12, 500); tone(70, 0.3, 'sine', 0.12, -20); break;
    case 'treefall': noise(0.3, 0.08, 700); tone(120, 0.25, 'triangle', 0.06, -50); break;
    case 'victory': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.06, 0, i * 0.12)); break;
    case 'splash': noise(0.2, 0.07, 900); break;
  }
}

/* ══════ 14-save.js ══════ */
/* Сейвы: мир = seed + диффы изменённых клеток (компактно, base36).
   Каналы: sharky-progress (облако сайта) → {type:'save'} (лента) → localStorage. */

const SAVE_KEY = 'cubaria_save';
const SAVE_VER = 1;

function encodeDiffs() {
  const keys = Array.from(DIFF.keys()).sort((a, b) => a - b);
  let prev = 0;
  const out = [];
  for (const k of keys) {
    const t = T[k], w = W[k], l = LQ[k];
    out.push((k - prev).toString(36) + '.' + t.toString(36) + '.' + w.toString(36) + '.' + l.toString(36));
    prev = k;
  }
  return out.join(';');
}
function decodeDiffs(str) {
  if (!str) return;
  let prev = 0;
  genMode = true; // не создавать новые диффы при накатке
  for (const e of str.split(';')) {
    if (!e) continue;
    const p = e.split('.');
    const dk = parseInt(p[0], 36);
    // битые данные: дальше дельты недостоверны — обрываем хвост, NaN в DIFF не пускаем
    if (!Number.isFinite(dk)) break;
    const k = prev + dk;
    if (!Number.isInteger(k) || k < 0 || k >= WORLD_W * WORLD_H) break;
    prev = k;
    T[k] = parseInt(p[1], 36) || 0;
    W[k] = parseInt(p[2], 36) || 0;
    LQ[k] = parseInt(p[3], 36) || 0;
    DIFF.set(k, 1);
  }
  genMode = false;
}

function buildSave() {
  // чистка транзитных диффов (следы протёкшей жидкости и т.п.): клетка,
  // совпавшая с генерацией, сейву не нужна — DIFF перестаёт расти бесконечно
  if (T0) {
    for (const k of Array.from(DIFF.keys()))
      if (T[k] === T0[k] && W[k] === W0[k] && LQ[k] === LQ0[k]) DIFF.delete(k);
  }
  const invPack = inv.map((s) => (s ? [s.id, s.n] : 0));
  const eqPack = equip.map((s) => (s ? s.id : 0));
  const ch = {};
  for (const [k, slots] of chests) {
    const arr = [];
    for (let i = 0; i < 27; i++) if (slots[i]) arr.push([i, slots[i].id, slots[i].n]);
    ch[k.toString(36)] = arr;
  }
  const boss = activeBoss();
  return {
    v: SAVE_VER,
    seed: world.seed,
    time: Math.round(world.time * 10) / 10,
    score: world.score,
    md: world.maxDepth,
    flags: Object.assign({}, flags),
    tut: world.tutStep,
    mile: Object.assign({}, seenMilestones),
    spawn: [Math.round(P.spawnX * 10) / 10, Math.round(P.spawnY * 10) / 10],
    pl: [Math.round(P.x * 10) / 10, Math.round(P.y * 10) / 10, P.hp, P.mana],
    pcd: Math.round(P.potionCd * 10) / 10,
    bf: Object.assign({}, P.buffs),
    inv: invPack,
    eq: eqPack,
    dif: encodeDiffs(),
    ch: ch,
    npc: npcs.length ? [Math.floor(npcs[0].homeX), Math.round(npcs[0].y)] : 0,
    boss: boss ? { k: boss.kind, hp: Math.round(boss.hp) } : 0,
    dr: drops.slice(0, 60).map((d) => [d.id, d.n, Math.round(d.x * 10) / 10, Math.round(d.y * 10) / 10]),
  };
}

function applySave(d) {
  world.seed = d.seed;
  genWorld(d.seed);
  _bnCache = makeNoise1D(d.seed * 31 + 4, 40, 1);
  decodeDiffs(d.dif);
  chests.clear();
  for (const k36 in d.ch || {}) {
    const slots = new Array(27).fill(null);
    for (const [i, id, n] of d.ch[k36]) slots[i] = { id, n };
    chests.set(parseInt(k36, 36), slots);
  }
  world.time = d.time || 30;
  world.score = d.score || 0;
  world.tutStep = d.tut || 0;
  Object.assign(flags, d.flags || {});
  Object.assign(seenMilestones, d.mile || {});
  P.spawnX = d.spawn[0]; P.spawnY = d.spawn[1];
  P.x = d.pl[0]; P.y = d.pl[1];
  P.hp = clamp(d.pl[2] || 100, 1, 100); P.mana = clamp(d.pl[3] || 20, 0, 20);
  P.vx = 0; P.vy = 0; P.dead = false; P.fallFrom = P.y; P.inv = 1;
  P.potionCd = clamp(d.pcd || 0, 0, 30);
  P.buffs = {};
  for (const k in d.bf || {}) P.buffs[k] = clamp(d.bf[k], 0, 300);
  // рекорд глубины: из сейва, для старых сейвов — из позиции (иначе фарм очков перезагрузкой)
  world.maxDepth = d.md != null ? d.md
    : Math.max(0, Math.floor(P.y - surf[clamp(Math.floor(P.x), 0, WORLD_W - 1)]));
  for (let i = 0; i < 50; i++) inv[i] = d.inv && d.inv[i] ? { id: d.inv[i][0], n: d.inv[i][1] } : null;
  for (let i = 0; i < 3; i++) equip[i] = d.eq && d.eq[i] ? { id: d.eq[i], n: 1 } : null;
  foes.length = 0; drops.length = 0; projs.length = 0; parts.length = 0; dmgTexts.length = 0;
  npcs.length = 0;
  if (d.npc) {
    // новый формат [тайл, y], легаси — число (сдвинутое Math.round'ом)
    const hx = Array.isArray(d.npc) ? d.npc[0] : d.npc;
    let hy = Array.isArray(d.npc) ? d.npc[1] : 0;
    if (!hy || !isSolid(gT(hx, hy + 1))) {
      hy = Array.isArray(d.npc) ? Math.max(4, hy - 3) : 10;
      while (hy < WORLD_H - 2 && !isSolid(gT(hx, hy))) hy++;
    }
    npcs.push({ x: hx + 0.5, y: hy, vx: 0, vy: 0, w: 0.8, h: 1.85, dir: 1, homeX: hx + 0.5, t: 0, onGround: false });
  }
  // наземный лут и живой босс переживают перезагрузку
  if (Array.isArray(d.dr))
    for (const [id, n, x, y] of d.dr) if (ITEMS[id]) drops.push({ x, y, vx: 0, vy: 0, id, n, t: 300, pk: 0.5 });
  if (d.boss && BOSSES[d.boss.k]) {
    const bf2 = spawnBossAt(d.boss.k);
    if (bf2) bf2.hp = clamp(d.boss.hp, 1, bf2.hpMax);
  }
  // индекс саженцев для updateSaplings (O(число саженцев), не O(вся история))
  world.saplings.length = 0;
  for (const k of DIFF.keys()) if (T[k] === T_SAPLING) world.saplings.push(k);
  lightDirty = true;
}

// ── каналы сохранения ──
// dirty-счётчик: автосейв пропускается, если с прошлого сейва ничего не менялось
// (иначе O(диффы)-кодирование гоняется каждые 20 с даже у АФК-игрока)
let saveT = 0, dirtyN = 0, savedDirtyN = -1;
function touchDirty() { dirtyN++; }
function persistProgress(force) {
  if (state === 'menu' && !force) return;
  if (!force && dirtyN === savedDirtyN) return;
  try {
    const data = buildSave();
    const json = JSON.stringify(data);
    savedDirtyN = dirtyN;
    try { parent.postMessage({ type: 'sharky-progress-save', data: data }, '*'); } catch (e) {}
    try { parent.postMessage({ type: 'save', value: data }, '*'); } catch (e) {}
    try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
    world.saveSize = json.length;
  } catch (e) { console.error('persistProgress:', e); }
}

function tryLoadLocal() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function validSave(d) {
  return d && typeof d === 'object' && typeof d.seed === 'number' && Array.isArray(d.pl) && d.v >= 1;
}

/* ══════ 15-main.js ══════ */
/* Главный модуль: canvas, ввод, протокол Sharky, цикл, состояния, туториал. */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const world = {
  time: 30, seed: 0, score: 0, dt: 1 / 60, lightT: 0, hint: '', tutStep: 0,
  muted: false, hasSave: false, dirty: false, saveSize: 0, maxDepth: 0,
  saplings: [], showHelp: false, confirmT: 0,
};
const flags = {};
let state = 'menu'; // menu | play | pause

const IN = { left: 0, right: 0, jump: 0, down: 0, mx: 0, my: 0, mDown: 0, touch: 0, shift: 0 };

// ── размеры ──
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(320, Math.floor(cv.clientWidth * dpr));
  cv.height = Math.max(240, Math.floor(cv.clientHeight * dpr));
  cam.z = Math.round(clamp(cv.height / 19, 24, 52));
}
window.addEventListener('resize', resize);

// ── мышь → мир ──
function mouseWorldPos() {
  return [(cam.camPX + IN.mx) / cam.z, (cam.camPY + IN.my) / cam.z];
}
function mouseTile() {
  const [x, y] = mouseWorldPos();
  return [Math.floor(x), Math.floor(y)];
}

// ── протокол Sharky ──
let gotShell = false, cloudAnswered = false, booted = false, bootMs = 0, shellPaused = false;
function send(m) { try { parent.postMessage(m, '*'); } catch (e) {} }
// сейв можно накатить и в 'play', пока игрок ничего не сделал в свежем мире
// (гонка: тап «Играть» до ответа облака не должен стирать облачный прогресс)
function pristineWorld() { return DIFF.size === 0 && world.score === 0 && world.maxDepth === 0; }
function acceptExternalSave(d) {
  if (!validSave(d)) return;
  if (state === 'menu' || (state === 'play' && pristineWorld())) {
    const wasPlay = state === 'play';
    applySave(d);
    world.hasSave = true;
    if (wasPlay) showMsg('Загружен облачный прогресс');
  }
}
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'init') {
    gotShell = true;
    if (d.save !== undefined && d.save !== null) { cloudAnswered = true; acceptExternalSave(d.save); }
  } else if (d.type === 'start') {
    gotShell = true;
    if (state === 'pause' && shellPaused) { state = 'play'; shellPaused = false; } // возврат к карточке = продолжить
  } else if (d.type === 'pause') {
    if (state === 'play') { state = 'pause'; shellPaused = true; persistProgress(true); }
  } else if (d.type === 'sharky-progress') {
    cloudAnswered = true;
    acceptExternalSave(d.data);
  }
});
// ждать ли ещё ответа облака (гейт кнопок меню)
function cloudPending() {
  return !cloudAnswered && !world.hasSave && (performance.now() - bootMs) < 3000;
}

let scoreT = 0, lastSentScore = -1;
function addScore(n) { world.score += n; }
function pushScore() {
  if (world.score !== lastSentScore) { lastSentScore = world.score; send({ type: 'score', value: world.score }); }
}

// ── старт/новый мир ──
function giveStartItems() {
  inv.fill(null);
  equip[0] = equip[1] = equip[2] = null;
  invAdd(60, 1); invAdd(65, 1); invAdd(9, 5);
}
function placePlayerAtSpawn() {
  let sx = 440; // лес
  let best = 1e9;
  for (let x = 380; x < 560; x += 4) { // ровное место
    const d = Math.abs(surf[x] - surf[x + 2]) + Math.abs(surf[x] - surf[x - 2]);
    if (d < best && !lqLevel(gLQ(x, surf[x] - 1))) { best = d; sx = x; }
  }
  P.spawnX = sx + 0.5;
  P.spawnY = surf[sx] - 0.02;
  P.x = P.spawnX; P.y = P.spawnY;
  P.vx = 0; P.vy = 0; P.fallFrom = P.y;
}
function newWorld() {
  world.seed = (Math.random() * 2147483646 + 1) | 0;
  world.time = 30; world.score = 0; world.tutStep = 0; world.maxDepth = 0;
  world.saplings.length = 0;
  for (const k in flags) delete flags[k];
  for (const k in seenMilestones) delete seenMilestones[k];
  genWorld(world.seed);
  _bnCache = makeNoise1D(world.seed * 31 + 4, 40, 1);
  foes.length = 0; drops.length = 0; projs.length = 0; parts.length = 0; dmgTexts.length = 0; npcs.length = 0;
  dmgMap.clear();
  P.hp = P.hpMax; P.mana = P.manaMax; P.dead = false;
  giveStartItems();
  placePlayerAtSpawn();
  cam.x = P.x; cam.y = P.y - 2;
  state = 'play';
  world.hasSave = true;
  showMsg('Добро пожаловать в Кубарию!');
  // НЕ сохраняем сразу: пустой мир не должен затирать облачный сейв,
  // который мог ещё не доехать (первый сейв уйдёт по dirty/паузе)
}
function startGame() {
  state = 'play';
  cam.x = P.x; cam.y = P.y - 2;
}

// ── туториал ──
function onTutorial() { /* события-ускорители не нужны: проверяем условия поллингом */ }
const TUT_CONDS = [
  () => invCount(7) >= 8,
  () => invCount(13) > 0 || stationNear(STATION_BENCH),
  () => invCount(60) > 0 && stationNear(STATION_BENCH) || invCount(61) > 0,
  () => invCount(2) >= 20 || invCount(14) > 0,
  () => invCount(14) > 0 || stationNear(STATION_FURNACE),
  () => invCount(26) >= 1 || invCount(27) >= 1,
  () => invCount(15) > 0 || stationNear(STATION_ANVIL),
];
function updateTutorial() {
  while (world.tutStep < TUT_CONDS.length && TUT_CONDS[world.tutStep]()) world.tutStep++;
  world.hint = world.tutStep < HINTS.length ? HINTS[world.tutStep] : '';
}

// ── саженцы (обход по индексу world.saplings, не по всей истории диффов) ──
function updateSaplings() {
  for (let i = world.saplings.length - 1; i >= 0; i--) {
    const k = world.saplings[i];
    if (T[k] !== T_SAPLING) { world.saplings.splice(i, 1); continue; } // выкопан/перезаписан
    if (Math.random() < 0.03) {
      const x = k % WORLD_W, y = Math.floor(k / WORLD_W);
      if (gT(x, y - 1) === T_AIR && gT(x, y - 2) === T_AIR) {
        setTile(x, y, T_AIR);
        world.saplings.splice(i, 1);
        const b = biomeAt(x, _bnCache);
        growTreeRuntime(x, y, b === 'desert' ? 'forest' : b);
        lightDirty = true;
      }
    }
  }
}
function growTreeRuntime(x, y, biome) {
  const rng = mulberry32((Math.random() * 1e9) | 0);
  genMode = false;
  const h = 4 + Math.floor(rng() * 4);
  for (let i = 0; i < h; i++) if (gT(x, y - i) === T_AIR) setTile(x, y - i, T_TRUNK);
  const ty = y - h;
  for (let dy = -2; dy <= 1; dy++)
    for (let dx = -2; dx <= 2; dx++)
      if (Math.abs(dx) + Math.abs(dy) < 4 && gT(x + dx, ty + dy) === T_AIR) setTile(x + dx, ty + dy, T_LEAVES);
}

// ── ввод: клавиатура ──
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', ArrowDown: 'down', KeyS: 'down',
};
window.addEventListener('keydown', (e) => {
  audioInit();
  const act = KEYMAP[e.code];
  if (act) {
    IN[act] = 1;
    if (act === 'jump' && IN.down && P.onGround) P.dropT = 0.25; // спрыгнуть с платформы
    e.preventDefault();
  }
  IN.shift = e.shiftKey ? 1 : 0;
  if (e.code.startsWith('Digit')) {
    const n = Number(e.code.slice(5));
    uiState.hotbar = (n === 0 ? 9 : n - 1);
  }
  if (e.code === 'KeyE') {
    uiState.open = !uiState.open;
    if (!uiState.open) closeInv();
    e.preventDefault();
  }
  if (e.code === 'Escape') {
    if (uiState.open) { uiState.open = false; closeInv(); }
    else if (state === 'play') { state = 'pause'; shellPaused = false; persistProgress(true); }
    else if (state === 'pause') state = 'play';
  }
});
window.addEventListener('keyup', (e) => {
  const act = KEYMAP[e.code];
  if (act) IN[act] = 0;
  IN.shift = e.shiftKey ? 1 : 0;
});
window.addEventListener('blur', () => { IN.left = IN.right = IN.jump = IN.down = IN.mDown = 0; });

function closeInv() {
  uiState.chest = null; uiState.shop = false;
  if (uiState.cursor) { // предмет в руке — вернуть/выбросить
    const left = invAdd(uiState.cursor.id, uiState.cursor.n);
    if (left) spawnDrop(P.x, P.y - 1, uiState.cursor.id, left);
    uiState.cursor = null;
  }
}

// ── ввод: мышь/тач ──
function toCanvasXY(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height];
}
cv.addEventListener('pointermove', (e) => {
  const [x, y] = toCanvasXY(e);
  IN.mx = x; IN.my = y;
});
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  const [x, y] = toCanvasXY(e);
  IN.mx = x; IN.my = y;
  if (e.pointerType === 'touch') IN.touch = 1;
  // кнопки меню/паузы
  if (state === 'menu' || state === 'pause') {
    for (const b of UIR.buttons)
      if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) { sfx('craft'); b.fn(); return; }
    return;
  }
  // тач-кнопки
  if (IN.touch) {
    for (const tb of UIR.touch) {
      if ((x - tb.x) ** 2 + (y - tb.y) ** 2 < (tb.r * 1.2) ** 2) {
        if (tb.k === 'inv') { uiState.open = !uiState.open; if (!uiState.open) closeInv(); }
        else { IN['t_' + tb.k] = e.pointerId; applyTouchKeys(); }
        return;
      }
    }
  }
  if (uiState.open) { uiClick(x, y, IN.shift || e.button === 1, e.button === 2); return; }
  if (e.button === 2) { const [tx, ty] = mouseTile(); interactAt(tx, ty); return; }
  // тач: тап по интерактивному тайлу/NPC = взаимодействие (ПКМ на таче нет)
  if (e.pointerType === 'touch' && state === 'play' && !P.dead) {
    const [tx, ty] = mouseTile();
    const t = gT(tx, ty);
    let interactive = (t === T_DOORC || t === T_DOORO || t === T_CHEST || t === T_BED) && reachOk(tx, ty);
    if (!interactive) for (const nn of npcs)
      if (Math.abs(nn.x - (tx + 0.5)) < 1 && Math.abs(nn.y - 1 - (ty + 0.5)) < 1.4 && reachOk(tx, ty)) interactive = true;
    if (interactive) { interactAt(tx, ty); return; }
  }
  IN.mDown = 1;
  if (state === 'play' && P.useT <= 0 && !P.dead) usePrimary();
});
cv.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'touch') {
    for (const k of ['left', 'right', 'jump', 'down']) if (IN['t_' + k] === e.pointerId) IN['t_' + k] = 0;
    applyTouchKeys();
  }
  IN.mDown = 0;
});
cv.addEventListener('pointercancel', (e) => {
  for (const k of ['left', 'right', 'jump', 'down']) if (IN['t_' + k] === e.pointerId) IN['t_' + k] = 0;
  applyTouchKeys();
  IN.mDown = 0;
});
function applyTouchKeys() {
  IN.left = IN.t_left ? 1 : 0; IN.right = IN.t_right ? 1 : 0;
  IN.jump = IN.t_jump ? 1 : 0; IN.down = IN.t_down ? 1 : 0;
}
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = sign(e.deltaY);
  if (uiState.open) { uiState.craftScroll += dir; return; }
  uiState.hotbar = (uiState.hotbar + dir + 10) % 10;
}, { passive: false });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state === 'play') persistProgress(true);
});
window.addEventListener('pagehide', () => { if (state !== 'menu') persistProgress(true); });

// ── цикл ──
let last = 0, acc = 0, slowT = 0, sapT = 0;
const STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    acc -= STEP; steps++;
    stepWorld(STEP);
  }
  if (steps === 5) acc = 0;
  render();
}
function stepWorld(dt) {
  world.dt = dt;
  uiState.msgT = Math.max(0, uiState.msgT - dt);
  shakeT = Math.max(0, shakeT - dt * 2);
  if (state === 'menu') { world.time += dt * 3; return; } // в меню время летит для красоты
  if (state !== 'play') return;
  world.time += dt;
  updatePlayer(dt);
  updateFoes(dt);
  updateSpawner(dt);
  updateNpcs(dt);
  updateEntities(dt);
  if ((stepN++ & 1) === 0) updateLiquids();
  decayTileDmg(dt);
  // камера
  cam.x = lerp(cam.x, P.x, Math.min(1, dt * 8));
  cam.y = lerp(cam.y, P.y - 1.5, Math.min(1, dt * 8));
  // медленные тики
  slowT += dt;
  if (slowT >= 0.5) {
    slowT = 0;
    updateTutorial();
    // рекорд глубины → счёт
    const d0 = Math.floor(P.y - surf[clamp(Math.floor(P.x), 0, WORLD_W - 1)]);
    if (d0 > world.maxDepth) { addScore(d0 - world.maxDepth); world.maxDepth = d0; touchDirty(); }
    pushScore();
    // отошёл от сундука/торговца — панель закрывается
    if (uiState.chest != null) {
      const cx2 = uiState.chest % WORLD_W, cy2 = Math.floor(uiState.chest / WORLD_W);
      if (!reachOk(cx2, cy2)) { uiState.chest = null; if (uiState.open && uiState.cursor) closeInv(); }
    }
    if (uiState.shop) {
      let near = false;
      for (const nn of npcs) if (dist2(P.x, P.y, nn.x, nn.y) < 8 * 8) near = true;
      if (!near) uiState.shop = false;
    }
  }
  sapT += dt;
  if (sapT >= 6) { sapT = 0; updateSaplings(); }
  saveT += dt;
  if (saveT >= 20) { saveT = 0; persistProgress(false); }
}
let stepN = 0;

// ── загрузка ──
function boot() {
  resize();
  bootMs = performance.now();
  // локальный сейв (standalone/фолбэк)
  const local = tryLoadLocal();
  if (validSave(local)) { applySave(local); world.hasSave = true; }
  else { world.seed = (Math.random() * 2147483646 + 1) | 0; genWorld(world.seed); _bnCache = makeNoise1D(world.seed * 31 + 4, 40, 1); placePlayerAtSpawn(); giveStartItems(); }
  cam.x = P.x; cam.y = P.y - 2;
  preloadAssets().then(() => {
    send({ type: 'ready' });
    send({ type: 'sharky-progress-load' }); // облачный сейв перекроет локальный, если ответит
    booted = true;
  });
  requestAnimationFrame(frame);
}

// ── тест-хуки ──
window.CU = {
  P, world, foes, npcs, inv, equip, drops, projs, chests, flags, uiState, cam,
  gT, setTile, gLQ, setLiquid, gW, setWall, invAdd, invCount, invTake, coinTotal, coinAdd,
  shopBuy, shopSell, fellTree, spawnDrop, spawnFoe, trySummonBoss,
  buildSave, applySave, newWorld, startGame, stepWorld, encodeDiffs, DIFF,
  genWorld, surf, persistProgress, tryLoadLocal, craftList, doCraft, canCraft,
  usePrimary, interactAt, mouseTile, RECIPES, ITEMS, TILES, FOES, BOSSES, IN, UIR, uiClick, shopBuy,
  get state() { return state; }, set state(v) { state = v; },
  renderOnce() { render(); },
};

boot();

})();

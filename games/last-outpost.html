"right"},"mira":{"name":"Мира","color":"#ffd75e","img":"child","side":"left"},"sol":{"name":"Сол","color":"#c8a05a","img":"merchant","side":"right"},"guard":{"name":"Пим, караульный","color":"#9aa88a","img":"guard","side":"left"},"elder":{"name":"Старая Ани","color":"#c8b8a8","img":"elder","side":"left"}},"ends":{"union":"лучшая","exodus":"светлая","siege":"горькая","fall":"плохая"},"nodes":{"intro":{"bg":"bg_gate","text":"Застава-7. Последние огни Пепельной долины. Вчера умер старый смотритель — теперь ключи от ворот у тебя.","next":"intro2"},"intro2":{"bg":"bg_hall","who":"grey","text":"Плохое наследство, смотритель. Воды — на неделю. Лекарств — ноль. И у ворот уже стучат.","next":"gate1"},"gate1":{"bg":"bg_gate","who":"guard","text":"У ворот двое! Женщина с ребёнком и… рейдер. С меткой банды Харка. Кого впускать?!","choices":[{"text":"Впустить всех","goto":"let_all","set":["open_hand"],"aff":{"vera":1,"hark":1}},{"text":"Только женщину с ребёнком","goto":"let_civ","aff":{"vera":1,"hark":-1}},{"text":"Никого. Ворота на засов","goto":"let_none","set":["closed_gate"],"aff":{"vera":-1}}]},"let_all":{"bg":"bg_hall","who":"elder","text":"Спасибо, смотритель. Меня зовут Ани. А мальчик рейдера — он ранен, но живой. Харк такое помнит.","set":["saved_raider"],"next":"meet_vera"},"let_civ":{"bg":"bg_hall","who":"elder","text":"Спасибо… А тот, с меткой, ушёл в пыль. Не по себе мне: рейдеры не забывают закрытых ворот.","next":"meet_vera"},"let_none":{"bg":"bg_gate","text":"Ворота остались глухи. Ночью ветер донёс со стороны пустоши одинокий вой. Ты не спал до рассвета.","next":"meet_vera"},"meet_vera":{"bg":"bg_hall","who":"vera","text":"Смотритель. Я Вера, разведка. Насос сдох: вода уходит в песок. Есть два пути — и оба дрянь.","next":"water_choice"},"water_choice":{"bg":"bg_hall","who":"vera","text":"Старая станция в руинах — далеко, но безопасно. Или колодец на землях Харка — рядом, но это ЕГО земля.","choices":[{"text":"Идём к станции в руинах","goto":"waste_run","set":["station_path"]},{"text":"К колодцу Харка. Рискнём","goto":"well_run","set":["well_path"]}]},"waste_run":{"bg":"bg_waste","who":"vera","text":"Руины молчат. Насосный узел цел! Но тащить его — день пути, и мы как на ладони. Видишь блики на холме? За нами смотрят.","aff":{"vera":1},"set":["water_fixed"],"next":"mira_radio"},"well_run":{"bg":"bg_waste","who":"hark","text":"Стоять. Колодец мой, вода моя. Но я не зверь, смотритель. Мне нужен док: у моих — лихорадка. Услуга за услугу?","choices":[{"text":"Отдать дока на неделю","goto":"doc_deal","set":["water_fixed","doc_lent"],"aff":{"hark":2}},{"text":"Отказаться и уйти","goto":"no_deal","aff":{"hark":-2}}]},"doc_deal":{"bg":"bg_waste","who":"grey","text":"Неделя у рейдеров, значит… Ладно. Больные — везде больные. Но если что — вытащишь меня, смотритель.","set":["meds_channel"],"next":"mira_radio"},"no_deal":{"bg":"bg_waste","who":"vera","text":"Ушли ни с чем. Вода теперь — по кружке в день. Люди зашептались по углам. Плохо, смотритель.","set":["water_low"],"next":"mira_radio"},"mira_radio":{"bg":"bg_hall","who":"mira","text":"Дядя смотритель! Рация! Я слышала голос сквозь шум: «…семь… застава семь… идём…» Это к нам? Это хорошие?","choices":[{"text":"Починить рацию с Мирой","goto":"radio_fix","set":["radio_fixed"]},{"text":"Некогда. Стены важнее","goto":"radio_skip"}]},"radio_fix":{"bg":"bg_hall","who":"mira","text":"Ура! Смотри: если крутить вот тут… «Застава-7, это караван Севера. Ищем живых. Отзовитесь». Караван! Живые!","set":["north_signal"],"next":"sol_visit"},"radio_skip":{"bg":"bg_hall","who":"mira","text":"Мира кивнула и ушла к своей рации одна. Полночи из её угла сыпались помехи. Голос она так и не поймала.","next":"sol_visit"},"sol_visit":{"bg":"bg_market","who":"sol","text":"Смотрите, кто при ключах! Сол приполз с товаром: патроны, фильтры, сушёное мясо. Плачу за слухи. Ну и… карту ваших постов, а?","choices":[{"text":"Торговать честно, карту не давать","goto":"sol_fair","aff":{"vera":1}},{"text":"Продать карту постов","goto":"sol_map","set":["sold_map"]},{"text":"Выгнать торгаша","goto":"sol_kick","aff":{"hark":0}}]},"sol_fair":{"bg":"bg_market","who":"sol","text":"Жёстко, но честно. Уважаю. Держи фильтры — и бесплатный слух: кто-то с ТВОЕЙ заставы носит письма рейдерам.","set":["traitor_hint"],"next":"traitor_arc"},"sol_map":{"bg":"bg_market","who":"sol","text":"Приятно иметь дело! …Ты ведь понимаешь, что карту я перепродам? Ну, зато фильтров — вдвое. Не смотри так.","next":"traitor_arc"},"sol_kick":{"bg":"bg_market","who":"sol","text":"Зря-зря-зря. Сол не враг. Сол — зеркало: что принесёшь, то и увидишь… Дверь запомнил. Ухожу.","next":"traitor_arc"},"traitor_arc":{"bg":"bg_hall","who":"vera","text":"Худые вести. Кто-то сливает наши посты. Вчера сняли часового — точно знали, где слепая зона. Внутри крыса.","choices":[{"text":"[NG+] Это Пим. Я уже проживал это","goto":"traitor_ngplus","need":"ng+"},{"text":"Устроить засаду на переписку","goto":"trap_letters","set":["trap_set"]},{"text":"Собрать всех и спросить прямо","goto":"ask_direct"}]},"trap_letters":{"bg":"bg_gate","who":"vera","text":"Ночь. У тайника под стеной — тень. Пим! Караульный, тихоня… В письме — схема цистерн и подпись: «жду доли. П.»","set":["traitor_found"],"next":"pim_talk"},"ask_direct":{"bg":"bg_hall","who":"guard","text":"Все клянутся, глаза честные. Только Пим глядит в пол и мнёт шапку. Но пойди докажи… Ночью он исчез — и унёс схему цистерн.","set":["traitor_fled"],"next":"attack_eve"},"traitor_ngplus":{"bg":"bg_hall","who":"guard","text":"Пим побелел, как соль. «Откуда… откуда ты ЗНАЕШЬ?!» Схема цистерн выпала из-за пазухи. Взяли тёпленьким.","set":["traitor_found"],"aff":{"vera":2},"next":"pim_talk"},"pim_talk":{"bg":"bg_hall","who":"guard","text":"«Они держат моего брата! Харк сказал: схемы — или голова брата. Что мне было делать, смотритель?!»","choices":[{"text":"Простить. Использовать как двойного агента","goto":"pim_double","set":["double_agent"],"aff":{"vera":1}},{"text":"Изгнать из застав /* ============================================================
   SHARKY GAME ENGINE — universal core (core.js)
   ------------------------------------------------------------
   Общий слой для всех мини-игр ленты Sharky:
     • canvas + DPR + resize/layout
     • игровой цикл (loop/update/render)
     • ввод: pointer (tap/swipe) + клавиатура
     • звук (beep), частицы (burst)
     • загрузка base64-ассетов
     • тематический HUD (счёт + полоса таймера) и экран Game Over
     • ПРОТОКОЛ Sharky (postMessage): принимает init/start/pause,
       шлёт ready/score/gameover; автостарт ВНЕ ленты по таймеру.

   Игра = это ядро + один МОДУЛЬ-СЦЕНА (механика, регистрируется
   через Engine.register) + объект CONFIG (тема/правила/ассеты).
   Сборщик (build.js) встраивает все три части в один .html —
   игры в Sharky крутятся в sandbox-iframe через srcdoc, поэтому
   внешние <script> и относительные ассеты недопустимы.

   ── КОНТРАКТ СЦЕНЫ ──
   Engine.register('genre', function(engine, cfg){
     return {
       init(){},          // одноразовая настройка (ассеты+геометрия готовы)
       reset(){},         // (пере)собрать игровое состояние; на каждый запуск
       layout(L){},       // пересчёт геометрии из {W,H,headerH}
       update(dt){},      // продвинуть механику (таймер ведёт ЯДРО)
       render(ctx){},     // нарисовать поле (фон/HUD/оверлей рисует ЯДРО)
       pointerDown(p){},  // p = {x,y} в пикселях canvas
       pointerUp(e){},    // e = {x,y,downX,downY,dx,dy,dist,dir}
       pointerMove(p){},
       key(k){},          // k = event.key
     };
   });

   ── API ЯДРА для сцены (engine.*) ──
     ctx, W, H, headerH, cfg, theme, rules, score   (только чтение)
     img(name) -> HTMLImageElement
     beep(freq,dur,type,vol)
     burst(x,y,opts)                  // частицы (по умолчанию — как в match3)
     addScore(n) / setScore(v)        // меняет счёт + шлёт его в ленту
     gameOver()                       // завершить забег (смерть). Таймер тоже завершает.
     rr(x,y,w,h,r) / accent()         // помощники рисования
   ============================================================ */
(function (global) {
  'use strict';

  // ── canvas / контекст ──
  let cv, ctx;
  let W = 360, H = 580, headerH = 70, dpr = 1;

  // ── конфиг / сцена ──
  let cfg = null, theme = {}, rules = {}, scene = null;

  // ── состояние забега ──
  let state = 'loading';            // loading | playing | over
  let running = false, raf = 0, last = 0;
  let score = 0, best = 0, timeLeft = 0, duration = 0, timed = false;
  let assetsReady = false, pendingStart = false, gotShell = false;
  let savedState = null;            // прогресс, присланный лентой в init (или null)

  // ── ассеты ──
  const IMG = {}; let imgTotal = 0, imgLoaded = 0;

  // ── звук ──
  let audioCtx = null;

  // ── частицы ──
  const parts = [];

  // ── ввод ──
  let downX = 0, downY = 0, hasDown = false;
  const pointers = {};        // pointerId → {x,y} точки нажатия (мультитач)
  const keys = new Set();     // зажатые клавиши (для платформеров и т.п.)
  const GAME_KEYS = [' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

  /* ═══════════ CONTROLS: универсальный слой управления (CONFIG.controls) ═══════════
     Все схемы транслируются в ВИРТУАЛЬНЫЕ КЛАВИШИ → работают с любой сценой.
     controls = {
       scheme: 'joystick' | 'tapmove' | 'tapaction' | 'aim' | null(=только кнопки),
       joystick: { side:'left', radius:0.09, deadzone:0.3 },
       tapAction: 'jump',                     — что делает тап (схема tapaction)
       aim: { fire:'attack' | false },        — держишь палец/мышь = огонь в ту сторону
       buttons: [ {glyph:'▲', action:'jump'} | {glyph:'✕', key:'x'} … ]  — программируемые
     }
     Действие → клавиша: */
  const ACT2KEY = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown',
    jump: ' ', attack: 'x', fire: 'x', dash: 'c', hook: 'v', slow: 'g', swap: 'q', map: 'm', bomb: 'x', undo: 'z' };
  const CTL = { axis: { x: 0, y: 0 }, aim: { x: 0, y: 0, active: false }, mouse: { x: 0, y: 0 },
    playerScreen: null, scheme: null };
  let ctlCfg = null, ctlBtns = [], joy = null, tapTarget = null, ctlHeld = {};
  function actKey(b) { return b.key || ACT2KEY[b.action] || ' '; }
  function ctlPress(key) { if (!keys.has(key)) { keys.add(key); if (scene && scene.key) scene.key(key); } }
  function ctlRelease(key) { keys.delete(key); }
  function initControls(c) {
    ctlCfg = c || null;
    if (!ctlCfg) return;
    CTL.scheme = ctlCfg.scheme || null;
    layoutCtlButtons();
  }
  function layoutCtlButtons() {
    ctlBtns = [];
    if (!ctlCfg || !ctlCfg.buttons) return;
    const r = Math.min(W, H) * 0.075, m = r * 0.7;
    for (let i = 0; i < ctlCfg.buttons.length; i++) {
      const b = ctlCfg.buttons[i];
      // свои координаты (в долях экрана) или авто-дуга справа снизу
      const x = b.x != null ? b.x * W : W - m - r - (i % 2) * (r * 2.3);
      const y = b.y != null ? b.y * H : H - m - r - Math.floor(i / 2) * (r * 2.3);
      ctlBtns.push({ x: x, y: y, r: b.r ? b.r * Math.min(W, H) : r, glyph: b.glyph || '●', key: actKey(b), id: i });
    }
  }
  function ctlDown(p) {   // true = событие съедено слоем управления
    if (!ctlCfg) return false;
    for (let i = 0; i < ctlBtns.length; i++) {
      const b = ctlBtns[i];
      if ((p.x - b.x) * (p.x - b.x) + (p.y - b.y) * (p.y - b.y) <= b.r * b.r * 1.45) {
        ctlHeld[p.id] = b.key; ctlPress(b.key); return true;
      }
    }
    const sch = CTL.scheme;
    if (sch === 'joystick') {
      const side = (ctlCfg.joystick && ctlCfg.joystick.side) || 'left';
      const inZone = side === 'any' || (side === 'left' ? p.x < W * 0.55 : p.x > W * 0.45);
      if (inZone && !joy) { joy = { id: p.id, cx: p.x, cy: p.y }; return true; }
      return false;
    }
    if (sch === 'tapmove') { tapTarget = { x: p.x, y: p.y, id: p.id }; return true; }
    if (sch === 'tapaction') {
      const key = ACT2KEY[ctlCfg.tapAction || 'jump'] || ' ';
      ctlHeld[p.id] = key; ctlPress(key); return true;
    }
    if (sch === 'aim') {
      CTL.aim.x = p.x; CTL.aim.y = p.y; CTL.aim.active = true;
      const f = ctlCfg.aim && ctlCfg.aim.fire;
      if (f !== false) { ctlHeld[p.id] = ACT2KEY[f || 'attack'] || 'x'; ctlPress(ctlHeld[p.id]); }
      return true;
    }
    return false;
  }
  function ctlMove(p) {
    CTL.mouse.x = p.x; CTL.mouse.y = p.y;
    if (!ctlCfg) return;
    if (joy && p.id === joy.id) {
      const R = ((ctlCfg.joystick && ctlCfg.joystick.radius) || 0.09) * Math.min(W, H);
      const dz = (ctlCfg.joystick && ctlCfg.joystick.deadzone) || 0.3;
      let dx = (p.x - joy.cx) / R, dy = (p.y - joy.cy) / R;
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      CTL.axis.x = dx; CTL.axis.y = dy;
      joy.dx = dx; joy.dy = dy;
      // 8-way → клавиши
      (dx < -dz ? ctlPress : ctlRelease)('ArrowLeft');
      (dx > dz ? ctlPress : ctlRelease)('ArrowRight');
      (dy < -dz ? ctlPress : ctlRelease)('ArrowUp');
      (dy > dz ? ctlPress : ctlRelease)('ArrowDown');
    }
    if (CTL.scheme === 'aim' && CTL.aim.active) { CTL.aim.x = p.x; CTL.aim.y = p.y; }
    if (CTL.scheme === 'tapmove' && tapTarget && p.id === tapTarget.id) { tapTarget.x = p.x; tapTarget.y = p.y; }
  }
  function ctlUp(p) {
    if (!ctlCfg) return false;
    let ate = false;
    if (ctlHeld[p.id]) { ctlRelease(ctlHeld[p.id]); delete ctlHeld[p.id]; ate = true; }
    if (joy && p.id === joy.id) {
      joy = null; CTL.axis.x = 0; CTL.axis.y = 0;
      ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(ctlRelease);
      ate = true;
    }
    if (CTL.scheme === 'aim') { CTL.aim.active = false; ate = true; }
    if (CTL.scheme === 'tapmove' && tapTarget && p.id === tapTarget.id) { tapTarget = null; ate = true; }
    return ate;
  }
  // tap-to-move: каждый кадр сравниваем цель с экранной позицией персонажа
  // (сцена сообщает её через engine.reportPlayerScreen)
  function ctlUpdate() {
    if (!ctlCfg || CTL.scheme !== 'tapmove') return;
    if (!tapTarget || !CTL.playerScreen) {
      if (!tapTarget) { ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(ctlRelease); }
      return;
    }
    const px = CTL.playerScreen.x, py = CTL.playerScreen.y;
    const dx = tapTarget.x - px, dy = tapTarget.y - py;
    const dead = Math.min(W, H) * 0.04;
    (dx < -dead ? ctlPress : ctlRelease)('ArrowLeft');
    (dx > dead ? ctlPress : ctlRelease)('ArrowRight');
    (dy < -dead * 2.2 ? ctlPress : ctlRelease)('ArrowUp');     // вверх — с большим порогом (прыжок/лестницы)

    engine.addScore(100);
    ngPlus++; ngFlags = Object.assign({}, ngFlags, flags);   // NG+: флаги в наследство
    engine.gameOver({ label: (nd.endLabel || 'КОНЕЦ: ' + nd.end) });
  }

  return {
    init: function () {},
    reset: function () {
      aff = {}; flags = Object.assign({}, ngFlags); seen = {}; log = []; overlay = null;
      if (ngPlus > 0) flags['ng+'] = true;
      enter(N.start || Object.keys(NODES)[0]);
    },
    layout: function (L) { W = L.W; H = L.H; },

    update: function (dt) { typing += dt * 40; },

    render: function (ctx) {
      const nd = NODES[cur]; if (!nd) return;
      // фон: ассет или цвет
      const bgImg = nd.bg && engine.img(nd.bg);
      if (bgImg && bgImg.complete && bgImg.naturalWidth) {
        const sc = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
        ctx.drawImage(bgImg, 0, 0, bgImg.naturalWidth * sc, bgImg.naturalHeight * sc);
      } else if (nd.bg && nd.bg[0] === '#') { ctx.fillStyle = nd.bg; ctx.fillRect(0, 0, W, H); }

      // портрет говорящего (data-gated: chars[who].img)
      const chIm = nd.who && CHARS[nd.who];
      if (chIm && chIm.img) {
        const im = engine.img(chIm.img);
        if (im && im.complete && im.naturalWidth) {
          const bH = H * 0.3, bY = H - bH - 14;
          const ph = Math.min(H * 0.42, bY - 24);
          const pw = ph * (im.naturalWidth / im.naturalHeight);
          const pxX = chIm.side === 'left' ? 14 : W - pw - 14;
          ctx.save(); ctx.imageSmoothingEnabled = false;
          ctx.drawImage(im, pxX, bY - ph + 8, pw, ph);
          ctx.restore();
        }
      }

      // NG+ бейдж
      if (ngPlus > 0) {
        ctx.fillStyle = 'rgba(255,215,94,0.9)'; ctx.font = 'bold 12px ' + FONT;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('NG+' + ngPlus, 12, 10);
      }

      // текстовое окно
      const boxH = H * 0.3, boxY = H - boxH - 14;
      ctx.fillStyle = 'rgba(10,10,24,0.85)';
      engine.rr(10, boxY, W - 20, boxH, 12); ctx.fill();
      ctx.strokeStyle = engine.accent(); ctx.lineWidth = 1.5;
      engine.rr(10, boxY, W - 20, boxH, 12); ctx.stroke();
      // имя говорящего
      const ch = nd.who && CHARS[nd.who];
      if (ch) {
        ctx.fillStyle = ch.color || engine.accent();
        ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(ch.name || nd.who, 24, boxY + 10);
      }
      // текст с печатанием и переносами
      ctx.fillStyle = '#fff'; ctx.font = '14px ' + FONT; ctx.textAlign = 'left';
      const shown = nd.text.slice(0, Math.floor(typing));
      const words = shown.split(' ');
      let line = '', ty = boxY + (ch ? 34 : 14);
      for (let i = 0; i < words.length; i++) {
        const t2 = line + (line ? ' ' : '') + words[i];
        if (ctx.measureText(t2).width > W - 48) { ctx.fillText(line, 24, ty); ty += 19; line = words[i]; }
        else line = t2;
      }
      ctx.fillText(line, 24, ty);
      // индикатор «дальше»
      if (typing >= nd.text.length && !nd.choices && !nd.end) {
        ctx.fillStyle = engine.accent();
        ctx.beginPath();
        const bx2 = W - 34, by2 = H - 34 + Math.sin(Date.now() / 250) * 2;
        ctx.moveTo(bx2, by2); ctx.lineTo(bx2 + 10, by2); ctx.lineTo(bx2 + 5, by2 + 8); ctx.closePath(); ctx.fill();
      }

      // выборы
      choiceRects = [];
      if (typing >= nd.text.length && nd.choices) {
        const list = nd.choices.filter(choiceOk);
        const chH = 40, gap = 10;
        let cy = boxY - list.length * (chH + gap) - 8;
        for (let i = 0; i < list.length; i++) {
          const c = list[i];
          ctx.fillStyle = 'rgba(30,34,66,0.94)'; engine.rr(20, cy, W - 40, chH, 10); ctx.fill();
          ctx.strokeStyle = engine.accent(); ctx.lineWidth = 1.5; engine.rr(20, cy, W - 40, chH, 10); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(c.text, W / 2, cy + chH / 2 + 1);
          choiceRects.push({ x: 20, y: cy, w: W - 40, h: chH, c: c });
          cy += chH + gap;
        }
      }

      // мини-кнопки: журнал и галерея
      ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('📖', W - 26, 22); ctx.fillText('🖼', W - 58, 22);

      // оверлеи: журнал / галерея
      if (overlay === 'log') {
        ctx.fillStyle = 'rgba(5,5,14,0.94)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('ЖУРНАЛ (тап — закрыть)', W / 2, 14);
        ctx.font = '12px ' + FONT; ctx.textAlign = 'left';
        let ly = 44;
        for (let i = Math.max(0, log.length - 16); i < log.length; i++) {
          const e2 = log[i], nm = e2.who && CHARS[e2.who] ? CHARS[e2.who].name + ': ' : '';
          ctx.fillStyle = e2.who && CHARS[e2.who] ? (CHARS[e2.who].color || '#ffd75e') : 'rgba(255,255,255,0.7)';
          const txt = nm + e2.text;
          ctx.fillText(txt.length > 52 ? txt.slice(0, 52) + '…' : txt, 16, ly);
          ly += 18;
        }
      } else if (overlay === 'gallery') {
        ctx.fillStyle = 'rgba(5,5,14,0.94)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('ГАЛЕРЕЯ CG (тап — закрыть)', W / 2, 14);
        const keys = Object.keys(gallery);
        const cw2 = (W - 60) / 3;
        for (let i = 0; i < keys.length; i++) {
          const gx = 20 + (i % 3) * (cw2 + 10), gy = 50 + Math.floor(i / 3) * (cw2 * 0.7 + 10);
          const im = engine.img(keys[i]);
          if (im && im.complete && im.naturalWidth) ctx.drawImage(im, gx, gy, cw2, cw2 * 0.7);
          else { ctx.fillStyle = keys[i][0] === '#' ? keys[i] : '#334'; ctx.fillRect(gx, gy, cw2, cw2 * 0.7); }
          ctx.strokeStyle = '#889'; ctx.strokeRect(gx, gy, cw2, cw2 * 0.7);
        }
      }
    },

    hud: function () {},   // всё в render

    pointerDown: function (p) {
      if (overlay) { overlay = null; return; }
      // мини-кнопки
      if (p.y < 38 && p.x > W - 42) { overlay = 'log'; return; }
      if (p.y < 38 && p.x > W - 74 && p.x <= W - 42) { overlay = 'gallery'; return; }
      const nd = NODES[cur]; if (!nd) return;
      if (typing < nd.text.length) { typing = nd.text.length; return; }   // раскрыть текст
      // выбор
      for (let i = 0; i < choiceRects.length; i++) {
        const r = choiceRects[i];
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { pickChoice(r.c); return; }
      }
      if (nd.choices) return;              // ждём выбора
      if (nd.end) { finishEnd(nd); return; }
      if (nd.next) enter(nd.next);
    },

    _state: function () {
      return { cur: cur, aff: Object.assign({}, aff), flags: Object.assign({}, flags),
        seenN: Object.keys(seen).length, logN: log.length, galleryN: Object.keys(gallery).length,
        ngPlus: ngPlus, overlay: overlay,
        choices: (NODES[cur] && NODES[cur].choices) ? NODES[cur].choices.filter(choiceOk).map(c => c.text) : [] };
    },
    _tap: function (x, y) { this.pointerDown({ x: x, y: y, id: 1 }); },
    _typeDone: function () { const nd = NODES[cur]; if (nd) typing = nd.text.length; },
  };
});

Engine.boot(CONFIG);
</script></body></html>

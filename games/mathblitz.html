<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root{--ac:#00e5d4;--bg:#06100f}
*{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:#f2f2f4;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
.wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(340px,92vw)}
#expr{font-size:clamp(40px,13vw,60px);font-weight:700;letter-spacing:-2px;line-height:1;text-align:center}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{padding:14px;border-radius:10px;border:1.5px solid rgba(0,229,212,.25);background:rgba(0,229,212,.06);color:#f2f2f4;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;transition:background .1s,transform .1s}
.opt:active{transform:scale(.92)}
#tbar{position:fixed;bottom:0;left:0;height:3px;background:var(--ac);width:100%;z-index:5}
#ov{position:fixed;inset:0;background:rgba(6,6,8,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(6px);z-index:99}
#ov.show{display:flex}
.ovl{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.45}
#ovn{font-size:clamp(58px,18vw,90px);font-weight:700;color:var(--ac);line-height:1;letter-spacing:-3px}
.ovbtns{display:flex;gap:10px;margin-top:10px}
.obtn{padding:12px 26px;border-radius:10px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
#br{background:var(--ac);color:#000}#bn{background:rgba(255,255,255,.1);color:#f2f2f4;border:1px solid rgba(255,255,255,.12)}
</style></head><body>
<div class="wrap"><div id="expr">3 + 4</div><div id="opts"></div></div>
<div id="tbar"></div>
<div id="ov">
  <div class="ovl">правильно</div><div id="ovn">0</div><div class="ovl">из 30 сек</div>
  <div class="ovbtns"><button class="obtn" id="br">Ещё раз</button><button class="obtn" id="bn">Дальше →</button></div>
</div>
<script>
window.addEventListener('message',e=>{
  if(e.data.type==='init'){if(e.data.accent)document.documentElement.style.setProperty('--ac',e.data.accent);if(e.data.bg)document.body.style.background=e.data.bg;}
  if(e.data.type==='start'){hidOv();start();}
});
window.addEventListener('load',()=>{parent.postMessage({type:'ready'},'*');setTimeout(start,100);});
function sc(n){parent.postMessage({type:'score',value:n},'*');}
function hidOv(){document.getElementById('ov').classList.remove('show');}
document.getElementById('br').onclick=()=>{hidOv();start();};
document.getElementById('bn').onclick=()=>parent.postMessage({type:'next'},'*');

let score=0,tl=30,tick;
function start(){
  score=0;tl=30;sc(0);
  const bar=document.getElementById('tbar');bar.style.transition='none';bar.style.width='100%';
  clearInterval(tick);tick=setInterval(()=>{tl--;if(tl<=0){clearInterval(tick);document.getElementById('ovn').textContent=score;document.getElementById('ov').classList.add('show');parent.postMessage({type:'gameover',value:score},'*');}},1000);
  requestAnimationFrame(()=>{bar.style.transition='width 30s linear';bar.style.width='0%';});
  nextQ();
}
function nextQ(){
  const ops=['+','-','×'],op=ops[Math.floor(Math.random()*3)];
  let a,b,ans;
  if(op==='+'){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*50)+1;ans=a+b;}
  else if(op==='-'){a=Math.floor(Math.random()*50)+20;b=Math.floor(Math.random()*a)+1;ans=a-b;}
  else{a=Math.floor(Math.random()*11)+2;b=Math.floor(Math.random()*11)+2;ans=a*b;}
  document.getElementById('expr').textContent=`${a} ${op} ${b}`;
  const opts=new Set([ans]);while(opts.size<4){const w=ans+Math.floor(Math.random()*20)-10;if(w!==ans&&w>0)opts.add(w);}
  const g=document.getElementById('opts');g.innerHTML='';
  [...opts].sort(()=>Math.random()-.5).forEach(v=>{
    const b=document.createElement('button');b.className='opt';b.textContent=v;
    b.addEventListener('click',()=>{
      if(v===ans){score++;sc(score);b.style.background='rgba(0,229,160,.25)';}else{b.style.background='rgba(255,60,95,.25)';}
      setTimeout(nextQ,200);
    });
    g.appendChild(b);
  });
}
</script></body></html>

<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root{--ac:#00e5a0;--bg:#070e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:#f2f2f4;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-font-smoothing:antialiased}
#box{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;transition:background .2s}
.big{font-size:clamp(52px,16vw,80px);line-height:1}
.sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.5}
#ov{position:fixed;inset:0;background:rgba(6,6,8,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(6px);z-index:99}
#ov.show{display:flex}
.ovl{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.45}
#ovn{font-size:clamp(58px,18vw,90px);font-weight:700;color:var(--ac);line-height:1;letter-spacing:-3px}
.ovbtns{display:flex;gap:10px;margin-top:10px}
.obtn{padding:12px 26px;border-radius:10px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
#br{background:var(--ac);color:#000}#bn{background:rgba(255,255,255,.1);color:#f2f2f4;border:1px solid rgba(255,255,255,.12)}
</style></head><body>
<div id="box"><div class="big" id="ico">👆</div><div class="sub" id="sub">Жди зелёного</div></div>
<div id="ov">
  <div class="ovl">время реакции</div><div id="ovn">0</div><div class="ovl">мс</div>
  <div class="ovbtns"><button class="obtn" id="br">Ещё раз</button><button class="obtn" id="bn">Дальше →</button></div>
</div>
<script>
window.addEventListener('message',e=>{
  if(e.data.type==='init'){if(e.data.accent)document.documentElement.style.setProperty('--ac',e.data.accent);if(e.data.bg)document.body.style.background=e.data.bg;}
  if(e.data.type==='start'){hidOv();setState('wait');}
});
window.addEventListener('load',()=>{parent.postMessage({type:'ready'},'*');setTimeout(()=>setState('wait'),100);});
function sc(n){parent.postMessage({type:'score',value:n},'*');}
function hidOv(){document.getElementById('ov').classList.remove('show');}
document.getElementById('br').onclick=()=>{hidOv();setState('wait');};
document.getElementById('bn').onclick=()=>parent.postMessage({type:'next'},'*');

let state='wait',t0=0,tid=null;
const box=document.getElementById('box'),ico=document.getElementById('ico'),sub=document.getElementById('sub');
function setState(s){
  state=s;clearTimeout(tid);
  if(s==='wait'){box.style.background='#12121c';ico.textContent='🔴';sub.textContent='Жди…';
    tid=setTimeout(()=>setState('go'),1500+Math.random()*3000);}
  else if(s==='go'){box.style.background='#061a0e';ico.innerHTML=`<span style="color:var(--ac)">🟢</span>`;sub.textContent='ЖМЯК!';t0=performance.now();}
  else if(s==='early'){box.style.background='#1a0608';ico.textContent='❌';sub.textContent='Слишком рано!';
    setTimeout(()=>setState('wait'),1200);}
}
function click(){
  if(state==='wait'){setState('early');return;}
  if(state==='go'){const ms=Math.round(performance.now()-t0);sc(ms);document.getElementById('ovn').textContent=ms;document.getElementById('ov').classList.add('show');parent.postMessage({type:'gameover',value:ms},'*');state='done';}
}
box.addEventListener('click',click);
box.addEventListener('touchend',e=>{e.preventDefault();click();},{passive:false});
</script></body></html>

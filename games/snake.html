<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root{--ac:#00e5a0;--bg:#070e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);touch-action:none;user-select:none}
canvas{display:block}
#dpad{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:5px;z-index:5}
.dp{width:44px;height:44px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#f2f2f4;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.dp:active{background:rgba(255,255,255,.18)}
#ov{position:fixed;inset:0;background:rgba(6,6,8,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(6px);z-index:99}
#ov.show{display:flex}
.ovl{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.45;color:#f2f2f4}
#ovn{font-size:clamp(58px,18vw,90px);font-weight:700;color:var(--ac);line-height:1;letter-spacing:-3px}
.ovbtns{display:flex;gap:10px;margin-top:10px}
.obtn{padding:12px 26px;border-radius:10px;border:none;font-family:system-ui,sans-serif;font-size:14px;font-weight:700;cursor:pointer}
#br{background:var(--ac);color:#000}#bn{background:rgba(255,255,255,.1);color:#f2f2f4;border:1px solid rgba(255,255,255,.12)}
</style></head><body>
<canvas id="c"></canvas>
<div id="dpad">
  <div></div><div class="dp" id="du">↑</div><div></div>
  <div class="dp" id="dl">←</div><div class="dp" id="dd">↓</div><div class="dp" id="dr">→</div>
</div>
<div id="ov">
  <div class="ovl">счёт</div><div id="ovn">0</div><div class="ovl">очков</div>
  <div class="ovbtns"><button class="obtn" id="br">Ещё раз</button><button class="obtn" id="bn">Дальше →</button></div>
</div>
<script>
window.addEventListener('message',e=>{
  if(e.data.type==='init'){if(e.data.accent)document.documentElement.style.setProperty('--ac',e.data.accent);if(e.data.bg)document.body.style.background=e.data.bg;}
  if(e.data.type==='start'){hidOv();start();}
  if(e.data.type==='pause'){running=false;cancelAnimationFrame(raf);}
});
window.addEventListener('load',()=>{parent.postMessage({type:'ready'},'*');setTimeout(start,100);});
function sc(n){parent.postMessage({type:'score',value:n},'*');}
function hidOv(){document.getElementById('ov').classList.remove('show');}
document.getElementById('br').onclick=()=>{hidOv();start();};
document.getElementById('bn').onclick=()=>parent.postMessage({type:'next'},'*');

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let CELL,COLS,ROWS,W,H,snake,dir,nextDir,food,score,running=false,raf,lastT=0;
const SPD=140;

function start(){
  const dpadH=document.getElementById('dpad').offsetHeight+28;
  W=window.innerWidth;H=window.innerHeight-dpadH;
  CELL=Math.max(14,Math.floor(Math.min(W,H)/16));
  COLS=Math.floor(W/CELL);ROWS=Math.floor(H/CELL);
  canvas.width=W;canvas.height=H;
  snake=[{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)},{x:Math.floor(COLS/2)-1,y:Math.floor(ROWS/2)},{x:Math.floor(COLS/2)-2,y:Math.floor(ROWS/2)}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;running=true;sc(0);placeFood();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function placeFood(){do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function loop(ts){if(!running)return;if(ts-lastT>SPD){lastT=ts;update();draw();}raf=requestAnimationFrame(loop);}
function update(){
  dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){end();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;sc(score);placeFood();}else snake.pop();
}
function draw(){
  ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#14141e';ctx.lineWidth=.4;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(W,j*CELL);ctx.stroke();}
  ctx.fillStyle='#ff3c5f';ctx.shadowColor='#ff3c5f';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  snake.forEach((s,i)=>{const t=1-i/snake.length;ctx.fillStyle=i===0?'#00e5a0':`rgba(0,229,160,${.25+t*.5})`;ctx.shadowColor=i===0?'#00e5a0':'transparent';ctx.shadowBlur=i===0?7:0;ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);});
  ctx.shadowBlur=0;
}
function end(){running=false;cancelAnimationFrame(raf);document.getElementById('ovn').textContent=score;document.getElementById('ov').classList.add('show');parent.postMessage({type:'gameover',value:score},'*');}

// Controls
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0};
  if(e.key==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};
  if(e.key==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};
  if(e.key==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};
});
document.getElementById('du').addEventListener('click',()=>{if(dir.y!==1)nextDir={x:0,y:-1};});
document.getElementById('dd').addEventListener('click',()=>{if(dir.y!==-1)nextDir={x:0,y:1};});
document.getElementById('dl').addEventListener('click',()=>{if(dir.x!==1)nextDir={x:-1,y:0};});
document.getElementById('dr').addEventListener('click',()=>{if(dir.x!==-1)nextDir={x:1,y:0};});
let ts0={x:0,y:0};
document.addEventListener('touchstart',e=>{ts0={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-ts0.x,dy=e.changedTouches[0].clientY-ts0.y;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>20&&dir.x!==-1)nextDir={x:1,y:0};if(dx<-20&&dir.x!==1)nextDir={x:-1,y:0};}
  else{if(dy>20&&dir.y!==-1)nextDir={x:0,y:1};if(dy<-20&&dir.y!==1)nextDir={x:0,y:-1};}
},{passive:true});
</script></body></html>

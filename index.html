<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sharky</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060608; --border:rgba(255,255,255,.07);
  --a1:#ff3c5f; --a2:#00e5a0; --a3:#ffe44d; --a4:#7b5cff;
  --text:#f2f2f4; --sub:rgba(242,242,244,.45);
  --fd:'Space Grotesk',sans-serif; --fm:'Space Mono',monospace;
  --nav:58px;
  --vh: var(--tg-viewport-stable-height, 100dvh);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;max-height:var(--vh);background:var(--bg);font-family:var(--fd);color:var(--text);overflow:hidden;touch-action:none;-webkit-font-smoothing:antialiased}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:500;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.ld-logo{font-family:var(--fd);font-size:42px;font-weight:700;letter-spacing:-2px}
.ld-logo span{color:var(--a1)}
.ld-dots{display:flex;gap:8px}
.ld-dot{width:8px;height:8px;border-radius:50%;background:var(--a1);animation:ldpulse 1.2s ease-in-out infinite}
.ld-dot:nth-child(2){animation-delay:.2s;background:var(--a2)}
.ld-dot:nth-child(3){animation-delay:.4s;background:var(--a4)}
@keyframes ldpulse{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── DECK ── */
#deck{position:fixed;top:0;left:0;right:0;bottom:var(--nav);height:calc(var(--vh) - var(--nav))}
.card{position:absolute;inset:0;display:grid;grid-template-columns:1fr 56px;transition:transform .44s cubic-bezier(.77,0,.18,1),opacity .44s;will-change:transform}
.card.above{transform:translateY(-100%);opacity:0;pointer-events:none}
.card.active{transform:translateY(0);opacity:1}
.card.below{transform:translateY(100%);opacity:0;pointer-events:none}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;z-index:2;background:var(--card-ac,#ff3c5f)}

/* ── GAME COLUMN ── */
.game-col{grid-column:1;display:flex;flex-direction:column;justify-content:flex-start;padding:14px 0 14px 14px;gap:9px;min-width:0;height:100%}
.hud{display:flex;align-items:baseline;justify-content:space-between;padding-right:10px;flex-shrink:0}
.hud-title{font-family:var(--fd);font-size:clamp(15px,4.5vw,21px);font-weight:700;letter-spacing:-.3px;line-height:1}
.hud-score{font-family:var(--fm);font-size:clamp(17px,5vw,23px);font-weight:700;line-height:1;min-width:40px;text-align:right}
.arena{flex:1;min-height:0;width:100%;border-radius:14px;overflow:hidden;position:relative;margin-right:10px}
.arena iframe{width:100%;height:100%;border:none;display:block;border-radius:14px;background:transparent}

/* Loading skeleton inside arena */
.arena-loading{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0f0f14;border-radius:14px}
.arena-loading span{font-size:32px;animation:ldpulse 1.2s ease-in-out infinite}

/* ── SOCIAL SIDEBAR ── */
.social-col{grid-column:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 8px 0 0;position:relative;z-index:10}
.av-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;margin-bottom:8px;-webkit-tap-highlight-color:transparent;position:relative}
.av-ring{width:44px;height:44px;border-radius:50%;padding:2px;transition:transform .15s}
.av-wrap:active .av-ring{transform:scale(.9)}
.av-inner{width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.av-plus{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--a1);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-family:var(--fd);line-height:1;transition:background .2s}
.av-wrap.following .av-plus{background:var(--a2);font-size:9px}
.sb{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:5px 0;user-select:none}
.sb-icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:transform .12s,background .18s;position:relative;overflow:visible}
.sb:active .sb-icon{transform:scale(.85)}
.sb-icon svg{pointer-events:none;display:block}
.sb-count{font-family:var(--fm);font-size:10px;color:var(--sub);line-height:1;min-height:12px;letter-spacing:.3px}
.sb.liked .sb-icon{background:rgba(255,60,95,.18);border-color:rgba(255,60,95,.4)}
.sb.saved .sb-icon{background:rgba(255,228,77,.12);border-color:rgba(255,228,77,.35)}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.45)}55%{transform:scale(.88)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
.sb.pop .sb-icon{animation:heartPop .42s ease forwards}
.float-plus{position:absolute;top:-10px;right:-2px;font-family:var(--fd);font-size:12px;font-weight:700;color:var(--a1);pointer-events:none;animation:floatUp .65s ease forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-24px)}}

/* ── SWIPE HINT ── */
.swipe-hint{position:fixed;bottom:calc(var(--nav) + 12px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);animation:hintPulse 3s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.3;transform:translateX(-50%) translateY(0)}50%{opacity:.6;transform:translateX(-50%) translateY(-5px)}}

/* ── BOTTOM NAV ── */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:rgba(6,6,8,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;z-index:600;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.nav-tab:active{opacity:.7}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{transition:transform .2s}
.nav-tab.active .nav-icon svg{transform:scale(1.15)}
.nav-label{font-family:var(--fd);font-size:10px;font-weight:600;letter-spacing:.4px;color:var(--sub);transition:color .2s}
.nav-tab.active .nav-label{color:var(--text)}
.nav-tab.active::after{content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--a4)}

/* ── COMMENTS DRAWER ── */
#drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:140;opacity:0;pointer-events:none;transition:opacity .3s}
#drawer-backdrop.show{opacity:1;pointer-events:all}
#comments-drawer{position:fixed;bottom:0;left:0;right:0;height:68dvh;background:#0f0f14;border-radius:20px 20px 0 0;z-index:150;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);box-shadow:0 -6px 32px rgba(0,0,0,.55)}
#comments-drawer.open{transform:translateY(0)}
.d-handle{width:36px;height:4px;background:#2a2a34;border-radius:999px;margin:12px auto 0;flex-shrink:0;cursor:pointer}
.d-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 11px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.d-header h3{font-size:15px;font-weight:700}
.d-close{width:30px;height:30px;border-radius:50%;background:#1a1a22;border:none;color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.comments-list{flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.comments-list::-webkit-scrollbar{display:none}
.c-item{display:flex;gap:10px;align-items:flex-start}
.c-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:#1a1a22}
.c-body{flex:1}
.c-name{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);margin-bottom:3px}
.c-text{font-size:13px;line-height:1.45;color:rgba(255,255,255,.82)}
.c-like{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:2px 3px}
.c-like span{font-size:10px;color:var(--sub)}
.d-input-row{display:flex;gap:8px;padding:10px 14px 18px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;background:#0f0f14}
.d-input{flex:1;background:#1a1a22;border:1.5px solid rgba(255,255,255,.08);border-radius:999px;padding:9px 16px;color:var(--text);font-family:var(--fd);font-size:13px;outline:none;-webkit-appearance:none}
.d-input:focus{border-color:var(--a4)}
.d-send{width:40px;height:40px;border-radius:50%;background:var(--a4);border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.d-send:active{transform:scale(.88)}

/* ── AUTHOR PROFILE ── */
#profile-page{position:fixed;inset:0 0 var(--nav) 0;background:var(--bg);z-index:120;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);overflow:hidden}
#profile-page.open{transform:translateY(0)}
.prof-topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 11px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);z-index:2}
.prof-back-arrow{width:34px;height:34px;border-radius:50%;background:#161620;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;flex-shrink:0}
.prof-back-arrow:active{transform:scale(.88);background:#222230}
.prof-topbar-name{font-size:16px;font-weight:700;flex:1}
.prof-dots{width:34px;height:34px;border-radius:50%;background:#161620;border:none;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.prof-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.prof-scroll::-webkit-scrollbar{display:none}
.prof-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 20px 16px}
.prof-avatar-big{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 28px rgba(123,92,255,.35)}
.prof-username{font-size:20px;font-weight:700;letter-spacing:-.3px}
.prof-handle{font-size:12px;color:var(--sub);margin-top:-4px}
.prof-bio{padding:12px 24px 4px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.6);text-align:center}
.prof-stats{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.prof-stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 6px;border-right:1px solid var(--border)}
.prof-stat:last-child{border-right:none}
.prof-stat-n{font-family:var(--fd);font-size:19px;font-weight:700;line-height:1}
.prof-stat-l{font-family:var(--fm);font-size:10px;color:var(--sub);letter-spacing:.5px;text-transform:uppercase}
.prof-follow-btn{display:block;margin:14px 18px 6px;width:calc(100% - 36px);padding:13px;border-radius:10px;border:none;font-family:var(--fd);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,background .2s;letter-spacing:-.2px}
.prof-follow-btn:active{transform:scale(.97)}
.prof-follow-btn.following{background:#161620!important;color:var(--text)!important;border:1.5px solid rgba(255,255,255,.12)}
.prof-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:6px;position:sticky;top:0;background:var(--bg);z-index:3}
.prof-tab{flex:1;padding:11px;text-align:center;font-family:var(--fd);font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:color .18s,border-color .18s;letter-spacing:.3px}
.prof-tab.active{color:var(--text);border-bottom-color:var(--a4)}
.prof-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 14px 40px;align-content:start}
.prof-game-card{border-radius:12px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--border);transition:transform .13s;-webkit-tap-highlight-color:transparent}
.prof-game-card:active{transform:scale(.94)}
.pgc-emoji{font-size:32px;line-height:1}
.pgc-title{font-size:13px;font-weight:700;text-align:center;padding:0 6px;line-height:1.2}
.pgc-plays{font-family:var(--fm);font-size:10px;color:var(--sub)}
.pgc-tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);border-radius:999px;padding:2px 7px;font-family:var(--fm);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.prof-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 20px;color:var(--sub);font-size:13px;text-align:center}

/* ── USER PROFILE ── */
#user-profile-page{position:fixed;inset:0 0 var(--nav) 0;background:var(--bg);z-index:80;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);overflow:hidden}
#user-profile-page.open{transform:translateY(0)}
.uprof-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.uprof-topbar-title{font-size:17px;font-weight:700}
.uprof-settings{width:34px;height:34px;border-radius:50%;background:#161620;border:none;color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.uprof-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.uprof-scroll::-webkit-scrollbar{display:none}
.uprof-hero{display:flex;flex-direction:column;align-items:center;gap:9px;padding:22px 20px 16px}
.uprof-avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#3a2a6a,#6a1a3a);display:flex;align-items:center;justify-content:center;font-size:42px;border:3px solid #1a1a28;position:relative}
.uprof-edit-badge{position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;background:#222230;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.uprof-name{font-size:21px;font-weight:700;letter-spacing:-.3px}
.uprof-handle{font-size:12px;color:var(--sub);margin-top:-4px}
.uprof-bio-text{font-size:13px;color:rgba(255,255,255,.55);text-align:center;line-height:1.5;padding:0 20px}
.uprof-edit-btn{display:block;margin:4px 18px 0;width:calc(100% - 36px);padding:11px;border-radius:10px;background:#161620;border:1.5px solid rgba(255,255,255,.12);color:var(--text);font-family:var(--fd);font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;letter-spacing:-.2px}
.uprof-edit-btn:active{background:#1e1e2a}
.uprof-stats{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:14px}
.uprof-stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 6px;border-right:1px solid var(--border)}
.uprof-stat:last-child{border-right:none}
.uprof-stat-n{font-family:var(--fd);font-size:19px;font-weight:700;line-height:1}
.uprof-stat-l{font-family:var(--fm);font-size:10px;color:var(--sub);letter-spacing:.5px;text-transform:uppercase}
.uprof-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:6px;position:sticky;top:0;background:var(--bg);z-index:3}
.uprof-tab{flex:1;padding:11px;text-align:center;font-family:var(--fd);font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:color .18s,border-color .18s;letter-spacing:.3px}
.uprof-tab.active{color:var(--text);border-bottom-color:var(--a1)}
.uprof-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 14px 30px;align-content:start}
.uprof-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 20px;color:var(--sub);font-size:13px;text-align:center;line-height:1.6}
.uprof-empty-ico{font-size:38px}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--a2);color:#000;padding:9px 22px;border-radius:999px;font-family:var(--fd);font-size:13px;font-weight:700;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="loading">
  <div class="ld-logo">Shar<span>ky</span></div>
  <div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div>
</div>

<div id="toast"></div>
<div id="deck"></div>

<div id="bottom-nav">
  <div class="nav-tab active" id="nav-feed" onclick="switchNav('feed')">
    <div class="nav-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </div>
    <span class="nav-label">Лента</span>
  </div>
  <div class="nav-tab" id="nav-profile" onclick="switchNav('profile')">
    <div class="nav-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <span class="nav-label">Профиль</span>
  </div>
</div>

<!-- AUTHOR PROFILE -->
<div id="profile-page">
  <div class="prof-topbar">
    <button class="prof-back-arrow" id="prof-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="prof-topbar-name" id="prof-topbar-name">@sharky</div>
    <button class="prof-dots">⋯</button>
  </div>
  <div class="prof-scroll">
    <div class="prof-hero">
      <div class="prof-avatar-big" id="prof-avatar-wrap"><span id="prof-avatar-emoji">🕹️</span></div>
      <div class="prof-username" id="prof-username">Sharky</div>
      <div class="prof-handle" id="prof-handle">@sharky</div>
    </div>
    <div class="prof-stats">
      <div class="prof-stat"><div class="prof-stat-n" id="prof-following-n">12</div><div class="prof-stat-l">подписки</div></div>
      <div class="prof-stat"><div class="prof-stat-n" id="prof-followers-n">4.8K</div><div class="prof-stat-l">подписчики</div></div>
      <div class="prof-stat"><div class="prof-stat-n">—</div><div class="prof-stat-l">лайки</div></div>
    </div>
    <div class="prof-bio" id="prof-bio"></div>
    <button class="prof-follow-btn" id="prof-follow-btn" style="background:var(--a1);color:#fff">Подписаться</button>
    <div class="prof-tabs">
      <div class="prof-tab active" data-tab="games">🎮 Игры</div>
      <div class="prof-tab" data-tab="liked">❤️ Нравится</div>
    </div>
    <div class="prof-grid" id="prof-grid"></div>
  </div>
</div>

<!-- DRAWER BACKDROP -->
<div id="drawer-backdrop"></div>

<!-- COMMENTS DRAWER -->
<div id="comments-drawer">
  <div class="d-handle" id="d-handle"></div>
  <div class="d-header"><h3 id="comments-title">Комментарии</h3><button class="d-close" id="d-close">✕</button></div>
  <div class="comments-list" id="comments-list"></div>
  <div class="d-input-row">
    <input class="d-input" id="comment-input" placeholder="Написать комментарий…" maxlength="120">
    <button class="d-send" id="comment-send">↑</button>
  </div>
</div>

<!-- USER PROFILE -->
<div id="user-profile-page">
  <div class="uprof-topbar">
    <div class="uprof-topbar-title">Мой профиль</div>
    <button class="uprof-settings" onclick="toast('Настройки скоро')">⚙️</button>
  </div>
  <div class="uprof-scroll">
    <div class="uprof-hero">
      <div class="uprof-avatar">👤<div class="uprof-edit-badge">✏️</div></div>
      <div class="uprof-name">Игрок</div>
      <div class="uprof-handle">@player · Sharky</div>
      <div class="uprof-bio-text">Здесь будет твоё описание ✨</div>
    </div>
    <button class="uprof-edit-btn">Редактировать профиль</button>
    <div class="uprof-stats">
      <div class="uprof-stat"><div class="uprof-stat-n" id="uprof-following">0</div><div class="uprof-stat-l">подписки</div></div>
      <div class="uprof-stat"><div class="uprof-stat-n">0</div><div class="uprof-stat-l">подписчики</div></div>
      <div class="uprof-stat"><div class="uprof-stat-n" id="uprof-likes-total">0</div><div class="uprof-stat-l">лайки</div></div>
    </div>
    <div class="uprof-tabs">
      <div class="uprof-tab active" data-utab="liked">❤️ Лайки</div>
      <div class="uprof-tab" data-utab="saved">⭐ Избранное</div>
      <div class="uprof-tab" data-utab="mygames">🎮 Мои игры</div>
    </div>
    <div class="uprof-grid" id="uprof-grid"></div>
  </div>
</div>

<script>
// ══ TELEGRAM ══
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // requestFullscreen — новый API (Bot API 8.0+), убирает заголовок Telegram
  if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen();
  // Цвета под фон приложения
  tg.setHeaderColor?.('#060608');
  tg.setBackgroundColor?.('#060608');
  tg.setBottomBarColor?.('#060608');
  // Отключить системный свайп вниз — конфликтует с лентой игр
  tg.disableVerticalSwipes?.();
}
function updateVH() {
  const h = tg?.viewportStableHeight || tg?.viewportHeight;
  if (h) document.documentElement.style.setProperty('--tg-viewport-stable-height', h + 'px');
}
tg?.onEvent('viewportChanged', updateVH);
tg?.onEvent('fullscreenChanged', updateVH);
updateVH();

// ══ AUTHORS ══
const AUTHORS = {
  sharky:  { id:'sharky',  emoji:'🕹️', name:'Sharky',  handle:'@sharky',  role:'Оригинальные мини-игры', bio:'Мини-игры прямо в ленте 🎮\nСвайпай вверх — играй мгновенно.\nНовые игры каждую неделю ✨', followers:4800, following:12, gradient:'linear-gradient(135deg,#7b5cff,#ff3c5f)', ring:'linear-gradient(135deg,#7b5cff,#ff3c5f)', followed:false },
  pixelforge: { id:'pixelforge', emoji:'🧪', name:'PixelForge',  handle:'@pixelforge', role:'Игры на реакцию и логику', bio:'Делаю игры, которые ломают мозг 🧪\nСтруп, Саймон, скоростная математика.\nДля тех, кто хочет большего ⚡', followers:2300, following:8,  gradient:'linear-gradient(135deg,#00c6ff,#0072ff)', ring:'linear-gradient(135deg,#00c6ff,#0072ff)', followed:false },
  arcadelab:  { id:'arcadelab',  emoji:'🕹',  name:'ArcadeLab',  handle:'@arcadelab',  role:'Аркады нового поколения',  bio:'Классические аркады переосмыслены 🕹\nКроты, флаппи, коды.\nПросто и затягивает 🔥',              followers:3100, following:5,  gradient:'linear-gradient(135deg,#f7971e,#ffd200)', ring:'linear-gradient(135deg,#f7971e,#ffd200)', followed:false },
};

// ══ STATE ══
let GAMES = [], socialData = [];
let currentIdx = 0, profileOpen = false, currentAuthorId = 'sharky', activeProfTab = 'games', activeNav = 'feed', activeUTab = 'liked', activeDrawerGame = 0;

const deckEl = document.getElementById('deck');
const cardEls = [];
const iframes = []; // iframe refs per card index

// Preload window: load current + AHEAD ahead, BEHIND behind
const AHEAD = 2, BEHIND = 1;

// ══ MANIFEST ══
async function loadManifest() {
  const res = await fetch('./games/manifest.json');
  const data = await res.json();
  return data.games;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initSocialData(games) {
  const FAKE = [
    ["😂","Кринж_Лорд","Брат это шедевр 💀"],["🔥","pr0_gamer99","Реакция 198мс — я бог"],
    ["🎮","PixelKate","Змейку пройти невозможно"],["👾","n00b_slayer","Где хардмод??"],
    ["🌀","darkmode_only","Наконец-то не тикток"],["💎","speedrun_anna","31 тап за 20 сек, топ?"],
    ["⚡","gamer_dad42","Дети тоже залипли lol"],["🎯","xXMidnightXx","Память с первого раза 🧠"],
    ["😤","tapmaster_vl","Угадай с 3 попытки всегда"],["🚀","gg_ez_420","Больше игр давайте!!"],
  ];
  return games.map((_, gi) => {
    const d = { likes: Math.floor(Math.random()*800)+120, comments: [], liked: false, saved: false, shares: Math.floor(Math.random()*200)+20 };
    for (let k = 0; k < 3 + Math.floor(Math.random()*4); k++) {
      const fc = FAKE[(gi*3+k) % FAKE.length];
      d.comments.push({ avatar:fc[0], name:fc[1], text:fc[2], likes:Math.floor(Math.random()*40), liked:false });
    }
    return d;
  });
}

// ══ DECK BUILD ══
function buildDeck() {
  GAMES.forEach((g, i) => {
    const card = document.createElement('div');
    card.className = `card ${i===0?'active':'below'}`;
    card.style.background = g.bg;
    card.style.setProperty('--card-ac', g.accent); // drives ::before accent line

    // Game column
    const gameCol = document.createElement('div');
    gameCol.className = 'game-col';
    gameCol.innerHTML = `
      <div class="hud">
        <div class="hud-title" style="color:${g.accent}">${g.title}</div>
        <div class="hud-score" id="score-${i}" style="color:${g.accent}">0</div>
      </div>`;

    const arena = document.createElement('div');
    arena.className = 'arena';
    arena.id = `arena-${i}`;
    // Skeleton while iframe loads
    arena.innerHTML = `<div class="arena-loading"><span>${g.emoji}</span></div>`;
    gameCol.appendChild(arena);
    card.appendChild(gameCol);

    // Social column
    const socialCol = document.createElement('div');
    socialCol.className = 'social-col';
    socialCol.id = `scol-${i}`;
    socialCol.innerHTML = buildSocialHTML(i, g);
    card.appendChild(socialCol);

    deckEl.appendChild(card);
    cardEls.push(card);
    iframes.push(null); // placeholder
  });

  // Swipe hint
  const hint = document.createElement('div');
  hint.className = 'swipe-hint'; hint.id = 'swipe-hint';
  hint.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>свайп вверх`;
  document.body.appendChild(hint);
}

// ══ IFRAME MANAGEMENT ══
function preload(idx) {
  for (let i = Math.max(0, idx - BEHIND); i <= Math.min(GAMES.length - 1, idx + AHEAD); i++) {
    if (iframes[i]) continue; // already loaded
    const arena = document.getElementById(`arena-${i}`);
    if (!arena) continue;
    const g = GAMES[i];
    const iframe = document.createElement('iframe');
    iframe.src = g.src;
    iframe.allow = 'autoplay';
    iframe.setAttribute('scrolling', 'no');
    iframe.addEventListener('load', () => {
      // Clear skeleton, send init
      arena.querySelector('.arena-loading')?.remove();
      iframe.contentWindow?.postMessage({ type: 'init', accent: g.accent, bg: g.bg, scoreLabel: g.scoreLabel }, '*');
      // If this is current card, start immediately
      if (i === currentIdx) {
        iframe.contentWindow?.postMessage({ type: 'start' }, '*');
      }
    });
    arena.innerHTML = '';
    arena.appendChild(iframe);
    iframes[i] = iframe;
  }
}

// Listen for messages from game iframes
window.addEventListener('message', e => {
  const { type, value } = e.data;
  // Find which iframe sent this
  const idx = iframes.findIndex(f => f?.contentWindow === e.source);
  if (idx === -1) return;
  if (type === 'score') {
    const el = document.getElementById(`score-${idx}`);
    if (el) el.textContent = value;
  }
  if (type === 'gameover') { /* game shows its own overlay */ }
  if (type === 'next') { goTo(currentIdx + 1); }
  if (type === 'ready') {
    if (idx === currentIdx) {
      iframes[idx]?.contentWindow?.postMessage({ type: 'start' }, '*');
    }
  }
});

// ══ NAVIGATION ══
function goTo(idx) {
  const total = GAMES.length;
  if (idx >= total || idx < 0) {
    const target = idx >= total ? 0 : total - 1;
    const snap = idx >= total ? 'below' : 'above';
    cardEls.forEach(c => { c.style.transition = 'none'; c.className = `card ${snap}`; });
    void cardEls[0].offsetHeight;
    requestAnimationFrame(() => { cardEls.forEach(c => c.style.transition = ''); _goTo(target); });
    return;
  }
  _goTo(idx);
}

function _goTo(idx) {
  // Pause previous
  if (idx !== currentIdx && iframes[currentIdx]) {
    iframes[currentIdx].contentWindow?.postMessage({ type: 'pause' }, '*');
  }
  currentIdx = idx;
  cardEls.forEach((c, i) => {
    c.classList.remove('above','active','below');
    c.classList.add(i < idx ? 'above' : i === idx ? 'active' : 'below');
  });
  // Preload around new index
  preload(idx);
  // Start current if already loaded
  if (iframes[idx]) {
    iframes[idx].contentWindow?.postMessage({ type: 'start' }, '*');
  }
  tg?.HapticFeedback?.impactOccurred('light');
}

// Touch / wheel / keyboard
let ty = 0, tx = 0, drag = false;
document.addEventListener('touchstart', e => { ty = e.touches[0].clientY; tx = e.touches[0].clientX; drag = true; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!drag) return; drag = false;
  if (profileOpen) return;
  const dy = ty - e.changedTouches[0].clientY, dx = Math.abs(tx - e.changedTouches[0].clientX);
  if (Math.abs(dy) > 55 && Math.abs(dy) > dx * 1.5) { dy > 0 ? goTo(currentIdx+1) : goTo(currentIdx-1); }
}, { passive: true });
let wlock = false;
document.addEventListener('wheel', e => {
  if (wlock || profileOpen) return;
  if (Math.abs(e.deltaY) > 40) { wlock = true; setTimeout(() => wlock = false, 600); e.deltaY > 0 ? goTo(currentIdx+1) : goTo(currentIdx-1); }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') goTo(currentIdx+1);
  if (e.key === 'ArrowUp') goTo(currentIdx-1);
});

// ══ HELPERS ══
function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1).replace('.0','')+'K' : String(n); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function hideSocialBars() { document.querySelectorAll('.social-col').forEach(b => b.style.visibility='hidden'); }
function showSocialBars() { document.querySelectorAll('.social-col').forEach(b => b.style.visibility=''); }

// ══ SOCIAL ══
function buildSocialHTML(i, g) {
  const d = socialData[i], a = AUTHORS[g.author];
  return `
    <div class="av-wrap" id="avwrap-${i}" onclick="openProfile('${g.author}')">
      <div class="av-ring" style="background:${a.ring}"><div class="av-inner">${a.emoji}</div></div>
      <div class="av-plus" id="avplus-${i}">${a.followed?'✓':'+'}</div>
    </div>
    <div class="sb ${d.liked?'liked':''}" id="sb-like-${i}" onclick="toggleLike(${i})">
      <div class="sb-icon" id="sbicon-like-${i}">${heartSVG(d.liked)}</div>
      <span class="sb-count" id="sbcount-like-${i}">${fmt(d.likes)}</span>
    </div>
    <div class="sb" onclick="openComments(${i})">
      <div class="sb-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <span class="sb-count" id="sbcount-com-${i}">${fmt(d.comments.length)}</span>
    </div>
    <div class="sb" onclick="doShare(${i})">
      <div class="sb-icon" id="sbicon-share-${i}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
      <span class="sb-count" id="sbcount-share-${i}">${fmt(d.shares)}</span>
    </div>
    <div class="sb ${d.saved?'saved':''}" id="sb-save-${i}" onclick="toggleSave(${i})">
      <div class="sb-icon" id="sbicon-save-${i}">${bookSVG(d.saved)}</div>
      <span class="sb-count" id="sbcount-save-${i}">${d.saved?'★':'☆'}</span>
    </div>`;
}
function heartSVG(a){const c=a?'var(--a1)':'rgba(255,255,255,.7)',f=a?'var(--a1)':'none';return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;}
function bookSVG(a){const c=a?'var(--a3)':'rgba(255,255,255,.7)',f=a?'var(--a3)':'none';return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;}

function toggleLike(i){
  const d=socialData[i];d.liked=!d.liked;d.likes+=d.liked?1:-1;
  const btn=document.getElementById(`sb-like-${i}`),icon=document.getElementById(`sbicon-like-${i}`),cnt=document.getElementById(`sbcount-like-${i}`);
  btn.classList.toggle('liked',d.liked);icon.innerHTML=heartSVG(d.liked);cnt.textContent=fmt(d.likes);
  if(d.liked){tg?.HapticFeedback?.impactOccurred('medium');btn.classList.add('pop');btn.addEventListener('animationend',()=>btn.classList.remove('pop'),{once:true});const fl=document.createElement('span');fl.className='float-plus';fl.textContent='+1';icon.appendChild(fl);setTimeout(()=>fl.remove(),650);}
}
function toggleSave(i){
  const d=socialData[i];d.saved=!d.saved;
  document.getElementById(`sb-save-${i}`).classList.toggle('saved',d.saved);
  document.getElementById(`sbicon-save-${i}`).innerHTML=bookSVG(d.saved);
  document.getElementById(`sbcount-save-${i}`).textContent=d.saved?'★':'☆';
  toast(d.saved?'⭐ Добавлено в избранное':'Убрано из избранного');
}
function doShare(i){
  const d=socialData[i];d.shares++;document.getElementById(`sbcount-share-${i}`).textContent=fmt(d.shares);
  const text=`Играю в «${GAMES[i].title}» на Sharky 🎮`;
  if(navigator.share)navigator.share({title:'Sharky',text});
  else navigator.clipboard.writeText(text).then(()=>toast('📋 Скопировано!'));
}

// ══ COMMENTS ══
function openComments(i){
  activeDrawerGame=i;
  document.getElementById('comments-title').textContent=`Комментарии · ${GAMES[i].title}`;
  renderComments(i);
  document.getElementById('comments-drawer').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('show');
  hideSocialBars();tg?.BackButton?.show();tg?.BackButton?.onClick(closeComments);tg?.HapticFeedback?.impactOccurred('light');
}
function closeComments(){
  document.getElementById('comments-drawer').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('show');
  showSocialBars();tg?.BackButton?.hide();tg?.BackButton?.offClick(closeComments);
}
function renderComments(i){
  const list=document.getElementById('comments-list'),d=socialData[i];list.innerHTML='';
  if(!d.comments.length){list.innerHTML=`<div style="text-align:center;color:var(--sub);padding:28px 0;font-size:12px;letter-spacing:1px;">Будь первым! 👇</div>`;return;}
  d.comments.forEach((c,ci)=>{const item=document.createElement('div');item.className='c-item';item.innerHTML=`<div class="c-av">${c.avatar}</div><div class="c-body"><div class="c-name">${c.name}</div><div class="c-text">${c.text}</div></div><div class="c-like" onclick="likeComment(${i},${ci})"><span style="font-size:15px;color:${c.liked?'var(--a1)':'rgba(255,255,255,.3)'}">♥</span><span>${c.likes||''}</span></div>`;list.appendChild(item);});
  list.scrollTop=list.scrollHeight;
}
function likeComment(i,ci){const c=socialData[i].comments[ci];c.liked=!c.liked;c.likes=(c.likes||0)+(c.liked?1:-1);renderComments(i);}
function postComment(i){
  const inp=document.getElementById('comment-input'),text=inp.value.trim();if(!text)return;inp.value='';
  socialData[i].comments.push({avatar:'🎮',name:'Вы',text,likes:0,liked:false});
  document.getElementById(`sbcount-com-${i}`).textContent=fmt(socialData[i].comments.length);
  renderComments(i);
}

// ══ AUTHOR PROFILE ══
function openProfile(authorId){
  currentAuthorId=authorId||'sharky';const a=AUTHORS[currentAuthorId];
  document.getElementById('prof-topbar-name').textContent=a.handle;
  document.getElementById('prof-avatar-emoji').textContent=a.emoji;
  document.getElementById('prof-avatar-wrap').style.background=a.gradient;
  document.getElementById('prof-username').textContent=a.name;
  document.getElementById('prof-handle').textContent=a.handle+' · '+a.role;
  document.getElementById('prof-bio').innerHTML=a.bio.replace(/\n/g,'<br>');
  document.getElementById('prof-followers-n').textContent=fmt(a.followers);
  document.getElementById('prof-following-n').textContent=a.following;
  const btn=document.getElementById('prof-follow-btn');
  btn.classList.toggle('following',a.followed);btn.textContent=a.followed?'Вы подписаны':'Подписаться';
  if(!a.followed)btn.style.cssText=`background:${a.id==='pixelforge'?'#0072ff':a.id==='arcadelab'?'#f7971e':'var(--a1)'};color:${a.id==='arcadelab'?'#000':'#fff'}`;
  document.getElementById('profile-page').classList.add('open');
  profileOpen=true;renderProfGrid(activeProfTab);hideSocialBars();
  tg?.BackButton?.show();tg?.BackButton?.onClick(closeProfile);tg?.HapticFeedback?.impactOccurred('light');
}
function closeProfile(){document.getElementById('profile-page').classList.remove('open');profileOpen=false;showSocialBars();tg?.BackButton?.hide();tg?.BackButton?.offClick(closeProfile);}
function toggleFollow(){
  const a=AUTHORS[currentAuthorId];a.followed=!a.followed;a.followers+=a.followed?1:-1;
  const btn=document.getElementById('prof-follow-btn'),fel=document.getElementById('prof-followers-n');
  btn.classList.toggle('following',a.followed);btn.textContent=a.followed?'Вы подписаны':'Подписаться';
  if(!a.followed)btn.style.cssText=`background:${a.id==='pixelforge'?'#0072ff':a.id==='arcadelab'?'#f7971e':'var(--a1)'};color:${a.id==='arcadelab'?'#000':'#fff'}`;
  fel.textContent=fmt(a.followers);
  GAMES.forEach((g,i)=>{if(g.author===currentAuthorId){const p=document.getElementById(`avplus-${i}`),w=document.getElementById(`avwrap-${i}`);if(p)p.textContent=a.followed?'✓':'+';if(w)w.classList.toggle('following',a.followed);}});
  const total=Object.values(AUTHORS).filter(x=>x.followed).length;
  const el=document.getElementById('uprof-following');if(el)el.textContent=total;
  toast(a.followed?'✅ Подписка оформлена!':'Подписка отменена');
}
function switchProfTab(tab){activeProfTab=tab;document.querySelectorAll('.prof-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));renderProfGrid(tab);}
function renderProfGrid(tab){
  const grid=document.getElementById('prof-grid');grid.innerHTML='';
  const ag=GAMES.filter(g=>g.author===currentAuthorId);
  if(tab==='liked'){const lk=ag.filter(g=>{const i=GAMES.indexOf(g);return socialData[i].liked||socialData[i].saved;});if(!lk.length){grid.innerHTML=`<div class="prof-empty">💔<br>Нет понравившихся игр</div>`;return;}lk.forEach(g=>grid.appendChild(makePGC(GAMES.indexOf(g))));return;}
  ag.forEach(g=>grid.appendChild(makePGC(GAMES.indexOf(g))));
}
function makePGC(i){
  const g=GAMES[i],c=document.createElement('div');c.className='prof-game-card';c.style.background=g.bg;
  c.innerHTML=`<div class="pgc-emoji">${g.emoji}</div><div class="pgc-title" style="color:${g.accent}">${g.title}</div><div class="pgc-plays">▶ ${g.plays}</div><div class="pgc-tag">${g.scoreLabel}</div>`;
  c.addEventListener('click',()=>{closeProfile();setTimeout(()=>goTo(i),380);});return c;
}

// ══ USER PROFILE ══
function switchNav(tab){
  activeNav=tab;
  document.getElementById('nav-feed').classList.toggle('active',tab==='feed');
  document.getElementById('nav-profile').classList.toggle('active',tab==='profile');
  const up=document.getElementById('user-profile-page');
  if(tab==='profile'){up.classList.add('open');refreshUserProfile();}else{up.classList.remove('open');}
}
function refreshUserProfile(){
  document.getElementById('uprof-likes-total').textContent=socialData.filter(d=>d.liked).length;
  renderUGrid(activeUTab);
}
function renderUGrid(tab){
  activeUTab=tab;document.querySelectorAll('.uprof-tab').forEach(t=>t.classList.toggle('active',t.dataset.utab===tab));
  const grid=document.getElementById('uprof-grid');grid.innerHTML='';
  if(tab==='liked'){const lk=GAMES.filter((_,i)=>socialData[i].liked);if(!lk.length){grid.innerHTML=`<div class="uprof-empty"><div class="uprof-empty-ico">💔</div>Ставь лайки — игры появятся здесь</div>`;return;}lk.forEach(g=>grid.appendChild(makeUCard(GAMES.indexOf(g))));return;}
  if(tab==='saved'){const sv=GAMES.filter((_,i)=>socialData[i].saved);if(!sv.length){grid.innerHTML=`<div class="uprof-empty"><div class="uprof-empty-ico">⭐</div>Сохраняй игры через ★ в ленте</div>`;return;}sv.forEach(g=>grid.appendChild(makeUCard(GAMES.indexOf(g))));return;}
  grid.innerHTML=`<div class="uprof-empty"><div class="uprof-empty-ico">🎮</div>Ты ещё не опубликовал игры.<br><br><button onclick="toast('Редактор игр — скоро!')" style="padding:10px 24px;border-radius:999px;background:var(--a4);border:none;color:#fff;font-family:var(--fd);font-size:13px;font-weight:700;cursor:pointer;">+ Создать игру</button></div>`;
}
function makeUCard(i){
  const g=GAMES[i],c=document.createElement('div');c.className='prof-game-card';c.style.background=g.bg;
  c.innerHTML=`<div class="pgc-emoji">${g.emoji}</div><div class="pgc-title" style="color:${g.accent}">${g.title}</div><div class="pgc-plays">▶ ${g.plays}</div><div class="pgc-tag">${g.scoreLabel}</div>`;
  c.addEventListener('click',()=>{switchNav('feed');setTimeout(()=>goTo(i),380);});return c;
}

// ══ INIT ══
async function init() {
  try {
    const raw = await loadManifest();
    GAMES = shuffle(raw);
    socialData = initSocialData(GAMES);
    buildDeck();
    // Hide loading screen
    document.getElementById('loading').classList.add('hide');
    setTimeout(() => document.getElementById('loading').remove(), 500);
    // Go to first game
    goTo(0);
    tg?.ready();
  } catch(e) {
    console.error('Failed to load manifest:', e);
    document.querySelector('.ld-logo').textContent = 'Ошибка загрузки';
  }
}
init();

// Event wiring
document.getElementById('d-close').addEventListener('click', closeComments);
document.getElementById('d-handle').addEventListener('click', closeComments);
document.getElementById('drawer-backdrop').addEventListener('click', closeComments);
document.getElementById('comment-send').addEventListener('click', () => postComment(activeDrawerGame));
document.getElementById('comment-input').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();postComment(activeDrawerGame);} });
document.getElementById('prof-back').addEventListener('click', closeProfile);
document.getElementById('prof-follow-btn').addEventListener('click', toggleFollow);
document.querySelectorAll('.prof-tab').forEach(t => t.addEventListener('click', () => switchProfTab(t.dataset.tab)));
document.querySelectorAll('.uprof-tab').forEach(t => t.addEventListener('click', () => renderUGrid(t.dataset.utab)));
document.getElementById('profile-page').addEventListener('touchmove', e => e.stopPropagation(), { passive:true });
document.getElementById('profile-page').addEventListener('wheel', e => e.stopPropagation(), { passive:true });
document.getElementById('comments-drawer').addEventListener('touchmove', e => e.stopPropagation(), { passive:true });
document.getElementById('user-profile-page').addEventListener('touchmove', e => e.stopPropagation(), { passive:true });
</script>

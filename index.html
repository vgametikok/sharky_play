<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SwipePlay</title>
<!-- Telegram Mini App SDK — обязательно первым -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #060608;
  --surface: #0f0f14;
  --border: rgba(255,255,255,.07);
  --a1: #ff3c5f;
  --a2: #00e5a0;
  --a3: #ffe44d;
  --a4: #7b5cff;
  --text: #f2f2f4;
  --sub: rgba(242,242,244,.45);
  --font-display: 'Space Grotesk', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --nav-h: 58px;
  /* Telegram предоставляет эту переменную; fallback на dvh */
  --vh: var(--tg-viewport-stable-height, 100dvh);
}

html, body {
  height: 100%; width: 100%;
  max-height: var(--vh);
  background: var(--bg);
  font-family: var(--font-display);
  color: var(--text);
  overflow: hidden;
  touch-action: none;
  -webkit-font-smoothing: antialiased;
}

/* ── TOAST ── */
#toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--a2); color: #000;
  padding: 9px 22px; border-radius: 999px;
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
  z-index: 300; opacity: 0; pointer-events: none;
  transition: opacity .25s; white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ══════════════════════════════════════
   DECK
══════════════════════════════════════ */
#deck { position: fixed; top: 0; left: 0; right: 0; bottom: var(--nav-h); height: calc(var(--vh) - var(--nav-h)); }

.card {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: 1fr 56px;
  grid-template-rows: 1fr;
  transition: transform .44s cubic-bezier(.77,0,.18,1), opacity .44s;
  will-change: transform;
}
.card.above  { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.card.active { transform: translateY(0);     opacity: 1; }
.card.below  { transform: translateY(100%);  opacity: 0; pointer-events: none; }

/* accent top line per card */
.card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  z-index: 2;
}
.card-0::before { background: var(--a1); }
.card-1::before { background: var(--a2); }
.card-2::before { background: var(--a3); }
.card-3::before { background: var(--a4); }
.card-4::before { background: var(--a1); }
.card-5::before { background: var(--a2); }

.card-0 { background: #0d080f; }
.card-1 { background: #070e0b; }
.card-2 { background: #0d0c06; }
.card-3 { background: #09070f; }
.card-4 { background: #0d080a; }
.card-5 { background: #070e0b; }

/* ── GAME COLUMN (left) ── */
.game-col {
  grid-column: 1;
  display: flex; flex-direction: column;
  justify-content: flex-start;
  padding: 16px 0 16px 16px;
  gap: 10px;
  min-width: 0;
  min-height: 0;
  height: 100%;
}

/* ── HUD: title + score ── */
.hud {
  display: flex; align-items: baseline;
  justify-content: space-between;
  padding-right: 12px;
  flex-shrink: 0;
}
.hud-title {
  font-family: var(--font-display);
  font-size: clamp(16px, 4.5vw, 22px);
  font-weight: 700;
  letter-spacing: -.3px;
  line-height: 1;
}
.hud-score {
  font-family: var(--font-mono);
  font-size: clamp(18px, 5vw, 24px);
  font-weight: 700;
  line-height: 1;
  min-width: 44px;
  text-align: right;
}

/* ── ARENA ── */
.arena {
  flex: 1;
  min-height: 0;
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  touch-action: none;
  margin-right: 12px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* ── FOOTER BUTTONS ── */
.game-footer {
  display: flex; gap: 8px;
  padding-right: 12px;
  flex-shrink: 0;
}
.btn-primary {
  flex: 1; padding: 11px 10px;
  border: none; border-radius: 10px;
  font-family: var(--font-display);
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: transform .1s, opacity .1s;
  letter-spacing: -.2px;
}
.btn-primary:active { transform: scale(.95); opacity: .8; }

/* ── SWIPE HINT ── */
.swipe-hint {
  position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  opacity: 0; pointer-events: none;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase; color: var(--sub);
  animation: hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse {
  0%,100% { opacity:.3; transform:translateX(-50%) translateY(0); }
  50%      { opacity:.6; transform:translateX(-50%) translateY(-5px); }
}
.swipe-hint.visible { opacity: 1; }

/* ══════════════════════════════════════
   SOCIAL SIDEBAR (right column)
══════════════════════════════════════ */
.social-col {
  grid-column: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  padding: 0 8px 0 0;
  position: relative;
  z-index: 10;
}

/* author avatar */
.av-wrap {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; margin-bottom: 10px;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.av-ring {
  width: 44px; height: 44px; border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, var(--a4), var(--a1));
  transition: transform .15s;
}
.av-wrap:active .av-ring { transform: scale(.9); }
.av-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.av-plus {
  position: absolute; bottom: -4px; left: 50%;
  transform: translateX(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--a1); color: #fff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg);
  font-family: var(--font-display);
  line-height: 1;
  transition: background .2s;
}
.av-wrap.following .av-plus {
  background: var(--a2); font-size: 10px;
}

/* social buttons */
.sb {
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  padding: 6px 0;
  user-select: none;
}
.sb-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s, background .18s;
  position: relative;
  overflow: visible;
}
.sb:active .sb-icon { transform: scale(.85); }
.sb-icon svg { pointer-events: none; display: block; }

.sb-count {
  font-family: var(--font-mono);
  font-size: 10px; color: var(--sub);
  line-height: 1; min-height: 13px;
  letter-spacing: .3px;
}

/* liked state */
.sb.liked .sb-icon {
  background: rgba(255,60,95,.18);
  border-color: rgba(255,60,95,.4);
}
/* saved state */
.sb.saved .sb-icon {
  background: rgba(255,228,77,.12);
  border-color: rgba(255,228,77,.35);
}

@keyframes heartPop {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.45); }
  55%  { transform: scale(.88); }
  80%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.sb.pop .sb-icon { animation: heartPop .42s ease forwards; }

.float-plus {
  position: absolute; top: -10px; right: -2px;
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  color: var(--a1); pointer-events: none;
  animation: floatUp .65s ease forwards;
}
@keyframes floatUp {
  0%   { opacity:1; transform:translateY(0); }
  100% { opacity:0; transform:translateY(-24px); }
}

/* ══════════════════════════════════════
   IN-GAME OVERLAYS
══════════════════════════════════════ */
.score-overlay {
  position: absolute; inset: 0;
  background: rgba(6,6,8,.92);
  border-radius: 14px;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; z-index: 10;
  backdrop-filter: blur(4px);
}
.score-overlay.show { display: flex; }
.ov-label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 3px; text-transform: uppercase; color: var(--sub);
}
.ov-result {
  font-family: var(--font-display);
  font-size: clamp(48px,14vw,68px); font-weight: 700;
  line-height: 1; letter-spacing: -2px;
}
.ov-share {
  margin-top: 4px;
  padding: 10px 28px; border-radius: 999px;
  background: rgba(255,255,255,.08); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font-display);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.ov-share:active { background: rgba(255,255,255,.14); }

/* mini-game specific */
.tap-arena {
  flex: 1;
  width: 100%;
  background: #0f0f18; border-radius: 14px;
  position: relative; overflow: hidden;
  touch-action: none;
}
.target {
  position: absolute; border-radius: 50%;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform .08s;
}
.target:active { transform: scale(.8) !important; }

.reaction-box {
  flex: 1;
  width: 100%; border-radius: 14px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; user-select: none; transition: background .25s;
}
.reaction-box .big { font-size: clamp(40px,14vw,72px); font-weight: 700; }
.reaction-box .sub {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase; opacity: .5;
}

.avoid-arena {
  flex: 1;
  width: 100%;
  background: #0f0f18; border-radius: 14px;
  position: relative; overflow: hidden; touch-action: none;
}

/* Center wrapper for text-based games inside arena */
.game-inner {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; width: 100%; padding: 16px 12px;
  overflow-y: auto;
}

.memory-grid {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: clamp(6px,2vw,10px); width: 100%;
}
.mem-card {
  aspect-ratio: 1; border-radius: 10px;
  background: #161620;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(20px,6vw,32px);
  cursor: pointer; user-select: none;
  transition: transform .18s, background .18s, border-color .18s;
  border: 1.5px solid transparent;
}
.mem-card.flipped { background: #1e1e30; border-color: var(--a4); transform: scale(1.04); }
.mem-card.matched { background: #0e1e10; border-color: var(--a2); opacity: .65; pointer-events: none; }

.guess-wrap { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.guess-num {
  font-family: var(--font-display);
  font-size: clamp(44px,14vw,68px); font-weight: 700;
  line-height: 1; letter-spacing: -2px;
}
.guess-hint {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--sub); min-height: 16px;
}
.guess-row { display: flex; gap: 8px; width: 100%; }
.guess-input {
  flex: 1; background: #0f0f18;
  border: 1.5px solid rgba(255,255,255,.12); border-radius: 10px;
  color: var(--text); font-family: var(--font-display);
  font-size: 20px; font-weight: 700;
  text-align: center; padding: 11px;
  outline: none; -webkit-appearance: none;
}
.guess-input:focus { border-color: var(--a3); }
.guess-ok {
  padding: 11px 18px; border-radius: 10px; border: none;
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: transform .1s;
}
.guess-ok:active { transform: scale(.93); }

/* ══════════════════════════════════════
   COMMENTS DRAWER
══════════════════════════════════════ */
#drawer-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 140; opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
#drawer-backdrop.show { opacity: 1; pointer-events: all; }

#comments-drawer {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 68dvh; background: #0f0f14;
  border-radius: 20px 20px 0 0;
  z-index: 150; display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .34s cubic-bezier(.32,.72,0,1);
  box-shadow: 0 -6px 32px rgba(0,0,0,.55);
}
#comments-drawer.open { transform: translateY(0); }

.d-handle {
  width: 36px; height: 4px; background: #2a2a34;
  border-radius: 999px; margin: 12px auto 0; flex-shrink: 0; cursor: pointer;
}
.d-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 11px;
  border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
}
.d-header h3 { font-size: 15px; font-weight: 700; }
.d-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: #1a1a22; border: none; color: var(--text);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.comments-list {
  flex: 1; overflow-y: auto; padding: 12px 18px;
  display: flex; flex-direction: column; gap: 14px;
  -webkit-overflow-scrolling: touch;
}
.comments-list::-webkit-scrollbar { display: none; }

.c-item { display: flex; gap: 10px; align-items: flex-start; }
.c-av {
  width: 34px; height: 34px; border-radius: 50%;
  flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; font-size: 17px; background: #1a1a22;
}
.c-body { flex: 1; }
.c-name {
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,.4); margin-bottom: 3px;
}
.c-text { font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.82); }
.c-like {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  cursor: pointer; padding: 2px 3px;
}
.c-like span { font-size: 10px; color: var(--sub); }

.d-input-row {
  display: flex; gap: 8px;
  padding: 10px 14px 18px;
  border-top: 1px solid rgba(255,255,255,.06);
  flex-shrink: 0; background: #0f0f14;
}
.d-input {
  flex: 1; background: #1a1a22;
  border: 1.5px solid rgba(255,255,255,.08); border-radius: 999px;
  padding: 9px 16px; color: var(--text);
  font-family: var(--font-display); font-size: 13px;
  outline: none; -webkit-appearance: none;
}
.d-input:focus { border-color: var(--a4); }
.d-send {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--a4); border: none; color: #fff;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s;
}
.d-send:active { transform: scale(.88); }

/* ══════════════════════════════════════
   PROFILE PAGE
══════════════════════════════════════ */
#profile-page {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 120; display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(.32,.72,0,1);
  overflow: hidden;
}
#profile-page.open { transform: translateY(0); }

.prof-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 11px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--bg); z-index: 2;
}
.prof-back {
  width: 34px; height: 34px; border-radius: 50%;
  background: #161620; border: none; color: var(--text);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s;
}
.prof-back:active { transform: scale(.9); }
.prof-topbar-name { font-size: 16px; font-weight: 700; flex: 1; }
.prof-dots {
  width: 34px; height: 34px; border-radius: 50%;
  background: #161620; border: none; color: var(--text);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.prof-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.prof-scroll::-webkit-scrollbar { display: none; }

.prof-hero {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 20px 20px 16px;
}
.prof-avatar-big {
  width: 84px; height: 84px; border-radius: 50%;
  background: linear-gradient(135deg, var(--a4), var(--a1));
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  box-shadow: 0 0 28px rgba(123,92,255,.35);
}
.prof-username { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.prof-handle { font-size: 12px; color: var(--sub); margin-top: -4px; }

.prof-stats {
  display: flex;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.prof-stat {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; padding: 13px 6px;
  border-right: 1px solid var(--border);
}
.prof-stat:last-child { border-right: none; }
.prof-stat-n {
  font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1;
}
.prof-stat-l {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--sub); letter-spacing: .5px; text-transform: uppercase;
}

.prof-bio {
  padding: 14px 24px 2px;
  font-size: 13px; line-height: 1.55;
  color: rgba(255,255,255,.6); text-align: center;
}

.prof-follow-btn {
  display: block; margin: 14px 18px 6px;
  width: calc(100% - 36px);
  padding: 13px; border-radius: 10px; border: none;
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: transform .1s, background .2s;
  letter-spacing: -.2px;
}
.prof-follow-btn:active { transform: scale(.97); }
.prof-follow-btn.following {
  background: #161620 !important; color: var(--text) !important;
  border: 1.5px solid rgba(255,255,255,.12);
}

.prof-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  margin-top: 6px; position: sticky; top: 0;
  background: var(--bg); z-index: 3;
}
.prof-tab {
  flex: 1; padding: 11px; text-align: center;
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  color: var(--sub); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .18s, border-color .18s;
  letter-spacing: .3px;
}
.prof-tab.active { color: var(--text); border-bottom-color: var(--a4); }

.prof-grid {
  display: grid; grid-template-columns: repeat(2,1fr);
  gap: 10px; padding: 14px 14px 40px;
  align-content: start;
}

.prof-game-card {
  border-radius: 12px; aspect-ratio: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  position: relative; cursor: pointer; overflow: hidden;
  border: 1px solid var(--border);
  transition: transform .13s;
  -webkit-tap-highlight-color: transparent;
}
.prof-game-card:active { transform: scale(.94); }
.prof-game-card-emoji { font-size: 32px; line-height: 1; }
.prof-game-card-title {
  font-size: 13px; font-weight: 700;
  text-align: center; padding: 0 6px; line-height: 1.2;
}
.prof-game-card-plays {
  font-family: var(--font-mono); font-size: 10px; color: var(--sub);
}
.prof-game-card-tag {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,.45); border-radius: 999px;
  padding: 2px 7px;
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: .5px; text-transform: uppercase; color: rgba(255,255,255,.5);
}

.prof-empty {
  grid-column: 1/-1; display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  padding: 36px 20px; color: var(--sub);
  font-size: 13px; text-align: center;
}

/* ══════════════════════════════════════
   BOTTOM NAV BAR
══════════════════════════════════════ */
#bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: rgba(6,6,8,.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 90;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  cursor: pointer; position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s;
}
.nav-tab:active { opacity: .7; }
.nav-icon {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.nav-icon svg { transition: transform .2s; }

// Shuffle on load
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck() {
  GAMES.forEach((g, i) => {
    // Card
    const card = document.createElement('div');
    card.className = `card card-${i} ${i === 0 ? 'active' : 'below'}`;
    card.style.background = g.bg;
    card.dataset.idx = i;

    // Left game column
    const gameCol = document.createElement('div');
    gameCol.className = 'game-col';

    const hud = document.createElement('div');
    hud.className = 'hud';
    hud.innerHTML = `
      <div class="hud-title" style="color:${g.accent}">${g.title}</div>
      <div class="hud-score" id="score-${i}" style="color:${g.accent}">0</div>
    `;
    gameCol.appendChild(hud);

    const arena = document.createElement('div');
    arena.className = 'arena';
    arena.id = `arena-${i}`;
    gameCol.appendChild(arena);

    const footer = document.createElement('div');
    footer.className = 'game-footer';
    footer.id = `footer-${i}`;
    gameCol.appendChild(footer);

    card.appendChild(gameCol);

    // Right social column
    const socialCol = document.createElement('div');
    socialCol.className = 'social-col';
    socialCol.id = `scol-${i}`;
    socialCol.innerHTML = buildSocialHTML(i, g.accent);
    card.appendChild(socialCol);

    deckEl.appendChild(card);
    cardEls.push(card);

  // swipe hint

}

          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </div>
      <span class="sb-count" id="sbcount-share-${i}">${fmt(d.shares)}</span>
    </div>

    <div class="sb ${d.saved?'saved':''}" id="sb-save-${i}" onclick="toggleSave(${i})">

      <span class="sb-count" id="sbcount-save-${i}">${d.saved?'★':'☆'}</span>

  `;
}

function heartSVG(a) {
  const c = a ? 'var(--a1)' : 'rgba(255,255,255,.7)';
  const f = a ? 'var(--a1)' : 'none';
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
}
function bookSVG(a) {
  const c = a ? 'var(--a3)' : 'rgba(255,255,255,.7)';
  const f = a ? 'var(--a3)' : 'none';
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
}
function fmt(n) {
  return n >= 1000 ? (n/1000).toFixed(1).replace('.0','')+'K' : String(n);
}

// ══════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════
function goTo(idx) {
  const total = GAMES.length;

  if (idx >= total || idx < 0) {
    const targetIdx = idx >= total ? 0 : total - 1;
    const snapClass = idx >= total ? 'below' : 'above';
    cardEls.forEach(c => {
      c.style.transition = 'none';
      c.classList.remove('active', 'above', 'below');
      c.classList.add(snapClass);
    });
    void cardEls[0].offsetHeight; // force reflow
    requestAnimationFrame(() => {
      cardEls.forEach(c => c.style.transition = '');
      _goTo(targetIdx);
    });
    return;
  }
  _goTo(idx);
}

function _goTo(idx) {
  currentIdx = idx;
  cardEls.forEach((c, i) => {
    c.classList.remove('above', 'active', 'below');
    if (i < idx)        c.classList.add('above');
    else if (i === idx) c.classList.add('active');
    else                c.classList.add('below');
  });
  tg?.HapticFeedback.impactOccurred('light');

  const hint = document.getElementById('swipe-hint');
  if (hint) hint.style.opacity = '';

  if (!gameInstances[idx]) gameInstances[idx] = GAMES[idx].build(idx);
  if (gameInstances[idx]?.onFocus) gameInstances[idx].onFocus();
}

let touchStartY = 0, touchStartX = 0, dragging = false;
document.addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  dragging = true;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!dragging) return; dragging = false;
  if (profileOpen) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  const dx = Math.abs(touchStartX - e.changedTouches[0].clientX);
  if (Math.abs(dy) > 55 && Math.abs(dy) > dx * 1.5) {
    if (dy > 0) goTo(currentIdx + 1);
    else        goTo(currentIdx - 1);
  }
}, { passive: true });

let wheelLock = false;
document.addEventListener('wheel', e => {
  if (wheelLock || profileOpen) return;
  if (Math.abs(e.deltaY) > 40) {
    wheelLock = true; setTimeout(() => wheelLock = false, 600);
    if (e.deltaY > 0) goTo(currentIdx + 1);
    else              goTo(currentIdx - 1);
  }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')   goTo(currentIdx - 1);
  if (e.key === 'ArrowDown') goTo(currentIdx + 1);
});

function makeBtn(text, color, onClick) {
  const b = document.createElement('button');

  b.style.color = '#000';
  b.addEventListener('click', onClick);

function showOverlay(arenaEl, resultText, labelText, color, onRetry) {
  let ov = arenaEl.querySelector('.score-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.className = 'score-overlay';
    arenaEl.appendChild(ov);
  }
  ov.innerHTML = `
    <div class="ov-label">результат</div>
    <div class="ov-result" style="color:${color}">${resultText}</div>
    <div class="ov-label">${labelText}</div>
    <button class="ov-share">📤 Поделиться</button>
  `;
  ov.classList.add('show');
  ov.querySelector('.ov-share').addEventListener('click', () => shareResult(resultText, labelText));

  const footer = arenaEl.closest('.game-col').querySelector('.game-footer');
  if (footer) {
    footer.innerHTML = '';
    footer.appendChild(makeBtn('Ещё раз', color, () => {
      ov.classList.remove('show');
      footer.innerHTML = '';
      onRetry();
    }));
    footer.appendChild(makeBtn('Дальше ↑', '#1a1a22', () => goTo(currentIdx + 1)));
  }
}

function shareResult(val, label) {
  const text = `Я набрал ${val} ${label} в SwipePlay! Попробуй!`;
  if (navigator.share) navigator.share({ title:'SwipePlay', text });
  else navigator.clipboard.writeText(text).then(() => toast('Скопировано!'));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');

}

function buildTap(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let score = 0, timeLeft = 20, tickTimer = null;
  function start() {
    score = 0; timeLeft = 20; setScore(idx, 0);
    arena.innerHTML = ''; arena.className = 'arena tap-arena';
    
    spawnTarget();
    tickTimer = setInterval(() => { timeLeft--; if (timeLeft <= 0) { clearInterval(tickTimer); end(); } }, 1000);
    const bar = document.createElement('div');
    bar.style.cssText = `position:absolute;bottom:0;left:0;height:3px;background:var(--a1);width:100%;transition:width 20s linear;`;
    arena.appendChild(bar);
    requestAnimationFrame(() => bar.style.width = '0%');
  }
  function spawnTarget() {
    arena.querySelector('.target')?.remove();
    const t = document.createElement('div');
    t.className = 'target';
    const sz = Math.random()*28+42;
    t.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*(arena.offsetWidth-sz)}px;top:${Math.random()*(arena.offsetHeight-sz)}px;background:var(--a1);box-shadow:0 0 18px rgba(255,60,95,.5);font-size:${sz*.4}px;`;
    t.textContent = '🎯';
    t.addEventListener('click', () => { score++; setScore(idx, score); spawnTarget(); });
    arena.appendChild(t);
  }
  function end() { arena.querySelector('.target')?.remove(); showOverlay(arena, score, GAMES[idx].scoreLabel, 'var(--a1)', start); }
  start(); return {};
}

function buildReaction(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let state = 'wait', startTime = 0, tid = null;
  function build() {
    arena.innerHTML = ''; 
    const box = document.createElement('div');
    box.className = 'reaction-box'; box.style.background = '#12121c';
    box.innerHTML = `<div class="big">👆</div><div class="sub">Жди зелёного</div>`;
    arena.appendChild(box);
    box.addEventListener('click', onClick);
    box.addEventListener('touchend', e => { e.preventDefault(); onClick(); }, { passive:false });
    setState('wait');
  }
  function setState(s) {
    state = s;
    const box = arena.querySelector('.reaction-box'); if (!box) return;
    if (s === 'wait') {
      box.style.background = '#12121c';
      box.innerHTML = `<div class="big">🔴</div><div class="sub">Жди…</div>`;
      tid = setTimeout(() => setState('go'), 1500 + Math.random()*3000);
    } else if (s === 'go') {
      box.style.background = '#061a0e';
      box.innerHTML = `<div class="big" style="color:var(--a2)">🟢</div><div class="sub">ЖМЯК!</div>`;
      startTime = performance.now();
    } else if (s === 'early') {
      clearTimeout(tid); box.style.background = '#1a0608';
      box.innerHTML = `<div class="big">❌</div><div class="sub">Слишком рано!</div>`;
      setTimeout(() => setState('wait'), 1200);
    }
  }
  function onClick() {
    if (state === 'wait') { setState('early'); return; }
    if (state === 'go') { const ms = Math.round(performance.now()-startTime); setScore(idx,ms); showOverlay(arena,ms,'мс','var(--a2)',build); }
  }
  build(); return { onFocus: build };
}

function buildAvoid(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  arena.className = 'arena avoid-arena';
  let running=false, startTime=0, raf=null, px=.5, py=.5, enemies=[], aw=0, ah=0, spawnInt;
  function start() {
    arena.innerHTML = ''; aw = arena.offsetWidth; ah = arena.offsetHeight;
    px=.5; py=.5; enemies=[]; running=true; startTime=performance.now();
    const p = document.createElement('div');
    p.id = `avp-${idx}`;
    p.style.cssText = `position:absolute;width:26px;height:26px;border-radius:50%;background:var(--a3);transform:translate(-50%,-50%);pointer-events:none;z-index:2;box-shadow:0 0 14px rgba(255,228,77,.55);`;
    arena.appendChild(p);
    arena.addEventListener('touchmove', onM, { passive:false });
    arena.addEventListener('mousemove', onMM);
    clearInterval(spawnInt);
    spawnInt = setInterval(() => {
      if (!running) return;
      const e = Math.floor(Math.random()*4);
      let ex,ey;
      if (e===0){ex=Math.random();ey=0;} else if(e===1){ex=1;ey=Math.random();}
      else if(e===2){ex=Math.random();ey=1;} else{ex=0;ey=Math.random();}
      enemies.push({x:ex,y:ey,spd:.0018+Math.random()*.002,s:18+Math.random()*12,el:null});
    }, Math.max(450, 1100-(performance.now()-startTime)/12));
    raf = requestAnimationFrame(loop);
  }
  function onM(e) { e.preventDefault(); const r=arena.getBoundingClientRect(); px=Math.max(0,Math.min(1,(e.touches[0].clientX-r.left)/aw)); py=Math.max(0,Math.min(1,(e.touches[0].clientY-r.top)/ah)); }
  function onMM(e) { const r=arena.getBoundingClientRect(); px=Math.max(0,Math.min(1,(e.clientX-r.left)/aw)); py=Math.max(0,Math.min(1,(e.clientY-r.top)/ah)); }
  function loop() {
    if (!running) return;
    const elapsed = (performance.now()-startTime)/1000;
    setScore(idx, Math.floor(elapsed));
    const pl = arena.querySelector(`#avp-${idx}`);
    if (pl) { pl.style.left=(px*aw)+'px'; pl.style.top=(py*ah)+'px'; }
    const ref = Math.min(aw, ah);
    for (let ei=0; ei<enemies.length; ei++) {
      const en = enemies[ei];
      const dx=px-en.x, dy=py-en.y, dist=Math.sqrt(dx*dx+dy*dy)||.001;
      en.x += (dx/dist)*en.spd*(ref/300); en.y += (dy/dist)*en.spd*(ref/300);
      if (!en.el) { en.el=document.createElement('div'); en.el.style.cssText=`position:absolute;border-radius:50%;background:var(--a1);transform:translate(-50%,-50%);pointer-events:none;opacity:.8;`; arena.appendChild(en.el); }
      en.el.style.width=en.el.style.height=en.s+'px';
      en.el.style.left=(en.x*aw)+'px'; en.el.style.top=(en.y*ah)+'px';
      const d2=Math.sqrt(((px-en.x)*aw)**2+((py-en.y)*ah)**2);
      if (d2 < en.s/2+13) { end(Math.floor(elapsed)); return; }
    }
    raf = requestAnimationFrame(loop);
  }
  function end(s) {
    running=false; cancelAnimationFrame(raf); clearInterval(spawnInt);
    arena.removeEventListener('touchmove',onM); arena.removeEventListener('mousemove',onMM);
    showOverlay(arena, s, 'сек', 'var(--a3)', start);
  }
  start(); return { onFocus: start };
}

function buildMemory(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  const EMOJIS = ['🎮','🎯','⚡','🔥','💎','🌀','🎲','🎪'];
  let pairs=0, flipped=[], locked=false;
  function start() {
    pairs=0; flipped=[]; locked=false; setScore(idx,0);
    arena.innerHTML='';
    const inner = document.createElement('div'); inner.className='game-inner';
    const items = [...EMOJIS,...EMOJIS].sort(()=>Math.random()-.5);
    const grid = document.createElement('div'); grid.className='memory-grid';
    items.forEach((em,i) => {
      const c=document.createElement('div'); c.className='mem-card';
      c.dataset.val=em; c.dataset.i=i; c.textContent='?';
      c.addEventListener('click',()=>flip(c)); grid.appendChild(c);
    });
    inner.appendChild(grid); arena.appendChild(inner);
  }
  function flip(card) {
    if (locked||card.classList.contains('flipped')||card.classList.contains('matched')) return;
    card.textContent=card.dataset.val; card.classList.add('flipped'); flipped.push(card);
    if (flipped.length===2) { locked=true; setTimeout(check,650); }
  }
  function check() {
    const [a,b]=flipped;
    if (a.dataset.val===b.dataset.val) {
      a.classList.add('matched'); b.classList.add('matched'); pairs++;
      setScore(idx,pairs);
      if (pairs===8) setTimeout(()=>showOverlay(arena,pairs,'пар найдено','var(--a4)',start),400);
    } else { a.textContent='?'; b.textContent='?'; a.classList.remove('flipped'); b.classList.remove('flipped'); }
    flipped=[]; locked=false;
  }
  start(); return { onFocus: start };
}

function buildGuess(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let secret, attempts;
  function start() {
    secret=Math.floor(Math.random()*100)+1; attempts=0; setScore(idx,0);
    arena.innerHTML = ''; 
    const wrap=document.createElement('div'); wrap.className='guess-wrap';
    wrap.innerHTML=`
      <div class="guess-num" style="color:var(--a1)">1–100</div>
      <div class="guess-hint" id="gh-${idx}">Угадай число</div>
      <div class="guess-row">
        <input class="guess-input" id="gi-${idx}" type="number" min="1" max="100" placeholder="?" inputmode="numeric">
        <button class="guess-ok" style="background:var(--a1);color:#000;" id="gb-${idx}">ОК</button>
      </div>
    `;
    arena.appendChild(wrap);
    document.getElementById(`gb-${idx}`).addEventListener('click', guess);
    document.getElementById(`gi-${idx}`).addEventListener('keydown', e => { if(e.key==='Enter') guess(); });
  }
  function guess() {
    const inp=document.getElementById(`gi-${idx}`);
    const hint=document.getElementById(`gh-${idx}`);
    const v=parseInt(inp.value); if(isNaN(v)||v<1||v>100) return;
    attempts++; setScore(idx,attempts); inp.value='';
    if (v===secret) { showOverlay(arena,attempts,'попытка(ок)','var(--a1)',start); return; }
    hint.textContent = v<secret ? '📈 Больше!' : '📉 Меньше!';
    hint.style.color = v<secret ? 'var(--a2)' : 'var(--a1)';
  }
  start(); return {};
}

function buildSnake(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let CELL, COLS, ROWS, W, H;
  let canvas,ctx,snake,dir,nextDir,food,score,running,raf,lastT=0;
  const SPD=145;
  function start() {
    arena.innerHTML='';
    canvas=document.createElement('canvas');
    canvas.style.cssText=`flex:1;width:100%;display:block;border-radius:14px;min-height:0;`;
    arena.appendChild(canvas);
    // Size after layout
    requestAnimationFrame(() => {
    const aw=arena.offsetWidth, ah=arena.offsetHeight||arena.offsetWidth;
    const sz=Math.min(aw,ah);
    CELL=Math.max(14, Math.floor(sz/16)); COLS=Math.floor(aw/CELL); ROWS=Math.floor(ah/CELL);
    W=COLS*CELL; H=ROWS*CELL;
    canvas.width=W; canvas.height=H;
    ctx=canvas.getContext('2d');
    snake=[{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)},{x:Math.floor(COLS/2)-1,y:Math.floor(ROWS/2)},{x:Math.floor(COLS/2)-2,y:Math.floor(ROWS/2)}];
    dir={x:1,y:0}; nextDir={x:1,y:0};
    score=0; running=true; setScore(idx,0); placeFood();
    let ts={x:0,y:0};
    canvas.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};e.stopPropagation();},{passive:true});
    canvas.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
      e.stopPropagation();
      if(Math.abs(dx)>Math.abs(dy)){if(dx>20&&dir.x!==-1)nextDir={x:1,y:0};if(dx<-20&&dir.x!==1)nextDir={x:-1,y:0};}
      else{if(dy>20&&dir.y!==-1)nextDir={x:0,y:1};if(dy<-20&&dir.y!==1)nextDir={x:0,y:-1};}
    },{passive:true});
    document.addEventListener('keydown',onKey);
    const footer=arena.closest('.game-col').querySelector('.game-footer');
    if(footer){
      footer.innerHTML='';
      const dpad=document.createElement('div');
      dpad.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:5px;width:130px;margin:0 auto;';
      [{l:'↑',r:0,c:1,dx:0,dy:-1},{l:'←',r:1,c:0,dx:-1,dy:0},{l:'↓',r:1,c:1,dx:0,dy:1},{l:'→',r:1,c:2,dx:1,dy:0}].forEach(d=>{
        const b=document.createElement('button');
        b.textContent=d.l;
        b.style.cssText=`grid-row:${d.r+1};grid-column:${d.c+1};padding:9px;background:#1a1a22;border:none;border-radius:7px;color:#fff;font-size:16px;cursor:pointer;`;
        b.addEventListener('click',()=>{if(d.dx!==0&&dir.x!==-d.dx)nextDir={x:d.dx,y:0};if(d.dy!==0&&dir.y!==-d.dy)nextDir={x:0,y:d.dy};});
        dpad.appendChild(b);
      });
      footer.appendChild(dpad);
    }
    raf=requestAnimationFrame(loop);
    }); // end sizing rAF
  }
  function onKey(e){if(e.key==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0};if(e.key==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};if(e.key==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};if(e.key==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};}
  function placeFood(){do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
  function loop(ts){
    if(!running)return;
    if(ts-lastT>SPD){lastT=ts;update();draw();}
    raf=requestAnimationFrame(loop);
  }
  function update(){
    dir=nextDir;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS){end();return;}
    if(snake.some(s=>s.x===h.x&&s.y===h.y)){end();return;}
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;setScore(idx,score);placeFood();}
    else snake.pop();
  }
  function draw(){
    ctx.fillStyle='#0c0c14'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#14141e'; ctx.lineWidth=.4;
    for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,W);ctx.stroke();}
    for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(W,j*CELL);ctx.stroke();}
    ctx.fillStyle='var(--a1)'; ctx.shadowColor='var(--a1)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    snake.forEach((s,i)=>{const t=1-i/snake.length; ctx.fillStyle=i===0?'#00e5a0':`rgba(0,229,160,${.25+t*.5})`; ctx.shadowColor=i===0?'#00e5a0':'transparent'; ctx.shadowBlur=i===0?7:0; ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);});
    ctx.shadowBlur=0;
  }
  function end(){
    running=false; cancelAnimationFrame(raf); document.removeEventListener('keydown',onKey);
    const footer=arena.closest('.game-col').querySelector('.game-footer');
    if(footer)footer.innerHTML='';
    showOverlay(arena,score,'очков','var(--a2)',start);
  }
  start(); return { onFocus: start };
}

//  GAME: STROOP — цвет или слово?
// ══════════════════════════════════════
function buildStroop(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  const COLORS = [
    { name:'КРАСНЫЙ', color:'#ff3c5f' },
    { name:'СИНИЙ',   color:'#3c8fff' },
    { name:'ЗЕЛЁНЫЙ', color:'#00e5a0' },
    { name:'ЖЁЛТЫЙ',  color:'#ffe44d' },
  ];
  let score=0, timeLeft=20, tick=null;

  function start() {
    score=0; timeLeft=20; setScore(idx,0);
    arena.innerHTML=''; 
    const wrap=document.createElement('div');
    wrap.className='game-inner';

    const question=document.createElement('div');
    question.id=`stroop-q-${idx}`;
    question.style.cssText='text-align:center;font-size:clamp(28px,10vw,44px);font-weight:700;letter-spacing:-1px;padding:14px 0 8px;';

    const grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;';

    wrap.appendChild(question); wrap.appendChild(grid);
    arena.appendChild(wrap);

    COLORS.forEach(c => {
      const btn=document.createElement('button');
      btn.style.cssText=`padding:13px;border-radius:10px;border:2px solid ${c.color};background:${c.color}18;color:${c.color};font-family:var(--font-display);font-size:13px;font-weight:700;cursor:pointer;transition:transform .1s;`;
      btn.textContent=c.name;
      btn.dataset.color=c.color;
      btn.addEventListener('click', () => checkStroop(c.color, idx));
      btn.addEventListener('touchstart', ()=>btn.style.transform='scale(.93)', {passive:true});
      btn.addEventListener('touchend', ()=>btn.style.transform='', {passive:true});
      grid.appendChild(btn);
    });

    nextStroop(idx);
    clearInterval(tick);
    tick=setInterval(()=>{ timeLeft--; if(timeLeft<=0){clearInterval(tick);endStroop(idx);} },1000);
    const bar=document.createElement('div');
    bar.id=`stroop-bar-${idx}`;
    bar.style.cssText='height:3px;background:#00c6ff;width:100%;border-radius:999px;transition:width 20s linear;margin-top:4px;';
    wrap.appendChild(bar);
    requestAnimationFrame(()=>bar.style.width='0%');
  }

  function nextStroop(i) {
    const q=document.getElementById(`stroop-q-${i}`);
    if(!q) return;
    // word = one color name, ink = different color
    const word=COLORS[Math.floor(Math.random()*COLORS.length)];
    let inkIdx; do{ inkIdx=Math.floor(Math.random()*COLORS.length); }while(COLORS[inkIdx].color===word.color);
    const ink=COLORS[inkIdx];
    q.textContent=word.name;
    q.style.color=ink.color;
    // correct answer is the INK color
    q.dataset.correct=ink.color;
    q.dataset.label=`Нажми на цвет ЧЕРНИЛ: ${ink.name}`;
    const hint=document.getElementById(`stroop-hint-${i}`);
    if(hint) hint.textContent='Нажми цвет, которым написано слово';
  }

  function checkStroop(color, i) {
    const q=document.getElementById(`stroop-q-${i}`);
    if(!q) return;
    if(color===q.dataset.correct){ score++; setScore(i,score); }
    nextStroop(i);
  }

  function endStroop(i) {
    showOverlay(arena, score, 'очков', '#00c6ff', start);
  }

  start(); return { onFocus: start };
}

// ══════════════════════════════════════
//  GAME: SIMON — запомни и повтори
// ══════════════════════════════════════
function buildSimon(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  const COLS = ['#ff3c5f','#3c8fff','#00e5a0','#ffe44d'];
  const NAMES = ['🔴','🔵','🟢','🟡'];
  let seq=[], userSeq=[], showing=false, round=0;

  function start() {
    seq=[]; userSeq=[]; round=0; setScore(idx,0);
    arena.innerHTML=''; 

    const wrap=document.createElement('div');
    wrap.className='game-inner';

    const status=document.createElement('div');
    status.id=`simon-status-${idx}`;
    status.style.cssText='font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);min-height:16px;';
    status.textContent='Запомни последовательность';

    const grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;';

    COLS.forEach((c,ci)=>{
      const btn=document.createElement('div');
      btn.id=`simon-btn-${idx}-${ci}`;
      btn.style.cssText=`height:70px;border-radius:12px;background:${c}22;border:2px solid ${c}55;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .1s,transform .1s;user-select:none;`;
      btn.textContent=NAMES[ci];
      btn.addEventListener('click', ()=>{ if(!showing) pressSimon(ci, idx); });
      grid.appendChild(btn);
    });

    wrap.appendChild(status); wrap.appendChild(grid);
    arena.appendChild(wrap);
    setTimeout(()=>addAndShow(idx), 600);
  }

  function addAndShow(i) {
    showing=true;
    const status=document.getElementById(`simon-status-${i}`);
    if(status) status.textContent='Смотри…';
    seq.push(Math.floor(Math.random()*4));
    let k=0;
    const interval=setInterval(()=>{
      if(k>0){ flashBtn(i, seq[k-1], false); }
      if(k<seq.length){ setTimeout(()=>flashBtn(i,seq[k],true), 100); k++; }
      else{ clearInterval(interval); setTimeout(()=>{ showing=false; userSeq=[]; if(status) status.textContent='Твоя очередь!'; },400); }
    }, 700);
  }

  function flashBtn(i, ci, on) {
    const btn=document.getElementById(`simon-btn-${i}-${ci}`);
    if(!btn) return;
    btn.style.background=on?`${COLS[ci]}cc`:`${COLS[ci]}22`;
    btn.style.transform=on?'scale(1.06)':'scale(1)';
  }

  function pressSimon(ci, i) {
    flashBtn(i,ci,true); setTimeout(()=>flashBtn(i,ci,false),200);
    userSeq.push(ci);
    const pos=userSeq.length-1;
    if(userSeq[pos]!==seq[pos]){
      const status=document.getElementById(`simon-status-${i}`);
      if(status) status.textContent='❌ Ошибка!';
      setTimeout(()=>showOverlay(arena, seq.length-1, 'шагов', '#0072ff', start), 500);
      return;
    }
    if(userSeq.length===seq.length){
      round=seq.length; setScore(i,round);
      setTimeout(()=>addAndShow(i), 500);
    }
  }

  start(); return { onFocus: start };
}

// ══════════════════════════════════════
//  GAME: MATH BLITZ — быстрая математика
// ══════════════════════════════════════
function buildMathBlitz(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let score=0, timeLeft=30, tick=null, correct=0;

  function start() {
    score=0; timeLeft=30; setScore(idx,0);
    arena.innerHTML=''; 

    const wrap=document.createElement('div');
    wrap.className='game-inner';

    const expr=document.createElement('div');
    expr.id=`math-expr-${idx}`;
    expr.style.cssText='font-family:var(--font-display);font-size:clamp(34px,12vw,52px);font-weight:700;letter-spacing:-2px;line-height:1;text-align:center;padding:10px 0;';

    const optGrid=document.createElement('div');
    optGrid.id=`math-opts-${idx}`;
    optGrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;';

    const timerBar=document.createElement('div');
    timerBar.id=`math-bar-${idx}`;
    timerBar.style.cssText='height:3px;background:#00e5d4;width:100%;border-radius:999px;transition:width 30s linear;';

    wrap.appendChild(expr); wrap.appendChild(optGrid); wrap.appendChild(timerBar);
    arena.appendChild(wrap);
    nextMath(idx);
    clearInterval(tick);
    tick=setInterval(()=>{ timeLeft--; if(timeLeft<=0){clearInterval(tick);endMath(idx);} },1000);
    requestAnimationFrame(()=>{ const b=document.getElementById(`math-bar-${idx}`); if(b) b.style.width='0%'; });
  }

  function nextMath(i) {
    const ops=['+','-','×'];
    const op=ops[Math.floor(Math.random()*ops.length)];
    let a,b,ans;
    if(op==='+'){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*50)+1;ans=a+b;}
    else if(op==='-'){a=Math.floor(Math.random()*50)+20;b=Math.floor(Math.random()*a)+1;ans=a-b;}
    else{a=Math.floor(Math.random()*11)+2;b=Math.floor(Math.random()*11)+2;ans=a*b;}

    const expr=document.getElementById(`math-expr-${i}`);
    if(expr) expr.textContent=`${a} ${op} ${b}`;

    // 4 options, one correct
    const opts=new Set([ans]);
    while(opts.size<4){
      const wrong=ans+Math.floor(Math.random()*20)-10;
      if(wrong!==ans&&wrong>0) opts.add(wrong);
    }
    const arr=[...opts].sort(()=>Math.random()-.5);
    const grid=document.getElementById(`math-opts-${i}`);
    if(!grid) return;
    grid.innerHTML='';
    arr.forEach(v=>{
      const btn=document.createElement('button');
      btn.style.cssText=`padding:12px;border-radius:10px;border:1.5px solid rgba(0,229,212,.3);background:rgba(0,229,212,.08);color:var(--text);font-family:var(--font-display);font-size:18px;font-weight:700;cursor:pointer;transition:background .12s,transform .1s;`;
      btn.textContent=v;
      btn.addEventListener('click',()=>{
        if(v===ans){ score++; setScore(i,score); btn.style.background='rgba(0,229,160,.3)'; }
        else{ btn.style.background='rgba(255,60,95,.3)'; }
        setTimeout(()=>nextMath(i),220);
      });
      btn.addEventListener('touchstart',()=>btn.style.transform='scale(.93)',{passive:true});
      btn.addEventListener('touchend',()=>btn.style.transform='',{passive:true});
      grid.appendChild(btn);
    });
  }

  function endMath(i) {
    showOverlay(arena, score, 'правильных ответов', '#00e5d4', start);
  }

  start(); return { onFocus: start };
}

// ══════════════════════════════════════
//  GAME: MOLE — крот!
// ══════════════════════════════════════
function buildMole(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let score=0, timeLeft=25, tick=null, moleTimer=null;

  function start() {
    score=0; timeLeft=25; setScore(idx,0);
    arena.innerHTML=''; 
    arena.style.background='#0e0906';
    arena.style.borderRadius='14px';
    arena.style.position='relative';
    arena.style.overflow='hidden';

    // 9 holes in a 3x3 grid
    const holes=[];
    for(let r=0;r<3;r++){
      for(let c=0;c<3;c++){
        const hole=document.createElement('div');
        const pct=100/3;
        hole.style.cssText=`position:absolute;width:26%;height:26%;left:${c*33+3.5}%;top:${r*33+3.5}%;border-radius:50%;background:#1a0e06;border:2px solid #2a1a0a;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,7vw,28px);cursor:pointer;user-select:none;transition:transform .1s;`;
        hole.dataset.r=r; hole.dataset.c=c;
        hole.addEventListener('click', ()=>whack(hole, idx));
        arena.appendChild(hole);
        holes.push(hole);
      }
    }

    const bar=document.createElement('div');
    bar.style.cssText='position:absolute;bottom:0;left:0;height:3px;background:#f7971e;width:100%;transition:width 25s linear;z-index:3;';
    arena.appendChild(bar);
    requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='0%'));

    clearInterval(tick); clearTimeout(moleTimer);
    tick=setInterval(()=>{ timeLeft--; if(timeLeft<=0){clearInterval(tick);clearTimeout(moleTimer);endMole(idx);} },1000);
    scheduleMole(holes, idx);
  }

  function scheduleMole(holes, i) {
    const delay=Math.max(300, 900-(25-timeLeft)*28);
    moleTimer=setTimeout(()=>{
      // hide all
      holes.forEach(h=>{ h.textContent=''; h.style.background='#1a0e06'; });
      // pick random
      const h=holes[Math.floor(Math.random()*holes.length)];
      h.textContent='🦔';
      h.style.transform='scale(1.1)';
      h.dataset.active='1';
      // auto-hide after a bit
      setTimeout(()=>{
        if(h.dataset.active==='1'){ h.textContent=''; h.style.transform=''; h.dataset.active='0'; }
        if(timeLeft>0) scheduleMole(holes, i);
      }, delay*1.4);
    }, delay);
  }

  function whack(hole, i) {
    if(hole.dataset.active==='1'){
      hole.dataset.active='0';
      hole.textContent='💥';
      hole.style.transform='scale(1.2)';
      setTimeout(()=>{ hole.textContent=''; hole.style.transform=''; },220);
      score++; setScore(i, score);
    }
  }

  function endMole(i) {
    showOverlay(arena, score, 'попаданий', '#f7971e', start);
  }

  start(); return { onFocus: start };
}

// ══════════════════════════════════════
//  GAME: FLAPPY — лети!
// ══════════════════════════════════════
function buildFlappy(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let canvas, ctx, bird, pipes, score, running, raf;
  let W, H;
  const GAP=100, PIPE_W=38, SPEED=2.6;

  function start() {
    arena.innerHTML='';
    canvas=document.createElement('canvas');
    canvas.style.cssText='flex:1;width:100%;display:block;border-radius:14px;min-height:0;';
    arena.appendChild(canvas);
    requestAnimationFrame(() => {
    W=arena.offsetWidth; H=arena.offsetHeight||arena.offsetWidth;
    canvas.width=W; canvas.height=H;
    ctx=canvas.getContext('2d');
    bird={y:H/2, vy:0, r:14};
    pipes=[{x:W+50, gapY: H*0.25+Math.random()*(H*0.5)}];
    score=0; running=true; setScore(idx,0);
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e=>{ e.preventDefault(); flap(); },{passive:false});
    raf=requestAnimationFrame(loop);
    }); // end sizing rAF
  }

  function flap(){ if(running) bird.vy=-7; }

  function loop() {
    if(!running) return;
    update(); draw();
    raf=requestAnimationFrame(loop);
  }

  function update() {
    bird.vy+=0.38; bird.y+=bird.vy;
    if(bird.y-bird.r<0||bird.y+bird.r>H){ end(); return; }

    pipes.forEach(p=>{ p.x-=SPEED; });
    // spawn
    if(pipes[pipes.length-1].x<W-170) pipes.push({x:W+10, gapY:H*0.22+Math.random()*(H*0.56)});
    // remove offscreen
    if(pipes[0].x<-PIPE_W-5) pipes.shift();

    for(const p of pipes){
      // score when passing center
      if(p.x+PIPE_W/2<W/2 && !p.scored){ p.scored=true; score++; setScore(idx,score); }
      // collision
      if(bird.x===undefined) bird.x=W/3;
      const bx=W/3;
      if(bx+bird.r>p.x && bx-bird.r<p.x+PIPE_W){
        if(bird.y-bird.r<p.gapY-GAP/2 || bird.y+bird.r>p.gapY+GAP/2){ end(); return; }
      }
    }
  }

  function draw() {
    ctx.fillStyle='#0a0a04'; ctx.fillRect(0,0,W,H);
    // pipes
    pipes.forEach(p=>{
      ctx.fillStyle='#4a9e1e';
      ctx.fillRect(p.x,0,PIPE_W,p.gapY-GAP/2);
      ctx.fillRect(p.x,p.gapY+GAP/2,PIPE_W,H);
      // pipe cap
      ctx.fillStyle='#5ab82a';
      ctx.fillRect(p.x-4,p.gapY-GAP/2-12,PIPE_W+8,12);
      ctx.fillRect(p.x-4,p.gapY+GAP/2,PIPE_W+8,12);
    });
    // bird
    ctx.shadowColor='#ffd200'; ctx.shadowBlur=8;
    ctx.font=`${bird.r*2}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🐤',W/3,bird.y);
    ctx.shadowBlur=0;
    // score
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='bold 14px var(--font-mono)';
    ctx.textAlign='left'; ctx.fillText(`✕${score}`,10,20);
  }

  function end() {
    running=false; cancelAnimationFrame(raf);
    canvas.removeEventListener('click',flap);
    showOverlay(arena, score, 'очков', '#ffd200', start);
  }

  start(); return { onFocus: start };
}

// ══════════════════════════════════════
//  GAME: CODE — запомни и введи код
// ══════════════════════════════════════
function buildCode(idx) {
  const arena = document.getElementById(`arena-${idx}`);
  let round=0, score=0;

  function start() {
    round=0; score=0; setScore(idx,0);
    nextRound(idx);
  }

  function nextRound(i) {
    round++;
    const len=Math.min(3+round, 7);
    const code=Array.from({length:len},()=>Math.floor(Math.random()*10)).join('');
    arena.innerHTML=''; 

    const wrap=document.createElement('div');
    wrap.className='game-inner';

    const rndLabel=document.createElement('div');
    rndLabel.style.cssText='font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);';
    rndLabel.textContent=`Раунд ${round} · ${len} цифр`;

    const codeDisp=document.createElement('div');
    codeDisp.style.cssText='font-family:var(--font-mono);font-size:clamp(32px,12vw,52px);font-weight:700;letter-spacing:8px;color:#ff9a00;text-align:center;padding:10px 0;';
    codeDisp.textContent=code;

    const hint=document.createElement('div');
    hint.style.cssText='font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--sub);';
    hint.id=`code-hint-${i}`;
    hint.textContent='Запомни…';

    const inp=document.createElement('input');
    inp.type='number'; inp.inputMode='numeric';
    inp.style.cssText='width:100%;background:#110a04;border:2px solid rgba(255,154,0,.3);border-radius:10px;padding:12px;color:var(--text);font-family:var(--font-mono);font-size:clamp(22px,7vw,30px);font-weight:700;text-align:center;outline:none;-webkit-appearance:none;letter-spacing:6px;';
    inp.placeholder='_ _ _ _';
    inp.style.display='none';
    inp.addEventListener('focus',()=>inp.style.borderColor='#ff9a00');
    inp.addEventListener('blur',()=>inp.style.borderColor='rgba(255,154,0,.3)');

    const checkBtn=document.createElement('button');
    checkBtn.style.cssText='width:100%;padding:13px;border-radius:10px;border:none;background:#ff9a00;color:#000;font-family:var(--font-display);font-size:15px;font-weight:700;cursor:pointer;display:none;transition:transform .1s;';
    checkBtn.textContent='Проверить';
    checkBtn.addEventListener('click',()=>checkCode(inp.value, code, i));
    checkBtn.addEventListener('touchstart',()=>checkBtn.style.transform='scale(.95)',{passive:true});
    checkBtn.addEventListener('touchend',()=>checkBtn.style.transform='',{passive:true});

    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkCode(inp.value,code,i); });

    wrap.appendChild(rndLabel); wrap.appendChild(codeDisp);
    wrap.appendChild(hint); wrap.appendChild(inp); wrap.appendChild(checkBtn);
    arena.appendChild(wrap);

    // Show code for (1s + 0.4s per digit), then hide
    const showMs = 1000 + len * 400;
    setTimeout(()=>{
      codeDisp.style.filter='blur(8px)';
      codeDisp.style.transition='filter .4s';
      hint.textContent='Введи код!';
      inp.style.display='block'; checkBtn.style.display='block';
      setTimeout(()=>inp.focus(), 100);
    }, showMs);
  }

  function checkCode(val, code, i) {
    const hint=document.getElementById(`code-hint-${i}`);
    if(String(val).trim()===code){
      score++; setScore(i, score);
      if(hint) hint.textContent='✅ Правильно!';
      setTimeout(()=>nextRound(i), 700);
    } else {
      if(hint){ hint.textContent=`❌ Было: ${code}`; hint.style.color='var(--a1)'; }
      setTimeout(()=>showOverlay(arena, score, 'раундов', '#ff9a00', start), 1200);
    }
  }

  start(); return { onFocus: start };
}
